name: zh-CN Release v0.1.82

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful zh-CN Full Content Validation run containing release assets
        required: true
        default: "40459988804"

permissions:
  contents: write

concurrency:
  group: zh-cn-release-v0-1-82
  cancel-in-progress: false

jobs:
  publish-release:
    name: Publish v0.1.82
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
      - name: Set Git Safe Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Download Validated Build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.artifact_run_id }}
        run: gh run download "$RUN_ID" -n zh-cn-validation -D release-assets
      - name: Verify Release Assets
        run: |
          find release-assets -type f -maxdepth 4 -print
          test -f release-assets/build/zipfile/scap-security-guide-0.1.82.zip
          test -f release-assets/build/zipfile/scap-security-guide-0.1.82.tar.gz
          test -f release-assets/build/ssg-ubuntu2404-ds.xml
          test -f release-assets/zh-cn-validation.json
          grep -q '>0.1.82<' release-assets/build/ssg-ubuntu2404-ds.xml
          cd release-assets
          sha256sum \
            build/zipfile/scap-security-guide-0.1.82.zip \
            build/zipfile/scap-security-guide-0.1.82.tar.gz \
            build/ssg-ubuntu2404-ds.xml \
            zh-cn-validation.json > SHA256SUMS
      - name: Prepare Release Notes
        run: |
          cat > release-notes.md <<'MD'
          ## ComplianceAsCode Content 0.1.82 简体中文版

          - 版本号与上游最新 Release `v0.1.82` 对齐。
          - 内容基线：`ComplianceAsCode/content` `master@e4083bb6e9b61bb7aed4981ec12c8e53dda84c4d`。
          - 内容提交：`4c6606bd10`。
          - 覆盖 2,566 个生产规则，共 5,132 个 Description/Rationale 字段。
          - 英文原文保留在前，简体中文追加在后；命令、路径、宏参数和代码保持原样。
          - 已通过全产品构建、ctest、Gate、Gate Fedora、Gate Thin DS、Ruff 和 Ubuntu 24.04 DataStream 中文校验。
          - 本版本为社区 AI 辅助翻译，不是上游官方中文版。

          ### 资产

          - `scap-security-guide-0.1.82.zip`：完整构建内容包。
          - `scap-security-guide-0.1.82.tar.gz`：完整构建内容包。
          - 对应 `.sha512` 校验文件。
          - `ssg-ubuntu2404-ds.xml`：Ubuntu 24.04 DataStream。
          - `zh-cn-validation.json`：Ubuntu DataStream 中文覆盖校验摘要。
          - `coverage.json`：全仓库中文翻译覆盖统计。
          - `SHA256SUMS`：主要发布资产 SHA256。

          翻译说明与术语表见仓库中的 `TRANSLATION.md` 和 `translations/zh-CN/glossary.md`。
          MD
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_COMMIT=4c6606bd10
          if gh release view v0.1.82 >/dev/null 2>&1; then
            gh release delete v0.1.82 --yes --cleanup-tag
          fi
          git config user.name "scott-wong"
          git config user.email "scott-wong@users.noreply.github.com"
          git tag -fa v0.1.82 "$RELEASE_COMMIT" -m "ComplianceAsCode Content 0.1.82 Simplified Chinese"
          git push origin refs/tags/v0.1.82 --force
          gh release create v0.1.82 \
            release-assets/build/zipfile/scap-security-guide-0.1.82.zip \
            release-assets/build/zipfile/scap-security-guide-0.1.82.zip.sha512 \
            release-assets/build/zipfile/scap-security-guide-0.1.82.tar.gz \
            release-assets/build/zipfile/scap-security-guide-0.1.82.tar.gz.sha512 \
            release-assets/build/ssg-ubuntu2404-ds.xml \
            release-assets/zh-cn-validation.json \
            release-assets/SHA256SUMS \
            translations/zh-CN/coverage.json \
            --title "Content 0.1.82 简体中文版" \
            --notes-file release-notes.md \
            --latest
