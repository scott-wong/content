{{%- if 'ubuntu' in product or 'debian' in product %}}
  {{%- set package = "tftp-hpa" %}}
{{%- else %}}
  {{%- set package = "tftp" %}}
{{%- endif %}}

documentation_complete: true


title: 'Remove {{{ package }}} Daemon'

description: |-
    Trivial File Transfer Protocol (TFTP) is a simple file transfer protocol,
    typically used to automatically transfer configuration or boot files between systems.
    TFTP does not support authentication and can be easily hacked. The package
    <tt>{{{ package }}}</tt> is a client program that allows for connections to a <tt>{{{ package }}}</tt> server.

    <p><strong>中文说明：</strong></p>
    Trivial File Transfer Protocol（TFTP）是一种简单的文件传输协议，通常用于在系统之间自动传输配置或引导文件。TFTP 不支持身份验证，容易遭到攻击。软件包 <tt>{{{ package }}}</tt> 是一个客户端程序，允许连接到 <tt>{{{ package }}}</tt> 服务器。

rationale: |-
    It is recommended that TFTP be removed, unless there is a specific need
    for TFTP (such as a boot server). In that case, use extreme caution when configuring
    the services.

    <p><strong>中文理由：</strong></p>
    建议删除 TFTP，除非有特定需要（例如引导服务器）。在这种情况下，配置服务时应格外谨慎。

severity: low

identifiers:
    cce@rhel8: CCE-83590-0
    cce@rhel9: CCE-84153-6
    cce@rhel10: CCE-88586-3
    cce@sle12: CCE-91465-5
    cce@sle15: CCE-91158-6
    cce@sle16: CCE-96201-9

references:
    srg: SRG-OS-000074-GPOS-00042


ocil: '{{{ describe_package_remove(package=package) }}}'

template:
    name: package_removed
    vars:
        pkgname: {{{ package }}}
