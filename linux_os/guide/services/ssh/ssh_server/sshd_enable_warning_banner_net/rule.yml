documentation_complete: true

title: 'Enable SSH Warning Banner'

description: |-
    To enable the warning banner and ensure it is consistent
    across the system, add or correct the following line in
    {{% if sshd_distributed_config == "true" %}}
    <tt>/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf</tt>:
    {{% else %}}
    <tt>/etc/ssh/sshd_config</tt>:
    {{% endif %}}
    <pre>Banner /etc/issue.net</pre>
    Another section contains information on how to create an
    appropriate system-wide warning banner.

    <p><strong>中文说明：</strong></p>
    <p>要启用警告横幅并确保整个系统一致，请在
    {{% if sshd_distributed_config == "true" %}}
    <tt>/etc/ssh/sshd_config.d/00-complianceascode-hardening.conf</tt> 中添加或更正以下行：
    {{% else %}}
    <tt>/etc/ssh/sshd_config</tt> 中添加或更正以下行：
    {{% endif %}}</p>
    <pre>Banner /etc/issue.net</pre>
    另一节包含有关如何创建适当的系统级警告横幅的信息。

rationale: |-
    The warning message reinforces policy awareness during the logon process and
    facilitates possible legal action against attackers. Alternatively, systems
    whose ownership should not be obvious should ensure usage of a banner that does
    not provide easy attribution.

    <p><strong>中文理由：</strong></p>
    <p>警告消息可在登录过程中强化策略意识，并便于对攻击者采取可能的法律行动。或者，如果系统所有者身份不应显而易见，则系统应确保使用不会轻易暴露归属信息的横幅。</p>

severity: medium

identifiers:
    cce@rhel8: CCE-87978-3
    cce@rhel9: CCE-87979-1
    cce@rhel10: CCE-88799-2

