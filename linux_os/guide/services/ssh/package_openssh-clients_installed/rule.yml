    ospp: FIA_UAU.5,FTP_ITC_EXT.1,FCS_SSH_EXT.1,FCS_SSHC_EXT.1
    srg: SRG-OS-000480-GPOS-00227

{{{ complete_ocil_entry_package_installed(package) }}}

fixtext: '{{{ fixtext_package_removed(package) }}}'

