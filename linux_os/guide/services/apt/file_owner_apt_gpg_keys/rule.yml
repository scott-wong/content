documentation_complete: true

title: 'Verify Owner on APT GPG Key Files'

description: |-
    {{{ describe_file_owner(file="/usr/share/keyrings/*.gpg and /etc/apt/trusted.gpg.d/*.gpg", owner="root") }}}

    <p><strong>中文说明：</strong></p>
    <p><tt>/usr/share/keyrings/*.gpg</tt> 和 <tt>/etc/apt/trusted.gpg.d/*.gpg</tt> 必须由 <tt>root</tt> 所有。</p>

rationale: |-
    APT GPG key files should be owned by root to prevent unauthorized modification
    of package trust anchors.

    <p><strong>中文理由：</strong></p>
    <p>APT GPG 密钥文件的所有者必须为 <tt>root</tt>，以防止软件包信任锚被未经授权修改。</p>

severity: medium

ocil_clause: 'APT GPG key files are not owned by root'

ocil: |-
    {{{ ocil_file_owner(file="/usr/share/keyrings/*.gpg and /etc/apt/trusted.gpg.d/*.gpg", owner="root") }}}

fixtext: '{{{ fixtext_file_owner(file="/usr/share/keyrings/*.gpg and /etc/apt/trusted.gpg.d/*.gpg", owner="root") }}}'

template:
    name: file_owner
    vars:
        filepath:
            - /usr/share/keyrings/
            - /etc/apt/trusted.gpg.d/
        file_regex:
            - ^.*\.gpg$
            - ^.*\.gpg$
        uid_or_name: '0'
