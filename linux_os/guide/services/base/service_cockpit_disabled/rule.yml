documentation_complete: true


title: 'Disable Cockpit Management Server'

description: |-
    The Cockpit Management Server (<tt>cockpit</tt>) provides a web based
    login and management framework.
    {{{ describe_service_disable(service="cockpit") }}}

    <p><strong>中文说明：</strong></p>
    <p>Cockpit Management Server（<tt>cockpit</tt>）提供基于 Web 的登录和管理框架。
    应禁用 <tt>cockpit</tt> 服务。</p>

rationale: |-
    Cockpit provides a form of remote login.

    <p><strong>中文理由：</strong></p>
    <p>Cockpit 提供一种远程登录方式。</p>

severity: medium

identifiers:
    cce@rhel8: CCE-89026-9
    cce@rhel10: CCE-87509-6

platform: system_with_kernel

ocil_clause: |-
    {{{ ocil_clause_service_disabled(service="cockpit") }}}

ocil: |-
    {{{ ocil_service_disabled(service="cockpit") }}}

template:
    name: service_disabled
    vars:
        servicename: cockpit
        packagename: cockpit
