{{%- if 'ubuntu' in product or 'debian' in product %}}
  {{%- set package = "nfs-common" %}}
{{%- else %}}
  {{%- set package = "nfs-utils" %}}
{{%- endif %}}

documentation_complete: true


title: 'Uninstall {{{ package }}} Package'

description: |-
    {{{ describe_package_remove(package=package) }}}

    <p><strong>中文说明：</strong></p>
    <p>应移除 <tt>{{{ package }}}</tt> 软件包。</p>

rationale: |-
    <tt>{{{ package }}}</tt> provides a daemon for the kernel NFS server and related tools. This
    package also contains the <tt>showmount</tt> program. <tt>showmount</tt> queries the mount
    daemon on a remote host for information about the Network File System (NFS) server on the
    remote host. For example, <tt>showmount</tt> can display the clients which are mounted on
    that host.

    <p><strong>中文理由：</strong></p>
    <p><tt>{{{ package }}}</tt> 提供内核 NFS 服务器守护进程及相关工具。此软件包还包含 <tt>showmount</tt> 程序。<tt>showmount</tt> 会查询远程主机上的挂载守护进程，以获取该远程主机上网络文件系统（NFS）服务器的信息。例如，<tt>showmount</tt> 可以显示已挂载到该主机上的客户端。</p>

severity: low

identifiers:
    cce@rhel8: CCE-82932-5
    cce@rhel9: CCE-84243-5
    cce@rhel10: CCE-88270-4
    cce@sle12: CCE-91641-1
    cce@sle15: CCE-91284-0
    cce@slmicro5: CCE-93911-6

references:
    cis@sle12: 2.2.7
    cis@sle15: 2.2.7
    srg: SRG-OS-000095-GPOS-00049

{{{ complete_ocil_entry_package_removed(package) }}}

fixtext: '{{{ fixtext_package_removed(package) }}}'

srg_requirement: '{{{ srg_requirement_package_removed(package) }}}'

template:
    name: package_removed
    vars:
        pkgname: {{{ package }}}
