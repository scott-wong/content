documentation_complete: true

title: "Disable Samba"

description: |-
    {{{ describe_service_disable(service="smb") }}}

    <p><strong>中文说明：</strong></p>
    <p>要禁用 <tt>smb</tt> 服务，请运行 <tt>sudo systemctl disable --now smb</tt>。</p>

rationale: |-
    Running a Samba server provides a network-based avenue of attack, and
    should be disabled if not needed.

    <p><strong>中文理由：</strong></p>
    <p>运行 Samba 服务器会提供基于网络的攻击途径，如果不需要，应将其禁用。</p>

severity: low

identifiers:
    cce@rhel8: CCE-82759-2
    cce@rhel9: CCE-84201-3
    cce@sle12: CCE-92250-0
    cce@sle15: CCE-91370-7
    cce@slmicro5: CCE-93892-8

references:
    cis@sle12: 2.2.13
    cis@sle15: 2.2.13

ocil_clause: |-
    {{{ ocil_clause_service_disabled(service="smb") }}}

ocil: |-
    {{{ ocil_service_disabled(service="smb") }}}

platform: system_with_kernel

template:
    name: service_disabled
    vars:
        servicename: smb
        servicename@debian13: smbd
        servicename@ubuntu2204: smbd
        servicename@ubuntu2404: smbd
        packagename: samba
