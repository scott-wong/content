documentation_complete: true


title: 'Set Permissions on the /etc/httpd/conf/ Directory'

description: |-
    {{{ describe_file_permissions(file="/etc/http/conf", perms="0750") }}}

    <p><strong>中文说明：</strong></p>
    目录 <tt>/etc/http/conf</tt> 的权限必须为 <tt>0750</tt>。可使用 <tt>sudo chmod 0750 /etc/http/conf</tt> 设置该权限。

rationale: |-
    Access to the web server's configuration files may allow an unauthorized user or attacker
    to access information about the web server or alter the server's configuration files.

    <p><strong>中文理由：</strong></p>
    访问 Web 服务器的配置文件可能使未授权用户或攻击者获取 Web 服务器信息，或更改服务器配置文件。

severity: unknown

ocil: |-
    {{{ ocil_file_permissions(file="/etc/http/conf", perms="-rwxr-x---") }}}
