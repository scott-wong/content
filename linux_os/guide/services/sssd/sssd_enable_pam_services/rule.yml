documentation_complete: true


title: 'Configure PAM in SSSD Services'

description: |-
    SSSD should be configured to run SSSD <tt>pam</tt> services.
    To configure SSSD to known SSH hosts, add <tt>pam</tt>
    to <tt>services</tt> under the <tt>[sssd]</tt> section in
    <tt>/etc/sssd/sssd.conf</tt>. For example:
    <pre>[sssd]
    services = sudo, autofs, pam
    </pre>

    <p><strong>中文说明：</strong></p>
    应将 SSSD 配置为运行 SSSD <tt>pam</tt> 服务。要将 SSSD 配置为使用已知 SSH 主机，请在 <tt>/etc/sssd/sssd.conf</tt> 的 <tt>[sssd]</tt> 节下的 <tt>services</tt> 中添加 <tt>pam</tt>。例如：
    <pre>[sssd]
    services = sudo, autofs, pam
    </pre>

rationale: |-
    Using an authentication device, such as a CAC or token that is separate from
    the information system, ensures that even if the information system is
    compromised, that compromise will not affect credentials stored on the
    authentication device.

    <p><strong>中文理由：</strong></p>
    使用独立于信息系统的身份验证设备（例如 CAC 或令牌）可确保即使信息系统遭到入侵，该入侵也不会影响存储在身份验证设备上的凭据。

