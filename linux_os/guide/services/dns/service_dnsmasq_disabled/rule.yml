documentation_complete: true

title: 'Disable dnsmasq Service'

description: |-
    {{{ describe_service_disable(service="dnsmasq") }}}

    <p><strong>中文说明：</strong></p>
    要禁用 <tt>dnsmasq</tt> 服务，请运行 <tt>sudo systemctl disable --now dnsmasq</tt>。

rationale: |-
    Unless a system is specifically designated to act as a DNS
    caching, DNS forwarding and/or DHCP server, it is recommended
    that the package be removed to reduce the potential attack surface.

    <p><strong>中文理由：</strong></p>
    除非系统被明确指定用作 DNS 缓存、DNS 转发和/或 DHCP 服务器，否则建议移除该软件包以减少潜在攻击面。

severity: medium

identifiers:
    cce@rhel8: CCE-90720-4
    cce@rhel9: CCE-90721-2
    cce@rhel10: CCE-90722-0
    cce@sle15: CCE-92602-2
    cce@slmicro6: CCE-94772-1

platform: system_with_kernel

template:
    name: service_disabled
    vars:
        servicename: dnsmasq
