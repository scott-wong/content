documentation_complete: true

title: 'Uninstall unbound Package'

description: |-
    The <tt>named</tt> service is provided by the <tt>unbound</tt> package.
    {{{ describe_package_remove(package="unbound") }}}

    <p><strong>中文说明：</strong></p>
    <tt>named</tt> 服务由 <tt>unbound</tt> 软件包提供。
    请使用适当的软件包管理工具移除 <tt>unbound</tt> 软件包。

rationale: |-
    If there is no need to make DNS server software available,
    removing it provides a safeguard against its activation.

    <p><strong>中文理由：</strong></p>
    如果无需提供 DNS 服务器软件，移除该软件可防止其被激活。

severity: low

identifiers:
    cce@rhel10: CCE-86181-5


references:
    nist: CM-7(a),CM-7(b),CM-6(a)
    srg: SRG-OS-000480-GPOS-00227

template:
    name: package_removed
    vars:
        pkgname: unbound
