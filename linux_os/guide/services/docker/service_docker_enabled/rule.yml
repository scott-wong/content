documentation_complete: true


title: 'Enable the Docker service'

description: |-
    The docker service is commonly needed to
      create containers.
    {{{ describe_service_enable(service="docker") }}}

    <p><strong>中文说明：</strong></p>
    <p>通常需要 docker 服务来创建容器。
    要启用 <tt>docker</tt> 服务，请运行 <tt>sudo systemctl enable --now docker</tt>。</p>

rationale: |-
    To be able to find any problems with misconfiguration of
    the docker daemon and running containers, the docker service
    has to be enabled.

    <p><strong>中文理由：</strong></p>
    <p>要发现 docker 守护进程和运行中的容器配置错误带来的任何问题，必须启用 docker 服务。</p>

severity: medium

ocil: |-
    {{{ ocil_service_enabled(service="docker") }}}

platform: machine

template:
    name: service_enabled
    vars:
        servicename: docker
