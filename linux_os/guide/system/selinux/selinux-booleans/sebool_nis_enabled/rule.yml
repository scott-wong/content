documentation_complete: true


title: 'Disable the nis_enabled SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>nis_enabled</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="nis_enabled") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>nis_enabled</tt> 处于禁用状态。如果此设置已启用，应将其禁用。要禁用 <tt>nis_enabled</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P nis_enabled off</tt></p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>禁用后，可防止系统使用 NIS，减少这种较旧且缺乏现代安全保护的身份信息来源带来的风险。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="nis_enabled") }}}

template:
    name: sebool
    vars:
        seboolid: nis_enabled
