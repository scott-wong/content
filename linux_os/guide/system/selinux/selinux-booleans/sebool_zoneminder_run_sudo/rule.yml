documentation_complete: true


title: 'Disable the zoneminder_run_sudo SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>zoneminder_run_sudo</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="zoneminder_run_sudo") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>zoneminder_run_sudo</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P zoneminder_run_sudo off</tt> 将其禁用。

rationale: |-
    <p><strong>中文理由：</strong></p>
    启用此布尔值会允许 ZoneMinder 运行 sudo，可能造成权限提升并跨越 SELinux 权限边界。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="zoneminder_run_sudo") }}}

template:
    name: sebool
    vars:
        seboolid: zoneminder_run_sudo
