documentation_complete: true


title: 'Disable the httpd_tmp_exec SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>httpd_tmp_exec</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="httpd_tmp_exec") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>httpd_tmp_exec</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P httpd_tmp_exec off</tt> 将其禁用。

rationale: |-
    <p><strong>中文理由：</strong></p>
    启用此布尔值会允许 Web 服务器从临时目录执行内容，增加恶意代码执行风险。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="httpd_tmp_exec") }}}

template:
    name: sebool
    vars:
        seboolid: httpd_tmp_exec
