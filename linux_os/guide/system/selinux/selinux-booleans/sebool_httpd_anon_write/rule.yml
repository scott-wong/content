documentation_complete: true


title: 'Disable the httpd_anon_write SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>httpd_anon_write</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="httpd_anon_write") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>httpd_anon_write</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P httpd_anon_write off</tt> 将其禁用。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>启用此布尔值会允许匿名写入 Web 服务器内容，可能导致未授权修改或数据泄露。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="httpd_anon_write") }}}

template:
    name: sebool
    vars:
        seboolid: httpd_anon_write
