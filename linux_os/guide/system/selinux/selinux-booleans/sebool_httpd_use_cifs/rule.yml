documentation_complete: true


title: 'Disable the httpd_use_cifs SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>httpd_use_cifs</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="httpd_use_cifs") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>httpd_use_cifs</tt> 处于禁用状态。如果此设置已启用，应将其禁用。要禁用 <tt>httpd_use_cifs</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P httpd_use_cifs off</tt>

rationale: |-
    <p><strong>中文理由：</strong></p>
    禁用后，可防止 httpd 访问 CIFS/SMB 挂载，避免 Web 服务跨共享读取或写入数据并扩大攻击面。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="httpd_use_cifs") }}}

template:
    name: sebool
    vars:
        seboolid: httpd_use_cifs
