documentation_complete: true


title: 'Disable the cluster_can_network_connect SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>cluster_can_network_connect</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="cluster_can_network_connect") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>cluster_can_network_connect</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>cluster_can_network_connect</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P cluster_can_network_connect off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许集群组件发起任意网络连接会扩大网络攻击面；除非明确需要，否则应保持禁用。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="cluster_can_network_connect") }}}

template:
    name: sebool
    vars:
        seboolid: cluster_can_network_connect
