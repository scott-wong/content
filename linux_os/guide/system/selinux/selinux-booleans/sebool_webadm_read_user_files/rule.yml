documentation_complete: true


title: 'Disable the webadm_read_user_files SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>webadm_read_user_files</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="webadm_read_user_files") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>webadm_read_user_files</tt> 处于禁用状态。如果启用了此设置，则应将其禁用。要禁用 <tt>webadm_read_user_files</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P webadm_read_user_files off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许 Web 管理员读取用户文件可能暴露敏感数据并扩大访问范围。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="webadm_read_user_files") }}}

template:
    name: sebool
    vars:
        seboolid: webadm_read_user_files
