documentation_complete: true


title: 'Disable the httpd_can_connect_ldap SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>httpd_can_connect_ldap</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="httpd_can_connect_ldap") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>httpd_can_connect_ldap</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P httpd_can_connect_ldap off</tt> 将其禁用。

rationale: |-
    <p><strong>中文理由：</strong></p>
    启用此布尔值会允许 Web 服务器连接到 LDAP 服务，扩大目录服务和凭据相关风险。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="httpd_can_connect_ldap") }}}

template:
    name: sebool
    vars:
        seboolid: httpd_can_connect_ldap
