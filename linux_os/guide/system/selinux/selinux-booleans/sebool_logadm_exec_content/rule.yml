documentation_complete: true


title: 'Enable the logadm_exec_content SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>logadm_exec_content</tt> is enabled.
    If this setting is disabled, it should be enabled.
    {{{ describe_sebool_enable(sebool="logadm_exec_content") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>logadm_exec_content</tt> 处于启用状态。如果此设置已禁用，应启用。要启用 <tt>logadm_exec_content</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P logadm_exec_content on</tt>

rationale: |-
    <p><strong>中文理由：</strong></p>
    启用后，可允许 logadm 执行其日志管理功能所需的内容操作，同时仍受 SELinux 策略约束。

severity: medium

{{{ complete_ocil_entry_sebool_enabled(sebool="logadm_exec_content") }}}

template:
    name: sebool
    vars:
        seboolid: logadm_exec_content
