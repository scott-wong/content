documentation_complete: true


title: 'Disable the boinc_execmem SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>boinc_execmem</tt> is enabled.
    This setting should be disabled.
    {{{ describe_sebool_disable(sebool="boinc_execmem") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>boinc_execmem</tt> 为 enabled。应禁用此设置。要禁用 <tt>boinc_execmem</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P boinc_execmem off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许 BOINC 映射可执行内存会增加可被利用以执行恶意代码的内存区域。</p>

severity: medium

identifiers:
    cce@rhel8: CCE-83304-6


{{{ complete_ocil_entry_sebool_disabled(sebool="boinc_execmem") }}}

template:
    name: sebool
    vars:
        seboolid: boinc_execmem
