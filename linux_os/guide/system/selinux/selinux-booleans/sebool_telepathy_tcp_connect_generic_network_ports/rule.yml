documentation_complete: true


title: 'Disable the telepathy_tcp_connect_generic_network_ports SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>telepathy_tcp_connect_generic_network_ports</tt> is enabled.
    This setting should be disabled as <tt>telepathy</tt> should not connect to any generic network
    ports.
    {{{ describe_sebool_disable(sebool="telepathy_tcp_connect_generic_network_ports") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>telepathy_tcp_connect_generic_network_ports</tt> 为 enabled。应禁用此设置，因为 <tt>telepathy</tt> 不应连接到任何通用网络端口。要禁用 <tt>telepathy_tcp_connect_generic_network_ports</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P telepathy_tcp_connect_generic_network_ports off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>Telepathy 不应连接到任何通用网络端口；禁用此布尔值可减少不必要的网络暴露。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="telepathy_tcp_connect_generic_network_ports") }}}

template:
    name: sebool
    vars:
        seboolid: telepathy_tcp_connect_generic_network_ports
