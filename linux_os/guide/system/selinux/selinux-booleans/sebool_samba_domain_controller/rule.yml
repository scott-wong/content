documentation_complete: true


title: 'Disable the samba_domain_controller SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>samba_domain_controller</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="samba_domain_controller") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>samba_domain_controller</tt> 处于禁用状态。如果该设置为启用状态，应将其禁用。
    应禁用 SELinux 布尔值 <tt>samba_domain_controller</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    仅在主机需要充当 Samba 域控制器时启用此布尔值；否则应禁用，以减少网络服务攻击面。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="samba_domain_controller") }}}

template:
    name: sebool
    vars:
        seboolid: samba_domain_controller
