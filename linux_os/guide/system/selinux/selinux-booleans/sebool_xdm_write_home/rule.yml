documentation_complete: true


title: 'Disable the xdm_write_home SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>xdm_write_home</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="xdm_write_home") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>xdm_write_home</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>xdm_write_home</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P xdm_write_home off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许 XDM 写入用户主目录会扩大显示管理器修改用户数据的权限。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="xdm_write_home") }}}

template:
    name: sebool
    vars:
        seboolid: xdm_write_home
