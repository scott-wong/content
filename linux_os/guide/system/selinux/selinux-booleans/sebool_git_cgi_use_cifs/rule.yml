documentation_complete: true


title: 'Disable the git_cgi_use_cifs SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>git_cgi_use_cifs</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="git_cgi_use_cifs") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>git_cgi_use_cifs</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P git_cgi_use_cifs off</tt> 将其禁用。

rationale: |-
    <p><strong>中文理由：</strong></p>
    启用此布尔值会允许 Git CGI 进程访问 CIFS 共享，扩大远程文件系统访问范围。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="git_cgi_use_cifs") }}}

template:
    name: sebool
    vars:
        seboolid: git_cgi_use_cifs
