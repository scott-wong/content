documentation_complete: true


title: 'Disable the staff_use_svirt SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>staff_use_svirt</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="staff_use_svirt") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>staff_use_svirt</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>staff_use_svirt</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P staff_use_svirt off</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    允许 staff 用户管理虚拟机服务会扩大其权限；除非明确需要，否则应保持禁用。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="staff_use_svirt") }}}

template:
    name: sebool
    vars:
        seboolid: staff_use_svirt
