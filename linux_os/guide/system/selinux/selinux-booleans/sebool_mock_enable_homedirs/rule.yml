documentation_complete: true


title: 'Disable the mock_enable_homedirs SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>mock_enable_homedirs</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="mock_enable_homedirs") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>mock_enable_homedirs</tt> 处于禁用状态。如果此设置已启用，应将其禁用。要禁用 <tt>mock_enable_homedirs</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P mock_enable_homedirs off</tt>

rationale: |-
    <p><strong>中文理由：</strong></p>
    禁用后，可防止 mock 访问用户主目录，减少构建环境读取用户个人文件的风险。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="mock_enable_homedirs") }}}

template:
    name: sebool
    vars:
        seboolid: mock_enable_homedirs
