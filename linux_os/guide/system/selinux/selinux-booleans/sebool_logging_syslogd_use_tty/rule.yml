documentation_complete: true


title: 'Enable the logging_syslogd_use_tty SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>logging_syslogd_use_tty</tt> is enabled.
    If this setting is disabled, it should be enabled as it allows <tt>syslog</tt>
    the ability to read/write to terminal.
    {{{ describe_sebool_enable(sebool="logging_syslogd_use_tty") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>logging_syslogd_use_tty</tt> 处于启用状态。如果此设置已禁用，应启用，因为它允许 <tt>syslog</tt> 读写终端。要启用 <tt>logging_syslogd_use_tty</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P logging_syslogd_use_tty on</tt></p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>启用后，可允许 syslog 读写终端，这是控制台日志和诊断所需的，同时仍由 SELinux 域策略限制。</p>

severity: medium

{{{ complete_ocil_entry_sebool_enabled(sebool="logging_syslogd_use_tty") }}}

template:
    name: sebool
    vars:
        seboolid: logging_syslogd_use_tty
