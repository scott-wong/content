documentation_complete: true


title: 'Disable the neutron_can_network SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>neutron_can_network</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="neutron_can_network") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>neutron_can_network</tt> 处于禁用状态。如果此设置已启用，应将其禁用。要禁用 <tt>neutron_can_network</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P neutron_can_network off</tt></p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>禁用后，可防止 Neutron 发起任意网络连接，减少网络管理服务被利用进行横向移动的风险。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="neutron_can_network") }}}

template:
    name: sebool
    vars:
        seboolid: neutron_can_network
