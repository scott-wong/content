documentation_complete: true


title: 'Disable the ftpd_connect_db SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>ftpd_connect_db</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="ftpd_connect_db") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>ftpd_connect_db</tt> 处于禁用状态。如果启用了此设置，则应将其禁用。要禁用 <tt>ftpd_connect_db</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P ftpd_connect_db off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许 FTP 守护进程连接数据库会扩大文件传输服务的网络和数据库访问范围。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="ftpd_connect_db") }}}

template:
    name: sebool
    vars:
        seboolid: ftpd_connect_db
