documentation_complete: true


title: 'Disable the zarafa_setrlimit SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>zarafa_setrlimit</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="zarafa_setrlimit") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>zarafa_setrlimit</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P zarafa_setrlimit off</tt> 将其禁用。

rationale: |-
    <p><strong>中文理由：</strong></p>
    启用此布尔值会允许 Zarafa 调整资源限制，授予超出一般邮件服务所需的系统控制能力，并扩大攻击面。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="zarafa_setrlimit") }}}

template:
    name: sebool
    vars:
        seboolid: zarafa_setrlimit
