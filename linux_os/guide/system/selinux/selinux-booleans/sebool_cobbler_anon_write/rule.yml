documentation_complete: true


title: 'Disable the cobbler_anon_write SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>cobbler_anon_write</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="cobbler_anon_write") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>cobbler_anon_write</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>cobbler_anon_write</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P cobbler_anon_write off</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    允许 Cobbler 执行匿名写入会使未经授权的修改影响公共文件。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="cobbler_anon_write") }}}

template:
    name: sebool
    vars:
        seboolid: cobbler_anon_write
