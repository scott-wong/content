documentation_complete: true


title: 'Disable the pppd_can_insmod SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>pppd_can_insmod</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="pppd_can_insmod") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>pppd_can_insmod</tt> 处于禁用状态。如果该设置为启用状态，应将其禁用。
    应禁用 SELinux 布尔值 <tt>pppd_can_insmod</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    禁用此布尔值可防止 pppd 加载内核模块，从而减少权限提升和内核攻击面。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="pppd_can_insmod") }}}

template:
    name: sebool
    vars:
        seboolid: pppd_can_insmod
