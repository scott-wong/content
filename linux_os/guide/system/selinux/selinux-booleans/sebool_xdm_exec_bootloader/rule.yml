documentation_complete: true


title: 'Disable the xdm_exec_bootloader SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>xdm_exec_bootloader</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="xdm_exec_bootloader") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>xdm_exec_bootloader</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>xdm_exec_bootloader</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P xdm_exec_bootloader off</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    允许 XDM 执行引导加载程序会授予显示管理器不必要的特权。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="xdm_exec_bootloader") }}}

template:
    name: sebool
    vars:
        seboolid: xdm_exec_bootloader
