documentation_complete: true


title: 'Disable the fenced_can_network_connect SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>fenced_can_network_connect</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="fenced_can_network_connect") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>fenced_can_network_connect</tt> 处于禁用状态。如果启用了此设置，则应将其禁用。要禁用 <tt>fenced_can_network_connect</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P fenced_can_network_connect off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许 fenced 发起任意网络连接会扩大集群组件的网络攻击面。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="fenced_can_network_connect") }}}

template:
    name: sebool
    vars:
        seboolid: fenced_can_network_connect
