documentation_complete: true


title: 'Disable the virt_sandbox_use_all_caps SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>virt_sandbox_use_all_caps</tt> is enabled.
    This setting is disabled as containers should not run with privileges.
    {{{ describe_sebool_disable(sebool="virt_sandbox_use_all_caps") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>virt_sandbox_use_all_caps</tt> 处于启用状态。应禁用此设置，因为容器不应以特权运行。要禁用 <tt>virt_sandbox_use_all_caps</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P virt_sandbox_use_all_caps off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>以所有能力运行容器会绕过最小权限原则，并扩大容器逃逸或滥用主机资源的影响。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="virt_sandbox_use_all_caps") }}}

template:
    name: sebool
    vars:
        seboolid: virt_sandbox_use_all_caps
