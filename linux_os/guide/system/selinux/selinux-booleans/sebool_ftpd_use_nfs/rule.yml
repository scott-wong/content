documentation_complete: true


title: 'Disable the ftpd_use_nfs SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>ftpd_use_nfs</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="ftpd_use_nfs") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>ftpd_use_nfs</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P ftpd_use_nfs off</tt> 将其禁用。

rationale: |-
    <p><strong>中文理由：</strong></p>
    启用此布尔值会允许 FTP 守护进程访问 NFS 共享，扩大远程文件系统暴露面。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="ftpd_use_nfs") }}}

template:
    name: sebool
    vars:
        seboolid: ftpd_use_nfs
