documentation_complete: true


title: 'Disable the postgresql_selinux_transmit_client_label SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>postgresql_selinux_transmit_client_label</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="postgresql_selinux_transmit_client_label") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>postgresql_selinux_transmit_client_label</tt> 处于禁用状态。如果该设置为启用状态，应将其禁用。
    应禁用 SELinux 布尔值 <tt>postgresql_selinux_transmit_client_label</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>禁用客户端标签传输可减少标签信息暴露，并避免不必要的客户端标签传播。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="postgresql_selinux_transmit_client_label") }}}

template:
    name: sebool
    vars:
        seboolid: postgresql_selinux_transmit_client_label
