documentation_complete: true


title: 'Enable the sysadm_exec_content SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>sysadm_exec_content</tt> is enabled.
    If this setting is disabled, it should be enabled.
    {{{ describe_sebool_enable(sebool="sysadm_exec_content") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>sysadm_exec_content</tt> 为 enabled。如果禁用了此设置，则应将其启用。要启用 <tt>sysadm_exec_content</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P sysadm_exec_content on</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>启用此布尔值可确保系统管理员可以执行管理任务所需的内容，同时仍由 SELinux 策略约束。</p>

severity: medium

{{{ complete_ocil_entry_sebool_enabled(sebool="sysadm_exec_content") }}}

template:
    name: sebool
    vars:
        seboolid: sysadm_exec_content
