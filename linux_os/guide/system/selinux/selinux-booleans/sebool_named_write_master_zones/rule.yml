documentation_complete: true


title: 'Disable the named_write_master_zones SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>named_write_master_zones</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="named_write_master_zones") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>named_write_master_zones</tt> 处于禁用状态。如果此设置已启用，应将其禁用。要禁用 <tt>named_write_master_zones</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P named_write_master_zones off</tt></p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>禁用后，可防止 BIND 写入主区域文件，保护 DNS 区域数据的完整性并减少未授权修改。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="named_write_master_zones") }}}

template:
    name: sebool
    vars:
        seboolid: named_write_master_zones
