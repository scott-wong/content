documentation_complete: true


title: 'Disable the authlogin_radius SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>authlogin_radius</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="authlogin_radius") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>authlogin_radius</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>authlogin_radius</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P authlogin_radius off</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    启用 RADIUS 身份验证集成会扩大身份验证路径；除非明确需要，否则应保持禁用。

severity: medium

identifiers:
    cce@rhel8: CCE-84294-8
    cce@rhel10: CCE-90517-4


{{{ complete_ocil_entry_sebool_disabled(sebool="authlogin_radius") }}}

template:
    name: sebool
    vars:
        seboolid: authlogin_radius
