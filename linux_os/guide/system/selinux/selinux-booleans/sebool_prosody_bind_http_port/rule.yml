documentation_complete: true


title: 'Disable the prosody_bind_http_port SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>prosody_bind_http_port</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="prosody_bind_http_port") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>prosody_bind_http_port</tt> 处于禁用状态。如果该设置为启用状态，应将其禁用。
    应禁用 SELinux 布尔值 <tt>prosody_bind_http_port</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>禁用此布尔值可防止 Prosody 绑定 HTTP 端口，从而减少不必要的网络暴露。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="prosody_bind_http_port") }}}

template:
    name: sebool
    vars:
        seboolid: prosody_bind_http_port
