documentation_complete: true


title: 'Disable the zebra_write_config SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>zebra_write_config</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="zebra_write_config") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>zebra_write_config</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P zebra_write_config off</tt> 将其禁用。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>启用此布尔值会允许 Zebra 写入路由配置，可能使路由服务获得不必要的系统配置修改能力。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="zebra_write_config") }}}

template:
    name: sebool
    vars:
        seboolid: zebra_write_config
