documentation_complete: true


title: 'Disable the rsync_full_access SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>rsync_full_access</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="rsync_full_access") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>rsync_full_access</tt> 处于禁用状态。如果该设置为启用状态，应将其禁用。
    应禁用 SELinux 布尔值 <tt>rsync_full_access</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    禁用此布尔值可限制 rsync 的完整访问能力，减少文件系统和数据暴露。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="rsync_full_access") }}}

template:
    name: sebool
    vars:
        seboolid: rsync_full_access
