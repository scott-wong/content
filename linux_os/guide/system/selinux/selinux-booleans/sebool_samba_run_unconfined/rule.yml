documentation_complete: true


title: 'Disable the samba_run_unconfined SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>samba_run_unconfined</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="samba_run_unconfined") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>samba_run_unconfined</tt> 处于禁用状态。如果该设置为启用状态，应将其禁用。
    应禁用 SELinux 布尔值 <tt>samba_run_unconfined</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    禁用此布尔值可防止 Samba 在非受限域中运行，维持 SELinux 的访问限制。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="samba_run_unconfined") }}}

template:
    name: sebool
    vars:
        seboolid: samba_run_unconfined
