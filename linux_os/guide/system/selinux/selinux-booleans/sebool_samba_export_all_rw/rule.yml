documentation_complete: true


title: 'Disable the samba_export_all_rw SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>samba_export_all_rw</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="samba_export_all_rw") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>samba_export_all_rw</tt> 处于禁用状态。如果该设置为启用状态，应将其禁用。
    应禁用 SELinux 布尔值 <tt>samba_export_all_rw</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>禁用此布尔值可防止 Samba 导出整个文件系统（读写），降低数据篡改风险。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="samba_export_all_rw") }}}

template:
    name: sebool
    vars:
        seboolid: samba_export_all_rw
