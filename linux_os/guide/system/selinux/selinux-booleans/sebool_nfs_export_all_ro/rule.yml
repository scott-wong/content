documentation_complete: true


title: 'Enable the nfs_export_all_ro SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>nfs_export_all_ro</tt> is enabled.
    If this setting is disabled, it should be enabled as it allows NFS to
    export read-only mounts.
    {{{ describe_sebool_enable(sebool="nfs_export_all_ro") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>nfs_export_all_ro</tt> 处于启用状态。如果此设置已禁用，应启用，因为它允许 NFS 导出只读挂载。要启用 <tt>nfs_export_all_ro</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P nfs_export_all_ro on</tt>

rationale: |-
    <p><strong>中文理由：</strong></p>
    启用后，可允许 NFS 导出只读挂载，这是支持只读 NFS 共享所需的策略，具体导出范围仍应由 <tt>/etc/exports</tt> 限制。

severity: medium

{{{ complete_ocil_entry_sebool_enabled(sebool="nfs_export_all_ro") }}}

template:
    name: sebool
    vars:
        seboolid: nfs_export_all_ro
