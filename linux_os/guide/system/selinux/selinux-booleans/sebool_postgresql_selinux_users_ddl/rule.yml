documentation_complete: true


title: 'Enable the postgresql_selinux_users_ddl SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>postgresql_selinux_users_ddl</tt> is enabled.
    If this setting is disabled, it should be enabled as it allows Database Administrators to
    execute Data Definition Language (DDL) statements.
    {{{ describe_sebool_enable(sebool="postgresql_selinux_users_ddl") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>postgresql_selinux_users_ddl</tt> 处于启用状态。如果该设置为禁用状态，应将其启用。
    应启用 SELinux 布尔值 <tt>postgresql_selinux_users_ddl</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    启用此布尔值可允许数据库管理员执行数据定义语言（DDL）语句，同时 SELinux 仍限制其他类型的内核和文件访问。

severity: medium

{{{ complete_ocil_entry_sebool_enabled(sebool="postgresql_selinux_users_ddl") }}}

template:
    name: sebool
    vars:
        seboolid: postgresql_selinux_users_ddl
