documentation_complete: true


title: 'Disable the mysql_connect_any SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>mysql_connect_any</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="mysql_connect_any") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>mysql_connect_any</tt> 处于禁用状态。如果此设置已启用，应将其禁用。要禁用 <tt>mysql_connect_any</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P mysql_connect_any off</tt>

rationale: |-
    <p><strong>中文理由：</strong></p>
    禁用后，可防止 MySQL 服务发起任意网络连接，减少数据库服务被利用进行横向移动的风险。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="mysql_connect_any") }}}

template:
    name: sebool
    vars:
        seboolid: mysql_connect_any
