documentation_complete: true


title: 'Disable the container_connect_any SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>container_connect_any</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="container_connect_any") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>container_connect_any</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>container_connect_any</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P container_connect_any off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许容器连接到任意网络会绕过更精细的网络隔离控制。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="container_connect_any") }}}

template:
    name: sebool
    vars:
        seboolid: container_connect_any
