documentation_complete: true


title: 'Disable the gluster_export_all_ro SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>gluster_export_all_ro</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="gluster_export_all_ro") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>gluster_export_all_ro</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P gluster_export_all_ro off</tt> 将其禁用。

rationale: |-
    <p><strong>中文理由：</strong></p>
    启用此布尔值会向 GlusterFS 客户端广泛导出只读内容，超出通常所需的最小访问范围。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="gluster_export_all_ro") }}}

template:
    name: sebool
    vars:
        seboolid: gluster_export_all_ro
