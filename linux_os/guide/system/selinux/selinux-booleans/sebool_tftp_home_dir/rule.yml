documentation_complete: true


title: 'Disable the tftp_home_dir SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>tftp_home_dir</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="tftp_home_dir") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>tftp_home_dir</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>tftp_home_dir</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P tftp_home_dir off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许 TFTP 访问用户主目录可能暴露敏感数据；除非明确需要，否则应保持禁用。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="tftp_home_dir") }}}

template:
    name: sebool
    vars:
        seboolid: tftp_home_dir
