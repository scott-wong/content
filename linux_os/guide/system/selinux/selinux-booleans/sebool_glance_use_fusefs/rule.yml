documentation_complete: true


title: 'Disable the glance_use_fusefs SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>glance_use_fusefs</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="glance_use_fusefs") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>glance_use_fusefs</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P glance_use_fusefs off</tt> 将其禁用。

rationale: |-
    <p><strong>中文理由：</strong></p>
    启用此布尔值会允许 Glance 访问 FUSE 文件系统，增加不必要的文件系统访问能力。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="glance_use_fusefs") }}}

template:
    name: sebool
    vars:
        seboolid: glance_use_fusefs
