documentation_complete: true


title: 'Disable the pppd_for_user SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>pppd_for_user</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="pppd_for_user") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>pppd_for_user</tt> 处于禁用状态。如果该设置为启用状态，应将其禁用。
    应禁用 SELinux 布尔值 <tt>pppd_for_user</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    禁用此布尔值可避免向普通用户授予 pppd 相关特权，并降低本地攻击面。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="pppd_for_user") }}}

template:
    name: sebool
    vars:
        seboolid: pppd_for_user
