documentation_complete: true


title: 'Disable the fenced_can_ssh SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>fenced_can_ssh</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="fenced_can_ssh") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>fenced_can_ssh</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>fenced_can_ssh</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P fenced_can_ssh off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许 fenced 使用 SSH 会扩大集群组件的远程访问能力。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="fenced_can_ssh") }}}

template:
    name: sebool
    vars:
        seboolid: fenced_can_ssh
