documentation_complete: true


title: 'Disable the selinuxuser_share_music SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>selinuxuser_share_music</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="selinuxuser_share_music") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>selinuxuser_share_music</tt> 处于禁用状态。如果该设置为启用状态，应将其禁用。
    应禁用 SELinux 布尔值 <tt>selinuxuser_share_music</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>禁用此布尔值可防止共享音乐等用户文件，减少数据暴露。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="selinuxuser_share_music") }}}

template:
    name: sebool
    vars:
        seboolid: selinuxuser_share_music
