documentation_complete: true


title: 'Disable the xdm_bind_vnc_tcp_port SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>xdm_bind_vnc_tcp_port</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="xdm_bind_vnc_tcp_port") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>xdm_bind_vnc_tcp_port</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>xdm_bind_vnc_tcp_port</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P xdm_bind_vnc_tcp_port off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许 XDM 绑定 VNC TCP 端口会扩大显示管理器的网络监听和暴露范围。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="xdm_bind_vnc_tcp_port") }}}

template:
    name: sebool
    vars:
        seboolid: xdm_bind_vnc_tcp_port
