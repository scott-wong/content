documentation_complete: true


title: 'Disable the polipo_session_users SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>polipo_session_users</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="polipo_session_users") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>polipo_session_users</tt> 处于禁用状态。如果该设置为启用状态，应将其禁用。
    应禁用 SELinux 布尔值 <tt>polipo_session_users</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>应限制 Polipo 对所有用户会话的访问，以减少跨用户信息暴露。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="polipo_session_users") }}}

template:
    name: sebool
    vars:
        seboolid: polipo_session_users
