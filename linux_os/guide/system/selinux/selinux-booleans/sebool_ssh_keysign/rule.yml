documentation_complete: true


title: 'Disable the ssh_keysign SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>ssh_keysign</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="ssh_keysign") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>ssh_keysign</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>ssh_keysign</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P ssh_keysign off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许 SSH 使用 ssh-keysign 会启用额外的特权辅助路径；禁用该布尔值可限制 SSH 客户端访问主机密钥。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="ssh_keysign") }}}

template:
    name: sebool
    vars:
        seboolid: ssh_keysign
