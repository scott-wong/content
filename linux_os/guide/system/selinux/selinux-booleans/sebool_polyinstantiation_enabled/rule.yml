documentation_complete: true


title: 'Configure the polyinstantiation_enabled SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>polyinstantiation_enabled</tt> is disabled.
    This setting should be configured to {{{ xccdf_value("var_polyinstantiation_enabled") }}}.
    <br/>{{{ describe_sebool_var(sebool="polyinstantiation_enabled") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>polyinstantiation_enabled</tt> 处于禁用状态。应将该设置配置为 {{{ xccdf_value("var_polyinstantiation_enabled") }}}。应将该 SELinux 布尔值设置为 {{{ xccdf_value("var_polyinstantiation_enabled") }}}。

rationale: |-
    <p><strong>中文理由：</strong></p>
    多实例化通过为不同用户或实例提供隔离的目录视图，帮助防止信息泄露。应按本地策略设置该布尔值，以兼顾隔离要求和兼容性。

severity: medium

identifiers:
    cce@rhel8: CCE-84230-2
    cce@rhel9: CCE-84083-5
    cce@rhel10: CCE-88652-3
    cce@sle12: CCE-91579-3
    cce@sle15: CCE-91238-6
    cce@sle16: CCE-95753-0

