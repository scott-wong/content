documentation_complete: true


title: 'Disable the httpd_enable_ftp_server SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>httpd_enable_ftp_server</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="httpd_enable_ftp_server") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>httpd_enable_ftp_server</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P httpd_enable_ftp_server off</tt> 将其禁用。

rationale: |-
    <p><strong>中文理由：</strong></p>
    启用此布尔值会允许 Web 服务器充任 FTP 服务器，扩大文件服务和网络暴露风险。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="httpd_enable_ftp_server") }}}

template:
    name: sebool
    vars:
        seboolid: httpd_enable_ftp_server
