documentation_complete: true


title: 'Disable the rsync_client SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>rsync_client</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="rsync_client") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>rsync_client</tt> 处于禁用状态。如果该设置为启用状态，应将其禁用。
    应禁用 SELinux 布尔值 <tt>rsync_client</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    仅在需要 rsync 客户端功能时启用此布尔值；否则应禁用，以减少不必要的文件传输能力。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="rsync_client") }}}

template:
    name: sebool
    vars:
        seboolid: rsync_client
