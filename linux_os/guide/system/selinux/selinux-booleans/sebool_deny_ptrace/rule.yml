documentation_complete: true


title: 'Disable the deny_ptrace SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>deny_ptrace</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="deny_ptrace") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>deny_ptrace</tt> 处于禁用状态。如果启用了此设置，则应将其禁用。要禁用 <tt>deny_ptrace</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P deny_ptrace off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>保持 deny_ptrace 布尔值禁用可维持当前策略基线；如要启用，应经过风险评估和明确批准。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="deny_ptrace") }}}

template:
    name: sebool
    vars:
        seboolid: deny_ptrace
