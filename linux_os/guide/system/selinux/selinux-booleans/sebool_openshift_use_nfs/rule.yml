documentation_complete: true


title: 'Disable the openshift_use_nfs SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>openshift_use_nfs</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="openshift_use_nfs") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>openshift_use_nfs</tt> 处于禁用状态。如果此设置已启用，应将其禁用。要禁用 <tt>openshift_use_nfs</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P openshift_use_nfs off</tt>

rationale: |-
    <p><strong>中文理由：</strong></p>
    禁用后，可防止 OpenShift 访问 NFS，减少容器平台跨网络文件系统访问数据的风险。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="openshift_use_nfs") }}}

template:
    name: sebool
    vars:
        seboolid: openshift_use_nfs
