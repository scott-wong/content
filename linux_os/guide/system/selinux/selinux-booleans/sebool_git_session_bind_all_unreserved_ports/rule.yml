documentation_complete: true


title: 'Disable the git_session_bind_all_unreserved_ports SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>git_session_bind_all_unreserved_ports</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="git_session_bind_all_unreserved_ports") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>git_session_bind_all_unreserved_ports</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P git_session_bind_all_unreserved_ports off</tt> 将其禁用。

rationale: |-
    <p><strong>中文理由：</strong></p>
    启用此布尔值会允许 Git 会话绑定所有未保留端口，造成不必要的网络暴露。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="git_session_bind_all_unreserved_ports") }}}

template:
    name: sebool
    vars:
        seboolid: git_session_bind_all_unreserved_ports
