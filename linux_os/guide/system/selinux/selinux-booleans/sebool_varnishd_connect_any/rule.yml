documentation_complete: true


title: 'Disable the varnishd_connect_any SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>varnishd_connect_any</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="varnishd_connect_any") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>varnishd_connect_any</tt> 处于禁用状态。如果启用了此设置，则应将其禁用。要禁用 <tt>varnishd_connect_any</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P varnishd_connect_any off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许 varnishd 发起任意网络连接会扩大缓存服务的网络访问范围。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="varnishd_connect_any") }}}

template:
    name: sebool
    vars:
        seboolid: varnishd_connect_any
