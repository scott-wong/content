documentation_complete: true


title: 'Disable the daemons_dump_core SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>daemons_dump_core</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="daemons_dump_core") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>daemons_dump_core</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>daemons_dump_core</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P daemons_dump_core off</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    允许守护进程转储核心可能将敏感内存内容写入磁盘，攻击者可利用这些内容。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="daemons_dump_core") }}}

template:
    name: sebool
    vars:
        seboolid: daemons_dump_core
