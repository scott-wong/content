documentation_complete: true


title: 'Disable the httpd_mod_auth_ntlm_winbind SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>httpd_mod_auth_ntlm_winbind</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="httpd_mod_auth_ntlm_winbind") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>httpd_mod_auth_ntlm_winbind</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P httpd_mod_auth_ntlm_winbind off</tt> 将其禁用。

rationale: |-
    <p><strong>中文理由：</strong></p>
    启用此布尔值会允许 Web 服务器通过 mod_auth_ntlm_winbind 使用 NTLM 身份验证，增加凭据和网络交互风险。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="httpd_mod_auth_ntlm_winbind") }}}

template:
    name: sebool
    vars:
        seboolid: httpd_mod_auth_ntlm_winbind
