documentation_complete: true


title: 'Disable the openvpn_run_unconfined SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>openvpn_run_unconfined</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="openvpn_run_unconfined") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>openvpn_run_unconfined</tt> 处于禁用状态。如果此设置已启用，应将其禁用。要禁用 <tt>openvpn_run_unconfined</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P openvpn_run_unconfined off</tt>

rationale: |-
    <p><strong>中文理由：</strong></p>
    禁用后，可防止 OpenVPN 以不受限域运行，确保其活动继续受到 SELinux 策略约束。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="openvpn_run_unconfined") }}}

template:
    name: sebool
    vars:
        seboolid: openvpn_run_unconfined
