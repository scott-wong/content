documentation_complete: true


title: 'Disable the ftpd_full_access SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>ftpd_full_access</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="ftpd_full_access") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>ftpd_full_access</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P ftpd_full_access off</tt> 将其禁用。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>启用此布尔值会允许 FTP 守护进程获得广泛文件访问权限，扩大攻击者破坏文件系统的能力。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="ftpd_full_access") }}}

template:
    name: sebool
    vars:
        seboolid: ftpd_full_access
