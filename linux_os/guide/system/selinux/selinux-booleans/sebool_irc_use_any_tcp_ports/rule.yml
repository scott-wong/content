documentation_complete: true


title: 'Disable the irc_use_any_tcp_ports SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>irc_use_any_tcp_ports</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="irc_use_any_tcp_ports") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>irc_use_any_tcp_ports</tt> 处于禁用状态。如果此设置已启用，应将其禁用。要禁用 <tt>irc_use_any_tcp_ports</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P irc_use_any_tcp_ports off</tt></p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>禁用后，可阻止 IRC 服务绑定任意 TCP 端口，使其仅使用已批准端口并减少网络暴露。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="irc_use_any_tcp_ports") }}}

