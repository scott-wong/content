documentation_complete: true


title: 'Disable the mozilla_plugin_can_network_connect SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>mozilla_plugin_can_network_connect</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="mozilla_plugin_can_network_connect") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>mozilla_plugin_can_network_connect</tt> 处于禁用状态。如果此设置已启用，应将其禁用。要禁用 <tt>mozilla_plugin_can_network_connect</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P mozilla_plugin_can_network_connect off</tt></p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>禁用后，可防止 Mozilla 插件发起任意网络连接，限制浏览器插件的网络访问能力。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="mozilla_plugin_can_network_connect") }}}

