documentation_complete: true


title: 'Disable the piranha_lvs_can_network_connect SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>piranha_lvs_can_network_connect</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="piranha_lvs_can_network_connect") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>piranha_lvs_can_network_connect</tt> 处于禁用状态。如果此设置已启用，应将其禁用。要禁用 <tt>piranha_lvs_can_network_connect</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P piranha_lvs_can_network_connect off</tt></p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>禁用后，可防止 Piranha/LVS 发起任意网络连接，限制负载均衡组件的网络访问范围。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="piranha_lvs_can_network_connect") }}}

template:
    name: sebool
    vars:
        seboolid: piranha_lvs_can_network_connect
