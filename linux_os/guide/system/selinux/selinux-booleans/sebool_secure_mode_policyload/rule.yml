documentation_complete: true


title: 'Disable the secure_mode_policyload SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>secure_mode_policyload</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="secure_mode_policyload") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>secure_mode_policyload</tt> 处于禁用状态。如果该设置为启用状态，应将其禁用。
    应禁用 SELinux 布尔值 <tt>secure_mode_policyload</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>禁用此布尔值可保持正常的策略加载和更新能力，同时由其他 SELinux 控制保护策略完整性。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="secure_mode_policyload") }}}

template:
    name: sebool
    vars:
        seboolid: secure_mode_policyload
