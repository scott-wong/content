documentation_complete: true


title: 'Enable the unconfined_mozilla_plugin_transition SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>unconfined_mozilla_plugin_transition</tt> is enabled.
    If this setting is disabled, it should be enabled.
    {{{ describe_sebool_enable(sebool="unconfined_mozilla_plugin_transition") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>unconfined_mozilla_plugin_transition</tt> 为 enabled。如果禁用了此设置，则应将其启用。要启用 <tt>unconfined_mozilla_plugin_transition</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P unconfined_mozilla_plugin_transition on</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>启用 Mozilla 插件域转换可确保浏览器插件进入其预期的 SELinux 域并正常运行。</p>

severity: medium

{{{ complete_ocil_entry_sebool_enabled(sebool="unconfined_mozilla_plugin_transition") }}}

template:
    name: sebool
    vars:
        seboolid: unconfined_mozilla_plugin_transition
