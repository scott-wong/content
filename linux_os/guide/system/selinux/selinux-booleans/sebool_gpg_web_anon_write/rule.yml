documentation_complete: true


title: 'Disable the gpg_web_anon_write SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>gpg_web_anon_write</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="gpg_web_anon_write") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>gpg_web_anon_write</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P gpg_web_anon_write off</tt> 将其禁用。

rationale: |-
    <p><strong>中文理由：</strong></p>
    启用此布尔值会允许匿名写入面向 Web 的 GPG 内容，可能导致未授权内容修改。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="gpg_web_anon_write") }}}

template:
    name: sebool
    vars:
        seboolid: gpg_web_anon_write
