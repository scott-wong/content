documentation_complete: true


title: 'Disable the pcp_read_generic_logs SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>pcp_read_generic_logs</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="pcp_read_generic_logs") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>pcp_read_generic_logs</tt> 处于禁用状态。如果此设置已启用，应将其禁用。要禁用 <tt>pcp_read_generic_logs</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P pcp_read_generic_logs off</tt></p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>禁用后，可防止 PCP 读取通用日志，减少性能监控组件访问非必要日志数据的风险。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="pcp_read_generic_logs") }}}

template:
    name: sebool
    vars:
        seboolid: pcp_read_generic_logs
