documentation_complete: true


title: 'Disable the samba_share_fusefs SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>samba_share_fusefs</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="samba_share_fusefs") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>samba_share_fusefs</tt> 处于禁用状态。如果该设置为启用状态，应将其禁用。
    应禁用 SELinux 布尔值 <tt>samba_share_fusefs</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    禁用此布尔值可防止 Samba 共享 FUSE 文件系统，减少不必要的文件系统暴露。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="samba_share_fusefs") }}}

template:
    name: sebool
    vars:
        seboolid: samba_share_fusefs
