documentation_complete: true


title: 'Enable the mcelog_exec_scripts SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>mcelog_exec_scripts</tt> is enabled.
    If this setting is disabled, it should be enabled.
    {{{ describe_sebool_enable(sebool="mcelog_exec_scripts") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>mcelog_exec_scripts</tt> 处于启用状态。如果此设置已禁用，应启用，以允许 mcelog 执行分析脚本。要启用 <tt>mcelog_exec_scripts</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P mcelog_exec_scripts on</tt></p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>启用后，可允许 mcelog 执行分析脚本处理机器检查事件，同时仍由 SELinux 域策略限制。</p>

severity: medium

{{{ complete_ocil_entry_sebool_enabled(sebool="mcelog_exec_scripts") }}}

template:
    name: sebool
    vars:
        seboolid: mcelog_exec_scripts
