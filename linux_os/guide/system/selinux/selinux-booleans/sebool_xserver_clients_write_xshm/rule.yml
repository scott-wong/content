documentation_complete: true


title: 'Disable the xserver_clients_write_xshm SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>xserver_clients_write_xshm</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="xserver_clients_write_xshm") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>xserver_clients_write_xshm</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>xserver_clients_write_xshm</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P xserver_clients_write_xshm off</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    允许 X server 客户端写入 X shared memory 会扩大进程间数据共享范围。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="xserver_clients_write_xshm") }}}

template:
    name: sebool
    vars:
        seboolid: xserver_clients_write_xshm
