documentation_complete: true


title: 'Disable the use_ecryptfs_home_dirs SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>use_ecryptfs_home_dirs</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="use_ecryptfs_home_dirs") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>use_ecryptfs_home_dirs</tt> 处于禁用状态。如果启用了此设置，则应将其禁用。要禁用 <tt>use_ecryptfs_home_dirs</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P use_ecryptfs_home_dirs off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许在主目录中使用 eCryptfs 会扩大文件系统和挂载相关访问路径。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="use_ecryptfs_home_dirs") }}}

template:
    name: sebool
    vars:
        seboolid: use_ecryptfs_home_dirs
