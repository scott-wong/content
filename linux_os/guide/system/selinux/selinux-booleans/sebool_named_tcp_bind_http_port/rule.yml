documentation_complete: true


title: 'Disable the named_tcp_bind_http_port SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>named_tcp_bind_http_port</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="named_tcp_bind_http_port") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>named_tcp_bind_http_port</tt> 处于禁用状态。如果此设置已启用，应将其禁用。要禁用 <tt>named_tcp_bind_http_port</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P named_tcp_bind_http_port off</tt>

rationale: |-
    <p><strong>中文理由：</strong></p>
    禁用后，可防止 BIND 绑定 HTTP 端口，减少 DNS 服务模拟 Web 服务或占用非预期端口的风险。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="named_tcp_bind_http_port") }}}

template:
    name: sebool
    vars:
        seboolid: named_tcp_bind_http_port
