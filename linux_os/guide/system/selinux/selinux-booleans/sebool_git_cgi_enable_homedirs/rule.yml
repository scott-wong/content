documentation_complete: true


title: 'Disable the git_cgi_enable_homedirs SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>git_cgi_enable_homedirs</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="git_cgi_enable_homedirs") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>git_cgi_enable_homedirs</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P git_cgi_enable_homedirs off</tt> 将其禁用。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>启用此布尔值会允许面向 Web 的 Git CGI 进程访问用户主目录，增加敏感数据泄露风险。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="git_cgi_enable_homedirs") }}}

template:
    name: sebool
    vars:
        seboolid: git_cgi_enable_homedirs
