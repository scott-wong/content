documentation_complete: true


title: 'Disable the cobbler_use_nfs SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>cobbler_use_nfs</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="cobbler_use_nfs") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>cobbler_use_nfs</tt> 处于禁用状态。如果启用了此设置，则应将其禁用。要禁用 <tt>cobbler_use_nfs</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P cobbler_use_nfs off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许 Cobbler 使用 NFS 会扩大其文件系统访问路径；除非明确需要，否则应保持禁用。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="cobbler_use_nfs") }}}

template:
    name: sebool
    vars:
        seboolid: cobbler_use_nfs
