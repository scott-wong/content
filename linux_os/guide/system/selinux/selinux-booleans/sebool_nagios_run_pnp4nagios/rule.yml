documentation_complete: true


title: 'Disable the nagios_run_pnp4nagios SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>nagios_run_pnp4nagios</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="nagios_run_pnp4nagios") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>nagios_run_pnp4nagios</tt> 处于禁用状态。如果此设置已启用，应将其禁用。要禁用 <tt>nagios_run_pnp4nagios</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P nagios_run_pnp4nagios off</tt>

rationale: |-
    <p><strong>中文理由：</strong></p>
    禁用后，可防止 Nagios 执行 PNP4Nagios，减少监控服务通过插件运行额外程序的风险。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="nagios_run_pnp4nagios") }}}

template:
    name: sebool
    vars:
        seboolid: nagios_run_pnp4nagios
