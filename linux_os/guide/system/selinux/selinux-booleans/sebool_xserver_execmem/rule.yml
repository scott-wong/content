documentation_complete: true


title: 'Disable the xserver_execmem SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>xserver_execmem</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="xserver_execmem") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>xserver_execmem</tt> 处于禁用状态。如果启用了此设置，则应将其禁用。要禁用 <tt>xserver_execmem</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P xserver_execmem off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许 X server 使用可执行内存会增加其被利用执行恶意代码的风险。</p>

severity: medium

identifiers:
    cce@rhel8: CCE-83313-7


{{{ complete_ocil_entry_sebool_disabled(sebool="xserver_execmem") }}}

template:
    name: sebool
    vars:
        seboolid: xserver_execmem
