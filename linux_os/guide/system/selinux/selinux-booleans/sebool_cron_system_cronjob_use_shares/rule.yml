documentation_complete: true


title: 'Disable the cron_system_cronjob_use_shares SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>cron_system_cronjob_use_shares</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="cron_system_cronjob_use_shares") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>cron_system_cronjob_use_shares</tt> 处于禁用状态。如果启用了此设置，则应将其禁用。要禁用 <tt>cron_system_cronjob_use_shares</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P cron_system_cronjob_use_shares off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许系统 cron 作业使用共享会扩大 cron 对网络文件系统的访问范围。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="cron_system_cronjob_use_shares") }}}

template:
    name: sebool
    vars:
        seboolid: cron_system_cronjob_use_shares
