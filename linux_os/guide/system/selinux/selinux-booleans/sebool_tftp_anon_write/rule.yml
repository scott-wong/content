documentation_complete: true


title: 'Disable the tftp_anon_write SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>tftp_anon_write</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="tftp_anon_write") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>tftp_anon_write</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>tftp_anon_write</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P tftp_anon_write off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许 TFTP 匿名写入会使未经授权的用户修改服务器上的文件。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="tftp_anon_write") }}}

template:
    name: sebool
    vars:
        seboolid: tftp_anon_write
