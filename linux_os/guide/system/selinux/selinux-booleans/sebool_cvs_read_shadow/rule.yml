documentation_complete: true


title: 'Disable the cvs_read_shadow SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>cvs_read_shadow</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="cvs_read_shadow") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>cvs_read_shadow</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>cvs_read_shadow</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P cvs_read_shadow off</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    允许 CVS 读取 shadow 文件会暴露密码哈希并扩大凭据泄露风险。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="cvs_read_shadow") }}}

template:
    name: sebool
    vars:
        seboolid: cvs_read_shadow
