documentation_complete: true


title: 'Disable the polipo_use_cifs SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>polipo_use_cifs</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="polipo_use_cifs") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>polipo_use_cifs</tt> 处于禁用状态。如果该设置为启用状态，应将其禁用。
    应禁用 SELinux 布尔值 <tt>polipo_use_cifs</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>仅在 Polipo 需要访问 CIFS 时启用此布尔值；否则应禁用，以减少网络文件系统攻击面。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="polipo_use_cifs") }}}

template:
    name: sebool
    vars:
        seboolid: polipo_use_cifs
