documentation_complete: true


title: 'Disable the httpd_can_connect_mythtv SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>httpd_can_connect_mythtv</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="httpd_can_connect_mythtv") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>httpd_can_connect_mythtv</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P httpd_can_connect_mythtv off</tt> 将其禁用。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>启用此布尔值会允许 Web 服务器连接到 MythTV，通常属于不必要的服务访问能力。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="httpd_can_connect_mythtv") }}}

template:
    name: sebool
    vars:
        seboolid: httpd_can_connect_mythtv
