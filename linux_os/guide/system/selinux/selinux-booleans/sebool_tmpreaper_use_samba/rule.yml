documentation_complete: true


title: 'Disable the tmpreaper_use_samba SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>tmpreaper_use_samba</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="tmpreaper_use_samba") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>tmpreaper_use_samba</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>tmpreaper_use_samba</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P tmpreaper_use_samba off</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    允许 tmpreaper 使用 Samba 会扩大临时文件清理服务的网络文件系统访问范围。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="tmpreaper_use_samba") }}}

template:
    name: sebool
    vars:
        seboolid: tmpreaper_use_samba
