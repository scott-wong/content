documentation_complete: true


title: 'Enable the staff_exec_content SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>staff_exec_content</tt> is enabled.
    If this setting is disabled, it should be enabled.
    {{{ describe_sebool_enable(sebool="staff_exec_content") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>staff_exec_content</tt> 处于启用状态。如果禁用了此设置，则应将其启用。要启用 <tt>staff_exec_content</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P staff_exec_content on</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>启用此布尔值可确保 staff 用户可以执行允许的内容，同时仍由 SELinux 策略约束。</p>

severity: medium

{{{ complete_ocil_entry_sebool_enabled(sebool="staff_exec_content") }}}

template:
    name: sebool
    vars:
        seboolid: staff_exec_content
