documentation_complete: true


title: 'Disable the git_session_users SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>git_session_users</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="git_session_users") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>git_session_users</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P git_session_users off</tt> 将其禁用。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>启用此布尔值会允许 Git 会话访问用户域，可能跨越 SELinux 权限边界。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="git_session_users") }}}

template:
    name: sebool
    vars:
        seboolid: git_session_users
