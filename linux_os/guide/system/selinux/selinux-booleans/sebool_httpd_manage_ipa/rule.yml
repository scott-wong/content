documentation_complete: true


title: 'Disable the httpd_manage_ipa SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>httpd_manage_ipa</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="httpd_manage_ipa") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>httpd_manage_ipa</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P httpd_manage_ipa off</tt> 将其禁用。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>启用此布尔值会允许 Web 服务器管理 IPA 组件，授予超出一般 Web 服务所需的权限。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="httpd_manage_ipa") }}}

template:
    name: sebool
    vars:
        seboolid: httpd_manage_ipa
