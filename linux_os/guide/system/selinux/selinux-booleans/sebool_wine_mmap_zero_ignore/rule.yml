documentation_complete: true


title: 'Disable the wine_mmap_zero_ignore SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>wine_mmap_zero_ignore</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="wine_mmap_zero_ignore") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>wine_mmap_zero_ignore</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>wine_mmap_zero_ignore</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P wine_mmap_zero_ignore off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许 Wine 忽略零映射会削弱其内存映射安全检查，并可能扩大攻击面。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="wine_mmap_zero_ignore") }}}

template:
    name: sebool
    vars:
        seboolid: wine_mmap_zero_ignore
