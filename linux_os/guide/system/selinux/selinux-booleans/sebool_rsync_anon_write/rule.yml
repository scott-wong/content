documentation_complete: true


title: 'Disable the rsync_anon_write SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>rsync_anon_write</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="rsync_anon_write") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>rsync_anon_write</tt> 处于禁用状态。如果该设置为启用状态，应将其禁用。
    应禁用 SELinux 布尔值 <tt>rsync_anon_write</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    禁用此布尔值可防止匿名用户写入文件系统，保护数据完整性。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="rsync_anon_write") }}}

template:
    name: sebool
    vars:
        seboolid: rsync_anon_write
