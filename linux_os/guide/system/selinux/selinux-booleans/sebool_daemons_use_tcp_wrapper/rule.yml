documentation_complete: true


title: 'Disable the daemons_use_tcp_wrapper SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>daemons_use_tcp_wrapper</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="daemons_use_tcp_wrapper") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>daemons_use_tcp_wrapper</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>daemons_use_tcp_wrapper</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P daemons_use_tcp_wrapper off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许守护进程使用 TCP Wrappers 会扩大网络访问控制路径；除非明确需要，否则应保持禁用。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="daemons_use_tcp_wrapper") }}}

template:
    name: sebool
    vars:
        seboolid: daemons_use_tcp_wrapper
