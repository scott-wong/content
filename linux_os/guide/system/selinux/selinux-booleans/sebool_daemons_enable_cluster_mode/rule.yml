documentation_complete: true


title: 'Disable the daemons_enable_cluster_mode SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>daemons_enable_cluster_mode</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="daemons_enable_cluster_mode") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>daemons_enable_cluster_mode</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>daemons_enable_cluster_mode</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P daemons_enable_cluster_mode off</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    允许守护进程启用集群模式会扩大其进程间通信和访问范围。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="daemons_enable_cluster_mode") }}}

template:
    name: sebool
    vars:
        seboolid: daemons_enable_cluster_mode
