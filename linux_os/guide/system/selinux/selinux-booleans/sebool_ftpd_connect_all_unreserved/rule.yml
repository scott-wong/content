documentation_complete: true


title: 'Disable the ftpd_connect_all_unreserved SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>ftpd_connect_all_unreserved</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="ftpd_connect_all_unreserved") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>ftpd_connect_all_unreserved</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>ftpd_connect_all_unreserved</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P ftpd_connect_all_unreserved off</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    允许 FTP 守护进程连接所有未保留端口会扩大其网络访问范围。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="ftpd_connect_all_unreserved") }}}

template:
    name: sebool
    vars:
        seboolid: ftpd_connect_all_unreserved
