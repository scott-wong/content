documentation_complete: true


title: 'Disable the logging_syslogd_can_sendmail SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>logging_syslogd_can_sendmail</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="logging_syslogd_can_sendmail") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>logging_syslogd_can_sendmail</tt> 处于禁用状态。如果此设置已启用，应将其禁用。要禁用 <tt>logging_syslogd_can_sendmail</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P logging_syslogd_can_sendmail off</tt></p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>禁用后，可防止 syslogd 发送邮件，减少日志进程通过网络外发数据的能力。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="logging_syslogd_can_sendmail") }}}

template:
    name: sebool
    vars:
        seboolid: logging_syslogd_can_sendmail
