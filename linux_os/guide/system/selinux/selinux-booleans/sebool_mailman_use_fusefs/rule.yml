documentation_complete: true


title: 'Disable the mailman_use_fusefs SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>mailman_use_fusefs</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="mailman_use_fusefs") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>mailman_use_fusefs</tt> 处于禁用状态。如果此设置已启用，应将其禁用。要禁用 <tt>mailman_use_fusefs</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P mailman_use_fusefs off</tt></p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>禁用后，可防止 Mailman 访问 FUSE 文件系统，降低邮件列表服务通过不可信挂载访问内容的风险。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="mailman_use_fusefs") }}}

template:
    name: sebool
    vars:
        seboolid: mailman_use_fusefs
