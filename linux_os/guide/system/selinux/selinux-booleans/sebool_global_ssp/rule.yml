documentation_complete: true


title: 'Disable the global_ssp SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>global_ssp</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="global_ssp") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>global_ssp</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P global_ssp off</tt> 将其禁用。

rationale: |-
    <p><strong>中文理由：</strong></p>
    启用此布尔值会向所有域授予超出最小权限策略所需的额外访问能力；应将其禁用以减少攻击面。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="global_ssp") }}}

template:
    name: sebool
    vars:
        seboolid: global_ssp
