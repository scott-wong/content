documentation_complete: true


title: 'Disable the samba_create_home_dirs SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>samba_create_home_dirs</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="samba_create_home_dirs") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>samba_create_home_dirs</tt> 处于禁用状态。如果该设置为启用状态，应将其禁用。
    应禁用 SELinux 布尔值 <tt>samba_create_home_dirs</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>禁用此布尔值可防止 Samba 创建用户主目录，减少非预期文件系统写入。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="samba_create_home_dirs") }}}

template:
    name: sebool
    vars:
        seboolid: samba_create_home_dirs
