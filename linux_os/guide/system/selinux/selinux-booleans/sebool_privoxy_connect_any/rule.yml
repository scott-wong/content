documentation_complete: true


title: 'Disable the privoxy_connect_any SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>privoxy_connect_any</tt> is enabled.
    This setting should be disabled.
    {{{ describe_sebool_disable(sebool="privoxy_connect_any") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>privoxy_connect_any</tt> 处于启用状态。应禁用该设置。
    应禁用 SELinux 布尔值 <tt>privoxy_connect_any</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>禁用此布尔值可限制代理可连接的目标，减少 Privoxy 被滥用为开放代理的风险。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="privoxy_connect_any") }}}

template:
    name: sebool
    vars:
        seboolid: privoxy_connect_any
