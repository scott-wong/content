documentation_complete: true


title: 'Disable the sge_domain_can_network_connect SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>sge_domain_can_network_connect</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="sge_domain_can_network_connect") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>sge_domain_can_network_connect</tt> 处于禁用状态。如果该设置为启用状态，应将其禁用。
    应禁用 SELinux 布尔值 <tt>sge_domain_can_network_connect</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>禁用此布尔值可限制 SGE 域发起网络连接，减少集群服务的网络攻击面。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="sge_domain_can_network_connect") }}}

template:
    name: sebool
    vars:
        seboolid: sge_domain_can_network_connect
