documentation_complete: true


title: 'Disable the mcelog_client SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>mcelog_client</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="mcelog_client") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>mcelog_client</tt> 处于禁用状态。如果此设置已启用，应将其禁用。要禁用 <tt>mcelog_client</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P mcelog_client off</tt></p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>禁用后，可防止 mcelog 以客户端身份连接外部服务，减少硬件错误记录组件的网络访问面。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="mcelog_client") }}}

