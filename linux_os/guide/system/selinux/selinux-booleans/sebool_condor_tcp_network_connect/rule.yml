documentation_complete: true


title: 'Disable the condor_tcp_network_connect SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>condor_tcp_network_connect</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="condor_tcp_network_connect") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>condor_tcp_network_connect</tt> 处于禁用状态。如果启用了此设置，则应将其禁用。要禁用 <tt>condor_tcp_network_connect</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P condor_tcp_network_connect off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许 Condor 发起任意 TCP 网络连接会扩大网络访问范围；除非明确需要，否则应保持禁用。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="condor_tcp_network_connect") }}}

