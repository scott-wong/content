documentation_complete: true


title: 'Disable the virt_sandbox_use_mknod SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>virt_sandbox_use_mknod</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="virt_sandbox_use_mknod") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>virt_sandbox_use_mknod</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>virt_sandbox_use_mknod</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P virt_sandbox_use_mknod off</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    允许沙箱容器创建设备节点会扩大其访问和操纵主机设备的能力。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="virt_sandbox_use_mknod") }}}

template:
    name: sebool
    vars:
        seboolid: virt_sandbox_use_mknod
