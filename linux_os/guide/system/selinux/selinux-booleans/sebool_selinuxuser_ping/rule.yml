documentation_complete: true


title: 'Enable the selinuxuser_ping SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>selinuxuser_ping</tt> is enabled.
    If this setting is disabled, it should be enabled as it allows confined users
    to use ping and traceroute which is helpful for network troubleshooting.
    {{{ describe_sebool_enable(sebool="selinuxuser_ping") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>selinuxuser_ping</tt> 处于启用状态。如果该设置为禁用状态，应将其启用。
    应启用 SELinux 布尔值 <tt>selinuxuser_ping</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>启用此布尔值可允许受限用户使用 ping 和 traceroute，便于网络故障排查，同时 SELinux 继续限制其他网络访问。</p>

severity: medium

{{{ complete_ocil_entry_sebool_enabled(sebool="selinuxuser_ping") }}}

template:
    name: sebool
    vars:
        seboolid: selinuxuser_ping
