documentation_complete: true


title: 'Disable the dbadm_manage_user_files SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>dbadm_manage_user_files</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="dbadm_manage_user_files") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>dbadm_manage_user_files</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>dbadm_manage_user_files</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P dbadm_manage_user_files off</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    允许数据库管理员管理用户文件会授予其超出数据库管理所需的文件访问权限。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="dbadm_manage_user_files") }}}

template:
    name: sebool
    vars:
        seboolid: dbadm_manage_user_files
