documentation_complete: true


title: 'Disable the mozilla_read_content SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>mozilla_read_content</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="mozilla_read_content") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>mozilla_read_content</tt> 处于禁用状态。如果此设置已启用，应将其禁用。要禁用 <tt>mozilla_read_content</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P mozilla_read_content off</tt></p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>禁用后，可防止 Mozilla 应用读取非必要用户内容，降低敏感文件被浏览器进程意外访问的风险。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="mozilla_read_content") }}}

template:
    name: sebool
    vars:
        seboolid: mozilla_read_content
