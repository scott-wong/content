documentation_complete: true


title: 'Disable the tor_can_network_relay SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>tor_can_network_relay</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="tor_can_network_relay") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>tor_can_network_relay</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>tor_can_network_relay</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P tor_can_network_relay off</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    允许 Tor 充当中继会扩大其网络转发能力；除非明确需要，否则应保持禁用。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="tor_can_network_relay") }}}

template:
    name: sebool
    vars:
        seboolid: tor_can_network_relay
