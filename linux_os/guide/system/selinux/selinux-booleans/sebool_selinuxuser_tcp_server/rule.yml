documentation_complete: true


title: 'Disable the selinuxuser_tcp_server SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>selinuxuser_tcp_server</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="selinuxuser_tcp_server") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>selinuxuser_tcp_server</tt> 处于禁用状态。如果该设置为启用状态，应将其禁用。
    应禁用 SELinux 布尔值 <tt>selinuxuser_tcp_server</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    禁用此布尔值可防止 SELinux 用户启动 TCP 服务器，减少网络服务暴露。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="selinuxuser_tcp_server") }}}

template:
    name: sebool
    vars:
        seboolid: selinuxuser_tcp_server
