documentation_complete: true


title: 'Disable the secure_mode SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>secure_mode</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="secure_mode") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>secure_mode</tt> 处于禁用状态。如果该设置为启用状态，应将其禁用。
    应禁用 SELinux 布尔值 <tt>secure_mode</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    启用 secure_mode 可能阻止合法服务和管理操作。除非本地策略明确要求，否则应保持禁用。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="secure_mode") }}}

template:
    name: sebool
    vars:
        seboolid: secure_mode
