documentation_complete: true


title: 'Disable the virt_read_qemu_ga_data SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>virt_read_qemu_ga_data</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="virt_read_qemu_ga_data") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>virt_read_qemu_ga_data</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>virt_read_qemu_ga_data</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P virt_read_qemu_ga_data off</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    允许虚拟化组件读取 QEMU Guest Agent 数据会扩大其访问范围。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="virt_read_qemu_ga_data") }}}

template:
    name: sebool
    vars:
        seboolid: virt_read_qemu_ga_data
