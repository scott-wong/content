documentation_complete: true


title: 'Disable the cluster_manage_all_files SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>cluster_manage_all_files</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="cluster_manage_all_files") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>cluster_manage_all_files</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>cluster_manage_all_files</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P cluster_manage_all_files off</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    允许集群组件管理所有文件会授予广泛的文件访问权限；除非明确需要，否则应保持禁用。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="cluster_manage_all_files") }}}

template:
    name: sebool
    vars:
        seboolid: cluster_manage_all_files
