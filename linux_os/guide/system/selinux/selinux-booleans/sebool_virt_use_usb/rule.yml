documentation_complete: true


title: 'Disable the virt_use_usb SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>virt_use_usb</tt> is enabled.
    This setting should be disabled.
    {{{ describe_sebool_disable(sebool="virt_use_usb") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>virt_use_usb</tt> 为 enabled。应禁用此设置。要禁用 <tt>virt_use_usb</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P virt_use_usb off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许虚拟化组件访问 USB 设备会扩大主机设备的暴露范围；除非明确需要，否则应保持禁用。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="virt_use_usb") }}}

template:
    name: sebool
    vars:
        seboolid: virt_use_usb
