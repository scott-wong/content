documentation_complete: true


title: 'Disable the httpd_serve_cobbler_files SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>httpd_serve_cobbler_files</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="httpd_serve_cobbler_files") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>httpd_serve_cobbler_files</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P httpd_serve_cobbler_files off</tt> 将其禁用。

rationale: |-
    <p><strong>中文理由：</strong></p>
    启用此布尔值会允许 Web 服务器提供 Cobbler 文件，可能暴露配置管理数据和引导资源。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="httpd_serve_cobbler_files") }}}

template:
    name: sebool
    vars:
        seboolid: httpd_serve_cobbler_files
