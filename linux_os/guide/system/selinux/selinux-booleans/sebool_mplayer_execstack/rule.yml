documentation_complete: true


title: 'Disable the mplayer_execstack SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>mplayer_execstack</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="mplayer_execstack") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>mplayer_execstack</tt> 处于禁用状态。如果此设置已启用，应将其禁用。要禁用 <tt>mplayer_execstack</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P mplayer_execstack off</tt></p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>禁用后，可防止 mplayer 使用可执行堆栈，降低通过媒体文件利用内存破坏漏洞的风险。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="mplayer_execstack") }}}

template:
    name: sebool
    vars:
        seboolid: mplayer_execstack
