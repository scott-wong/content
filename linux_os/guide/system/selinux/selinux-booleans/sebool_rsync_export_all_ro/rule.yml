documentation_complete: true


title: 'Disable the rsync_export_all_ro SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>rsync_export_all_ro</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="rsync_export_all_ro") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>rsync_export_all_ro</tt> 处于禁用状态。如果该设置为启用状态，应将其禁用。
    应禁用 SELinux 布尔值 <tt>rsync_export_all_ro</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>禁用此布尔值可防止通过 rsync 导出整个文件系统（只读），减少意外或恶意的数据暴露。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="rsync_export_all_ro") }}}

template:
    name: sebool
    vars:
        seboolid: rsync_export_all_ro
