documentation_complete: true


title: 'Disable the httpd_use_gpg SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>httpd_use_gpg</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="httpd_use_gpg") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>httpd_use_gpg</tt> 处于禁用状态。如果此设置已启用，应将其禁用。要禁用 <tt>httpd_use_gpg</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P httpd_use_gpg off</tt></p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>禁用后，可防止 Web 服务调用 GPG 处理密钥材料，减少密钥被读取或滥用的风险。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="httpd_use_gpg") }}}

template:
    name: sebool
    vars:
        seboolid: httpd_use_gpg
