documentation_complete: true


title: 'Disable the ksmtuned_use_nfs SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>ksmtuned_use_nfs</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="ksmtuned_use_nfs") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>ksmtuned_use_nfs</tt> 处于禁用状态。如果此设置已启用，应将其禁用。要禁用 <tt>ksmtuned_use_nfs</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P ksmtuned_use_nfs off</tt>

rationale: |-
    <p><strong>中文理由：</strong></p>
    禁用后，可防止 ksmtuned 访问 NFS 挂载，减少内存调优服务跨网络文件系统访问数据的风险。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="ksmtuned_use_nfs") }}}

template:
    name: sebool
    vars:
        seboolid: ksmtuned_use_nfs
