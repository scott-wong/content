documentation_complete: true


title: 'Disable the glance_use_execmem SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>glance_use_execmem</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="glance_use_execmem") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>glance_use_execmem</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P glance_use_execmem off</tt> 将其禁用。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>启用此布尔值会允许 Glance 使用可执行内存，破坏写异或执行保护并增加代码注入风险。</p>

severity: medium


identifiers:
    cce@rhel8: CCE-83308-7

    
{{{ complete_ocil_entry_sebool_disabled(sebool="glance_use_execmem") }}}

template:
    name: sebool
    vars:
        seboolid: glance_use_execmem
