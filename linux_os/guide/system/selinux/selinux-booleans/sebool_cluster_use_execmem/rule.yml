documentation_complete: true


title: 'Disable the cluster_use_execmem SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>cluster_use_execmem</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="cluster_use_execmem") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>cluster_use_execmem</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>cluster_use_execmem</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P cluster_use_execmem off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许集群组件使用可执行内存会增加其被利用执行恶意代码的风险。</p>

severity: medium

identifiers:
    cce@rhel8: CCE-83305-3


    
{{{ complete_ocil_entry_sebool_disabled(sebool="cluster_use_execmem") }}}

template:
    name: sebool
    vars:
        seboolid: cluster_use_execmem
