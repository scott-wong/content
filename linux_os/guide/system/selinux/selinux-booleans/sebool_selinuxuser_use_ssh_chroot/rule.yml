documentation_complete: true


title: 'Disable the selinuxuser_use_ssh_chroot SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>selinuxuser_use_ssh_chroot</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="selinuxuser_use_ssh_chroot") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>selinuxuser_use_ssh_chroot</tt> 处于禁用状态。如果该设置为启用状态，应将其禁用。
    应禁用 SELinux 布尔值 <tt>selinuxuser_use_ssh_chroot</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    禁用此布尔值可避免将 SSH 会话置于 chroot 环境，除非本地策略明确要求该能力。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="selinuxuser_use_ssh_chroot") }}}

template:
    name: sebool
    vars:
        seboolid: selinuxuser_use_ssh_chroot
