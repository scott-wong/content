documentation_complete: true


title: 'Disable the abrt_anon_write SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>abrt_anon_write</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="abrt_anon_write") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>abrt_anon_write</tt> 处于禁用状态。如果启用了此设置，则应将其禁用。要禁用 <tt>abrt_anon_write</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P abrt_anon_write off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许 ABRT 匿名写入会使缺陷报告工具能够修改其他服务使用的公共文件，从而扩大攻击面。</p>

severity: medium


{{{ complete_ocil_entry_sebool_disabled(sebool="abrt_anon_write") }}}

template:
    name: sebool
    vars:
        seboolid: abrt_anon_write
