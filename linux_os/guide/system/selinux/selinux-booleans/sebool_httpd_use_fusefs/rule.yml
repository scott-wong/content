documentation_complete: true


title: 'Disable the httpd_use_fusefs SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>httpd_use_fusefs</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="httpd_use_fusefs") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>httpd_use_fusefs</tt> 处于禁用状态。如果此设置已启用，应将其禁用。要禁用 <tt>httpd_use_fusefs</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P httpd_use_fusefs off</tt>

rationale: |-
    <p><strong>中文理由：</strong></p>
    禁用后，可防止 httpd 访问用户控制的 FUSE 文件系统，降低通过不可信挂载暴露或篡改 Web 内容的风险。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="httpd_use_fusefs") }}}

