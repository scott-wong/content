documentation_complete: true


title: 'Disable the glance_api_can_network SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>glance_api_can_network</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="glance_api_can_network") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>glance_api_can_network</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P glance_api_can_network off</tt> 将其禁用。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>启用此布尔值会允许 Glance API 建立任意网络连接，扩大服务可访问的网络范围。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="glance_api_can_network") }}}

template:
    name: sebool
    vars:
        seboolid: glance_api_can_network
