documentation_complete: true


title: 'Disable the mmap_low_allowed SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>mmap_low_allowed</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="mmap_low_allowed") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>mmap_low_allowed</tt> 处于禁用状态。如果此设置已启用，应将其禁用。要禁用 <tt>mmap_low_allowed</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P mmap_low_allowed off</tt>

rationale: |-
    <p><strong>中文理由：</strong></p>
    禁用后，可防止进程映射低地址内存，降低利用空指针或低地址内存布局缺陷的风险。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="mmap_low_allowed") }}}

template:
    name: sebool
    vars:
        seboolid: mmap_low_allowed
