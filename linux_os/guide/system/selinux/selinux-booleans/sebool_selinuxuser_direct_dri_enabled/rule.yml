documentation_complete: true


title: 'Configure the selinuxuser_direct_dri_enabled SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>selinuxuser_direct_dri_enabled</tt> is enabled.
    If XWindows is not installed or used on the system, this setting should be disabled.
    Otherwise, enable it.
    {{{ describe_sebool_disable(sebool="selinuxuser_direct_dri_enabled") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>selinuxuser_direct_dri_enabled</tt> 处于启用状态。如果系统未安装或不使用 XWindows，应禁用该设置；否则应启用。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>如果系统未安装或不使用 XWindows，禁用此布尔值可减少图形栈攻击面；使用 XWindows 时应启用，以支持 Direct Rendering Infrastructure。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="selinuxuser_direct_dri_enabled") }}}

template:
    name: sebool
    vars:
        seboolid: selinuxuser_direct_dri_enabled
