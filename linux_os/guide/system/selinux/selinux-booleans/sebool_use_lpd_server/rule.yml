documentation_complete: true


title: 'Disable the use_lpd_server SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>use_lpd_server</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="use_lpd_server") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>use_lpd_server</tt> 处于禁用状态。如果启用了此设置，则应将其禁用。要禁用 <tt>use_lpd_server</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P use_lpd_server off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许系统作为 LPD 服务器会扩大打印服务的网络和文件访问范围。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="use_lpd_server") }}}

template:
    name: sebool
    vars:
        seboolid: use_lpd_server
