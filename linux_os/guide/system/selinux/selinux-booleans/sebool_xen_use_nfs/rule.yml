documentation_complete: true


title: 'Disable the xen_use_nfs SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>xen_use_nfs</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="xen_use_nfs") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>xen_use_nfs</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>xen_use_nfs</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P xen_use_nfs off</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    允许 Xen 使用 NFS 会扩大虚拟化组件的远程文件系统访问范围。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="xen_use_nfs") }}}

template:
    name: sebool
    vars:
        seboolid: xen_use_nfs
