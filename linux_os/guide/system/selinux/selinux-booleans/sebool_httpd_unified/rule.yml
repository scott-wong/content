documentation_complete: true


title: 'Disable the httpd_unified SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>httpd_unified</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="httpd_unified") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>httpd_unified</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P httpd_unified off</tt> 将其禁用。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>启用此布尔值会为 Web 服务器内容使用统一访问策略，削弱按内容类型划分的 SELinux 隔离。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="httpd_unified") }}}

template:
    name: sebool
    vars:
        seboolid: httpd_unified
