documentation_complete: true


title: 'Enable the auditadm_exec_content SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>auditadm_exec_content</tt> is enabled.
    If this setting is disabled, it should be enabled.
    {{{ describe_sebool_enable(sebool="auditadm_exec_content") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>auditadm_exec_content</tt> 为 enabled。如果禁用了此设置，则应将其启用。要启用 <tt>auditadm_exec_content</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P auditadm_exec_content on</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>审计管理员通常需要执行内容处理工具；禁用此布尔值可能妨碍其完成审计相关任务。</p>

severity: medium

identifiers:
    cce@rhel8: CCE-84297-1
    cce@rhel9: CCE-84090-0
    cce@rhel10: CCE-89945-0


{{{ complete_ocil_entry_sebool_enabled(sebool="auditadm_exec_content") }}}

template:
    name: sebool
    vars:
        seboolid: auditadm_exec_content
