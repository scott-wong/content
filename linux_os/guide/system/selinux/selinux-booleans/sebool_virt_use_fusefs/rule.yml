documentation_complete: true


title: 'Disable the virt_use_fusefs SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>virt_use_fusefs</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="virt_use_fusefs") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>virt_use_fusefs</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>virt_use_fusefs</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P virt_use_fusefs off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许虚拟化组件使用 FUSE 文件系统会扩大主机文件系统在内核中的暴露范围。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="virt_use_fusefs") }}}

template:
    name: sebool
    vars:
        seboolid: virt_use_fusefs
