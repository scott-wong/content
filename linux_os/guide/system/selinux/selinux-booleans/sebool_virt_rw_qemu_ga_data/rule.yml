documentation_complete: true


title: 'Disable the virt_rw_qemu_ga_data SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>virt_rw_qemu_ga_data</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="virt_rw_qemu_ga_data") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>virt_rw_qemu_ga_data</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>virt_rw_qemu_ga_data</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P virt_rw_qemu_ga_data off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许虚拟化组件读写 QEMU Guest Agent 数据会授予其修改敏感数据的能力。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="virt_rw_qemu_ga_data") }}}

template:
    name: sebool
    vars:
        seboolid: virt_rw_qemu_ga_data
