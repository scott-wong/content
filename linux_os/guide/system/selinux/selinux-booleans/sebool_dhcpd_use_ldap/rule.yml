documentation_complete: true


title: 'Disable the dhcpd_use_ldap SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>dhcpd_use_ldap</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="dhcpd_use_ldap") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>dhcpd_use_ldap</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>dhcpd_use_ldap</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P dhcpd_use_ldap off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许 DHCP 服务器使用 LDAP 会扩大身份验证和目录访问路径；除非明确需要，否则应保持禁用。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="dhcpd_use_ldap") }}}

template:
    name: sebool
    vars:
        seboolid: dhcpd_use_ldap
