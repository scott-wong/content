documentation_complete: true


title: 'Disable the haproxy_connect_any SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>haproxy_connect_any</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="haproxy_connect_any") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>haproxy_connect_any</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P haproxy_connect_any off</tt> 将其禁用。

rationale: |-
    <p><strong>中文理由：</strong></p>
    启用此布尔值会允许 HAProxy 连接到任意网络端口，扩大可访问的网络范围。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="haproxy_connect_any") }}}

template:
    name: sebool
    vars:
        seboolid: haproxy_connect_any
