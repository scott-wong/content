documentation_complete: true


title: 'Disable the authlogin_yubikey SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>authlogin_yubikey</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="authlogin_yubikey") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>authlogin_yubikey</tt> 处于禁用状态。如果启用了此设置，则应将其禁用。要禁用 <tt>authlogin_yubikey</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P authlogin_yubikey off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>启用 YubiKey 身份验证集成会扩大身份验证路径；除非明确需要，否则应保持禁用。</p>

severity: medium


{{{ complete_ocil_entry_sebool_disabled(sebool="authlogin_yubikey") }}}

template:
    name: sebool
    vars:
        seboolid: authlogin_yubikey
