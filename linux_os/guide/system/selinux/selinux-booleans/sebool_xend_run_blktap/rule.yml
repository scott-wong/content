documentation_complete: true


title: 'Enable the xend_run_blktap SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>xend_run_blktap</tt> is enabled.
    If this setting is disabled, it should be enabled.
    {{{ describe_sebool_enable(sebool="xend_run_blktap") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>xend_run_blktap</tt> 为 enabled。如果禁用了此设置，则应将其启用。要启用 <tt>xend_run_blktap</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P xend_run_blktap on</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>启用 xend_run_blktap 可确保 Xen 管理组件能够按预期运行 blktap。</p>

severity: medium

{{{ complete_ocil_entry_sebool_enabled(sebool="xend_run_blktap") }}}

template:
    name: sebool
    vars:
        seboolid: xend_run_blktap
