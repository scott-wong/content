documentation_complete: true


title: 'Disable the virt_sandbox_use_netlink SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>virt_sandbox_use_netlink</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="virt_sandbox_use_netlink") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>virt_sandbox_use_netlink</tt> 处于禁用状态。如果启用了此设置，则应将其禁用。要禁用 <tt>virt_sandbox_use_netlink</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P virt_sandbox_use_netlink off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许沙箱容器使用 Netlink 会扩大其内核接口访问范围。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="virt_sandbox_use_netlink") }}}

template:
    name: sebool
    vars:
        seboolid: virt_sandbox_use_netlink
