documentation_complete: true


title: 'Disable the conman_can_network SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>conman_can_network</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="conman_can_network") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>conman_can_network</tt> 处于禁用状态。如果启用了此设置，则应将其禁用。要禁用 <tt>conman_can_network</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P conman_can_network off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许 conman 发起网络连接会扩大网络访问范围；除非明确需要，否则应保持禁用。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="conman_can_network") }}}

template:
    name: sebool
    vars:
        seboolid: conman_can_network
