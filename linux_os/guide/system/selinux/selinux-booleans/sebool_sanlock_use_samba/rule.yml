documentation_complete: true


title: 'Disable the sanlock_use_samba SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>sanlock_use_samba</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="sanlock_use_samba") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>sanlock_use_samba</tt> 处于禁用状态。如果该设置为启用状态，应将其禁用。
    应禁用 SELinux 布尔值 <tt>sanlock_use_samba</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    禁用此布尔值可限制 sanlock 访问 Samba 共享，减少网络存储暴露。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="sanlock_use_samba") }}}

template:
    name: sebool
    vars:
        seboolid: sanlock_use_samba
