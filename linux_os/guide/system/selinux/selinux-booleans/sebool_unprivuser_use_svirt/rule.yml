documentation_complete: true


title: 'Disable the unprivuser_use_svirt SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>unprivuser_use_svirt</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="unprivuser_use_svirt") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>unprivuser_use_svirt</tt> 处于禁用状态。如果启用了此设置，则应将其禁用。要禁用 <tt>unprivuser_use_svirt</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P unprivuser_use_svirt off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许非特权用户管理虚拟机服务会使其获得超出普通用户所需的权限。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="unprivuser_use_svirt") }}}

template:
    name: sebool
    vars:
        seboolid: unprivuser_use_svirt
