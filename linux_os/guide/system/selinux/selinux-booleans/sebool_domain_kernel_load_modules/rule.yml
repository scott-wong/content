documentation_complete: true


title: 'Disable the domain_kernel_load_modules SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>domain_kernel_load_modules</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="domain_kernel_load_modules") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>domain_kernel_load_modules</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>domain_kernel_load_modules</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P domain_kernel_load_modules off</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    允许域加载内核模块会使受约束的进程获得扩展内核能力，从而削弱隔离。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="domain_kernel_load_modules") }}}

template:
    name: sebool
    vars:
        seboolid: domain_kernel_load_modules
