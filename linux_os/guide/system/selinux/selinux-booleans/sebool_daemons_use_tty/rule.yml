documentation_complete: true


title: 'Disable the daemons_use_tty SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>daemons_use_tty</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="daemons_use_tty") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>daemons_use_tty</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>daemons_use_tty</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P daemons_use_tty off</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    允许守护进程使用 TTY 会扩大其交互式访问范围，并可能削弱隔离。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="daemons_use_tty") }}}

template:
    name: sebool
    vars:
        seboolid: daemons_use_tty
