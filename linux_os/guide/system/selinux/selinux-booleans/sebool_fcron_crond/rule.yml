documentation_complete: true


title: 'Disable the fcron_crond SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>fcron_crond</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="fcron_crond") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>fcron_crond</tt> 处于禁用状态。如果启用了此设置，则应将其禁用。要禁用 <tt>fcron_crond</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P fcron_crond off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许 fcron 访问 cron 会扩大任务调度组件之间的权限范围；除非明确需要，否则应保持禁用。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="fcron_crond") }}}

template:
    name: sebool
    vars:
        seboolid: fcron_crond
