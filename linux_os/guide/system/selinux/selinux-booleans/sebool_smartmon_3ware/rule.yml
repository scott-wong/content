documentation_complete: true


title: 'Disable the smartmon_3ware SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>smartmon_3ware</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="smartmon_3ware") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>smartmon_3ware</tt> 处于禁用状态。如果该设置为启用状态，应将其禁用。
    应禁用 SELinux 布尔值 <tt>smartmon_3ware</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>禁用此布尔值可限制 smartmon 对 3ware 设备的访问，除非明确需要该硬件监控功能。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="smartmon_3ware") }}}

template:
    name: sebool
    vars:
        seboolid: smartmon_3ware
