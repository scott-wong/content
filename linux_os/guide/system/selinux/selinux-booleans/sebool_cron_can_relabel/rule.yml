documentation_complete: true


title: 'Disable the cron_can_relabel SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>cron_can_relabel</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="cron_can_relabel") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>cron_can_relabel</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>cron_can_relabel</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P cron_can_relabel off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许 cron 重新标记文件可能使其更改 SELinux 标签并绕过基于标签的访问控制。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="cron_can_relabel") }}}

template:
    name: sebool
    vars:
        seboolid: cron_can_relabel
