documentation_complete: true


title: 'Disable the puppetagent_manage_all_files SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>puppetagent_manage_all_files</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="puppetagent_manage_all_files") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>puppetagent_manage_all_files</tt> 处于禁用状态。如果该设置为启用状态，应将其禁用。
    应禁用 SELinux 布尔值 <tt>puppetagent_manage_all_files</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>禁用此布尔值可限制 Puppet 代理管理任意文件，降低配置管理组件被滥用时的影响。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="puppetagent_manage_all_files") }}}

template:
    name: sebool
    vars:
        seboolid: puppetagent_manage_all_files
