documentation_complete: true


title: 'Enable the mount_anyfile SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>mount_anyfile</tt> is enabled.
    If this setting is disabled, it should be enabled to allow any file
    or directory to be mounted.
    {{{ describe_sebool_enable(sebool="mount_anyfile") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>mount_anyfile</tt> 处于启用状态。如果此设置已禁用，应启用，以允许挂载任何文件或目录。要启用 <tt>mount_anyfile</tt> SELinux 布尔值，请运行以下命令：<tt>sudo setsebool -P mount_anyfile on</tt></p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>启用后，可允许 mount 工具挂载任意文件或目录，这是正常挂载操作所需的，同时仍由 SELinux 策略约束。</p>

severity: medium

{{{ complete_ocil_entry_sebool_enabled(sebool="mount_anyfile") }}}

template:
    name: sebool
    vars:
        seboolid: mount_anyfile
