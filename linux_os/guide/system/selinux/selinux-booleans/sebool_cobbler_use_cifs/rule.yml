documentation_complete: true


title: 'Disable the cobbler_use_cifs SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>cobbler_use_cifs</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="cobbler_use_cifs") }}}

    <p><strong>中文说明：</strong></p>
    默认情况下，SELinux 布尔值 <tt>cobbler_use_cifs</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>cobbler_use_cifs</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P cobbler_use_cifs off</tt>。

rationale: |-
    <p><strong>中文理由：</strong></p>
    允许 Cobbler 使用 CIFS 会扩大其文件系统访问路径；除非明确需要，否则应保持禁用。

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="cobbler_use_cifs") }}}

template:
    name: sebool
    vars:
        seboolid: cobbler_use_cifs
