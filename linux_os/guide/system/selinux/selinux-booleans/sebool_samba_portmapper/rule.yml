documentation_complete: true


title: 'Disable the samba_portmapper SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>samba_portmapper</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="samba_portmapper") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>samba_portmapper</tt> 处于禁用状态。如果该设置为启用状态，应将其禁用。
    应禁用 SELinux 布尔值 <tt>samba_portmapper</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>禁用此布尔值可阻止 Samba 使用 portmapper，减少端口映射服务暴露。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="samba_portmapper") }}}

template:
    name: sebool
    vars:
        seboolid: samba_portmapper
