documentation_complete: true


title: 'Disable the httpd_dontaudit_search_dirs SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>httpd_dontaudit_search_dirs</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="httpd_dontaudit_search_dirs") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>httpd_dontaudit_search_dirs</tt> 处于禁用状态。如果已启用该设置，应将其禁用。可使用 <tt>sudo setsebool -P httpd_dontaudit_search_dirs off</tt> 将其禁用。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>启用此布尔值会抑制 Web 服务器搜索目录失败相关的审计记录，降低检测异常访问行为的能力。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="httpd_dontaudit_search_dirs") }}}

