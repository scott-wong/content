documentation_complete: true


title: 'Disable the xserver_object_manager SELinux Boolean'

description: |-
    By default, the SELinux boolean <tt>xserver_object_manager</tt> is disabled.
    If this setting is enabled, it should be disabled.
    {{{ describe_sebool_disable(sebool="xserver_object_manager") }}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，SELinux 布尔值 <tt>xserver_object_manager</tt> 为 disabled。如果启用了此设置，则应将其禁用。要禁用 <tt>xserver_object_manager</tt> SELinux 布尔值，请运行 <tt>sudo setsebool -P xserver_object_manager off</tt>。</p>

rationale: |-

    <p><strong>中文理由：</strong></p>
    <p>允许 X server 作为对象管理器会扩大其进程间通信和对象管理权限。</p>

severity: medium

{{{ complete_ocil_entry_sebool_disabled(sebool="xserver_object_manager") }}}

template:
    name: sebool
    vars:
        seboolid: xserver_object_manager
