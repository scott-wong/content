documentation_complete: true

title: 'Verify Permissions on the system journal directories'

description: |-
    Verify the /run/log/journal and /var/log/journal directories have
    permissions set to "2750" or less permissive by using the following command:
    <pre>
    $ sudo find /run/log/journal /var/log/journal  -type d -exec stat -c "%n %a" {} \;
    </pre>
    If any output returned has a permission set greater than "2750", this is a finding.

    <p><strong>中文说明：</strong></p>
    <p>验证 /run/log/journal 和 /var/log/journal 目录的权限设置为 "2750" 或更严格，使用以下命令：</p>
    <pre>
    $ sudo find /run/log/journal /var/log/journal  -type d -exec stat -c "%n %a" {} \;
    </pre>
    如果返回的任何输出显示权限比 "2750" 更宽松，则构成发现项。

rationale: |-
    Any operating system providing too much information in error messages risks
    compromising the data and security of the structure, and content of error messages
    needs to be carefully considered by the organization.

    <p><strong>中文理由：</strong></p>
    <p>在错误消息中提供过多信息的任何操作系统都可能危及数据以及错误消息结构和内容的安全性，组织必须审慎考虑错误消息的内容。</p>

severity: medium

fixtext: |
    Configure the system to set the appropriate permissions to the directories
    used by the systemd journal.
    Create a drop-in file, if it does not already exist with the following command:
    <pre>
    $ sudo vi /etc/tmpﬁles.d/zzz-systemd-stig.conf
    </pre>
    Add or modify the following lines in the "/etc/tmpfiles.d/zzz-systemd-stig.conf" ﬁle:
    <pre>
    z /run/log/journal 2750 root systemd-journal - -
    Z /run/log/journal/%m ~2750 root systemd-journal - -
    z /var/log/journal 2750 root systemd-journal - -
    z /var/log/journal/%m 2750 root systemd-journal - -
    z /var/log/journal/%m/system.journal 2750 root systemd-journal - -
    </pre>
    Note: Restart the system for these settings to take eﬀect.

template:
    name: file_permissions
    vars:
        filepath:
            - /run/log/journal/
            - /var/log/journal/
        recursive: 'true'
        filemode: '2750'
