documentation_complete: true


title: 'Set Boot Loader Password in grub2'

description: |-
    The grub2 boot loader should have a superuser account and password
    protection enabled to protect boot-time settings.
    <br /><br />
    Since plaintext passwords are a security risk, generate a hash for the password
    by running the following command:
    {{% if 'sle' in product or 'slmicro' in product or 'ubuntu' in product %}}
    <pre># grub2-mkpasswd-pbkdf2</pre>
    {{% else %}}
    <pre># grub2-setpassword</pre>
    {{% endif %}}
    When prompted, enter the password that was selected.
    <br /><br />
    {{% if 'sle' in product or 'slmicro' in product or 'ubuntu' in product %}}
    Using the hash from the output, modify the <tt>/etc/grub.d/40_custom</tt>
    file with the following content:
    <pre>set superusers="boot"
    password_pbkdf2 boot grub.pbkdf2.sha512.VeryLongString
    </pre>
    NOTE: the bootloader superuser account and password MUST differ from the
    root account and password.
    Once the superuser password has been added,
    update the
    <tt>grub.cfg</tt> file by running:
    {{%- if "rhel" in product %}}
    <pre>grub2-mkconfig -o /boot/grub2/grub.cfg</pre>
    {{%- else %}}
    <pre>{{{ grub_command("update") }}}</pre>
    {{%- endif %}}
    {{% endif %}}

    <p><strong>中文说明：</strong></p>
    grub2 引导加载程序应启用超级用户账户和密码保护，以保护启动时设置。<br /><br />
    由于明文密码存在安全风险，请运行以下命令为密码生成哈希：
    {{% if 'sle' in product or 'slmicro' in product or 'ubuntu' in product %}}
    <pre># grub2-mkpasswd-pbkdf2</pre>
    {{% else %}}
    <pre># grub2-setpassword</pre>
    {{% endif %}}
    出现提示时，输入所选密码。<br /><br />
    {{% if 'sle' in product or 'slmicro' in product or 'ubuntu' in product %}}
    使用输出中的哈希，按以下内容修改 <tt>/etc/grub.d/40_custom</tt> 文件：
    <pre>set superusers="boot"
    password_pbkdf2 boot grub.pbkdf2.sha512.VeryLongString
    </pre>
    注意：引导加载程序超级用户账户和密码必须不同于 root 账户和密码。添加超级用户密码后，请运行以下命令更新 <tt>grub.cfg</tt> 文件：
    {{%- if "rhel" in product %}}
    <pre>grub2-mkconfig -o /boot/grub2/grub.cfg</pre>
    {{%- else %}}
    <pre>{{{ grub_command("update") }}}</pre>
    {{%- endif %}}
    {{% endif %}}

rationale: |-
    Password protection on the boot loader configuration ensures
    users with physical access cannot trivially alter
    important bootloader settings. These include which kernel to use,
    and whether to enter single-user mode.

    <p><strong>中文理由：</strong></p>
    对引导加载程序配置实施密码保护可确保具有物理访问权限的用户无法轻易更改重要引导设置，包括使用哪个内核以及是否进入单用户模式。

