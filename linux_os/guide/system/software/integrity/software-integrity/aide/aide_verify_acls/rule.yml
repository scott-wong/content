documentation_complete: true


title: 'Configure AIDE to Verify Access Control Lists (ACLs)'

description: |-
    By default, the <tt>acl</tt> option is added to the <tt>FIPSR</tt> ruleset in AIDE.
    If using a custom ruleset or the <tt>acl</tt> option is missing, add <tt>acl</tt>
    to the appropriate ruleset.
    For example, add <tt>acl</tt> to the following line in <tt>{{{ aide_conf_path }}}</tt>:
    <pre>FIPSR = p+i+n+u+g+s+m+c+acl+selinux+xattrs+sha256</pre>
    AIDE rules can be configured in multiple ways; this is merely one example that is already
    configured by default.
    The <tt>acl</tt> option must also be present on selection lines that specify
    attributes directly without referencing a group. For example:
    <pre>/bin p+i+n+u+g+s+m+c+acl+selinux+xattrs+sha256</pre>

    {{% if "debian" in product %}}
    The remediation provided with this rule adds <tt>acl</tt> to the OwnerMode rule
    in <tt>{{{ aide_conf_path }}}</tt> and to any selection lines that specify attributes directly.
    {{% else %}}
    The remediation provided with this rule adds <tt>acl</tt> to all rule sets available in
    <tt>{{{ aide_conf_path }}}</tt> and to any selection lines that specify attributes directly.
    {{% endif %}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，AIDE 的 <tt>FIPSR</tt> 规则集中会添加 <tt>acl</tt> 选项。如果使用自定义规则集或缺少 <tt>acl</tt> 选项，请将 <tt>acl</tt> 添加到相应规则集。例如，在 <tt>{{{ aide_conf_path }}}</tt> 的以下行中添加 <tt>acl</tt>：</p>
    <pre>FIPSR = p+i+n+u+g+s+m+c+acl+selinux+xattrs+sha256</pre>
    AIDE 规则可通过多种方式配置；此处仅为默认已配置的一个示例。<tt>acl</tt> 选项还必须出现在直接指定属性而不引用组的 selection 行上。例如：
    <pre>/bin p+i+n+u+g+s+m+c+acl+selinux+xattrs+sha256</pre>

    {{% if "debian" in product %}}
    此规则提供的修复会将 <tt>acl</tt> 添加到 <tt>{{{ aide_conf_path }}}</tt> 中的 OwnerMode 规则以及任何直接指定属性的 selection 行。
    {{% else %}}
    此规则提供的修复会将 <tt>acl</tt> 添加到 <tt>{{{ aide_conf_path }}}</tt> 中所有可用规则集以及任何直接指定属性的 selection 行。
    {{% endif %}}

rationale: |-
    ACLs can provide permissions beyond those permitted through the file mode and must be
    verified by the file integrity tools.

    <p><strong>中文理由：</strong></p>
    <p>ACL 可提供超出文件模式所允许范围的权限，必须由文件完整性工具进行验证。</p>

