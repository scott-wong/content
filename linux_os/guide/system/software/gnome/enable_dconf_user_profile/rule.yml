documentation_complete: true

title: 'Configure GNOME3 DConf User Profile'

description: |-
    By default, DConf provides a standard user profile. This profile contains a list
    of DConf configuration databases. The user profile and database always take the
    highest priority. As such the DConf User profile should always exist and be
    configured correctly.
    <br /><br />
    {{% if 'sle' in product %}}
    To make sure that the user profile is configured correctly, the <tt>/etc/dconf/profile/gdm</tt>
    should be set as follows:
    <pre>user-db:user
    system-db:gdm
    </pre>
    {{% elif 'ubuntu' in product %}}
    To make sure that the gdm profile is configured correctly, the <tt>/etc/dconf/profile/gdm</tt>
    should be set as follows:
    <pre>user-db:user
    system-db:gdm
    </pre>
    To make sure that the user profile is configured correctly, the <tt>/etc/dconf/profile/user</tt>
    should be set as follows:
    <pre>user-db:user
    system-db:local
    </pre>
    {{% else %}}
    To make sure that the user profile is configured correctly, the <tt>/etc/dconf/profile/user</tt>
    should be set as follows:
    <pre>user-db:user
    system-db:local
    system-db:site
    system-db:distro
    </pre>
    {{% endif %}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，DConf 提供标准用户配置文件。该配置文件包含一个 DConf 配置数据库列表，用户配置文件和数据库始终具有最高优先级。因此，DConf 用户配置文件应始终存在并正确配置。</p>
    <p>在 SLE 产品中，<tt>/etc/dconf/profile/gdm</tt> 应包含 <tt>user-db:user</tt> 和 <tt>system-db:gdm</tt>。在 Ubuntu 产品中，<tt>/etc/dconf/profile/gdm</tt> 应包含 <tt>user-db:user</tt> 和 <tt>system-db:gdm</tt>，且 <tt>/etc/dconf/profile/user</tt> 应包含 <tt>user-db:user</tt> 和 <tt>system-db:local</tt>。在其他产品中，<tt>/etc/dconf/profile/user</tt> 应包含 <tt>user-db:user</tt>、<tt>system-db:local</tt>、<tt>system-db:site</tt> 和 <tt>system-db:distro</tt>。</p>

rationale: |-
    Failure to have a functional DConf profile prevents GNOME3 configuration settings
    from being enforced for all users and allows various security risks.

    <p><strong>中文理由：</strong></p>
    <p>如果没有有效的 DConf 配置文件，GNOME3 配置设置就无法对所有用户强制执行，并会带来各种安全风险。</p>

severity: high

identifiers:
    cce@rhel9: CCE-88767-9
    cce@sle12: CCE-83006-7
    cce@sle15: CCE-83267-5
    cce@sle16: CCE-96032-8

references:
    cis@sle12: '1.10'
    cis@sle15: '1.10'
    stigid@sle12: SLES-12-010611

ocil_clause: 'DConf User profile does not exist or is not configured correctly'

ocil: |-
    To verify that the DConf User profile is configured correctly, run the following
    command:
    {{% if 'sle' in product %}}
    <pre>$ cat /etc/dconf/profile/gdm</pre>
    The output should show the following:
    <pre>user-db:user
    system-db:gdm</pre>
    {{% elif 'ubuntu' in product %}}
    <pre>$ cat /etc/dconf/profile/gdm</pre>
    The output should show the following:
    <pre>user-db:user
    system-db:gdm</pre>
    <pre>$ cat /etc/dconf/profile/user</pre>
    The output should show the following:
    <pre>user-db:user
    system-db:local
    {{% else %}}
    <pre>$ cat /etc/dconf/profile/user</pre>
    The output should show the following:
    <pre>user-db:user
    system-db:local
    system-db:site
    system-db:distro</pre>
    {{% endif %}}

platform: system_with_kernel
