documentation_complete: true


title: 'Modify the System Login Banner for Remote Connections'

description: |-
    To configure the system login banner edit <tt>/etc/issue.net</tt>. Replace the
    default text with a message compliant with the local site policy or a legal
    disclaimer.

    <p><strong>中文说明：</strong></p>
    要配置系统登录横幅，请编辑 <tt>/etc/issue.net</tt>。请将默认文本替换为符合本地站点策略或法律免责声明的消息。

rationale: |-
    Display of a standardized and approved use notification before granting
    access to the operating system ensures privacy and security notification
    verbiage used is consistent with applicable federal laws, Executive Orders,
    directives, policies, regulations, standards, and guidance.
    <br /><br />
    System use notifications are required only for access via login interfaces
    with human users and are not required when such human interfaces do not
    exist.

    <p><strong>中文理由：</strong></p>
    在授予操作系统访问权限前显示标准化且经批准的使用通知，可确保所用的隐私和安全通知措辞符合适用的联邦法律、行政命令、指令、政策、法规、标准和指南。
    <br /><br />
    系统使用通知仅在对人类用户的登录界面访问时需要；当此类人工界面不存在时不需要。

severity: medium

