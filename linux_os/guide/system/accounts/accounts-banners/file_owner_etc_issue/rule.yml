documentation_complete: true


title: 'Verify ownership of System Login Banner'

description: |-
    {{{ describe_file_owner(file="/etc/issue", owner="root") }}}

    <p><strong>中文说明：</strong></p>
    <p>确保 <tt>/etc/issue</tt> 文件的所有者为 <tt>root</tt>。</p>

rationale: |-
    Display of a standardized and approved use notification before granting
    access to the operating system ensures privacy and security notification
    verbiage used is consistent with applicable federal laws, Executive Orders,
    directives, policies, regulations, standards, and guidance.<br />
    Proper ownership will ensure that only root user can modify the banner.

    <p><strong>中文理由：</strong></p>
    <p>在授予操作系统访问权限前显示标准化且经批准的使用通知，可确保所用的隐私和安全通知措辞符合适用的联邦法律、行政命令、指令、政策、法规、标准和指南。<br />正确的文件所有者可确保只有 root 用户可以修改该横幅。</p>

severity: medium

identifiers:
    cce@rhel8: CCE-83718-7
    cce@rhel9: CCE-86700-2
    cce@rhel10: CCE-88544-2
    cce@sle12: CCE-92234-4
    cce@sle15: CCE-91356-6
    cce@sle16: CCE-96362-9
    cce@slmicro5: CCE-94057-7
    cce@slmicro6: CCE-94944-6

references:
    cis@sle12: 1.8.1.5
    cis@sle15: 1.8.1.5

ocil_clause: '{{{ ocil_clause_file_owner(file="/etc/issue", owner="root") }}}'

ocil: |-
    {{{ ocil_file_owner(file="/etc/issue", owner="root") }}}

{{%- if product in ['sle15', 'sle16'] or product.startswith('slmicro') %}}
template:
    name: file_owner
    vars:
        filepath: /etc/issue.d/
        uid_or_name: '0'
        file_regex: ^.*$
        recursive: 'true'
{{%- else %}}
template:
    name: file_owner
    vars:
        filepath: /etc/issue
        uid_or_name: '0'
{{%- endif -%}}
