documentation_complete: true


title: 'Verify Group Ownership of System Login Banner'

description: |-
    {{{ describe_file_group_owner(file="/etc/issue", group="root") }}}

    <p><strong>中文说明：</strong></p>
    <p>确保 <tt>/etc/issue</tt> 文件的所属组为 <tt>root</tt>。</p>

rationale: |-
    Display of a standardized and approved use notification before granting
    access to the operating system ensures privacy and security notification
    verbiage used is consistent with applicable federal laws, Executive Orders,
    directives, policies, regulations, standards, and guidance.<br />
    Proper group ownership will ensure that only root user can modify the banner.

    <p><strong>中文理由：</strong></p>
    <p>在授予操作系统访问权限前显示标准化且经批准的使用通知，可确保所用的隐私和安全通知措辞符合适用的联邦法律、行政命令、指令、政策、法规、标准和指南。<br />正确的文件所属组可确保只有 root 用户可以修改该横幅。</p>

severity: medium

identifiers:
    cce@rhel8: CCE-83708-8
    cce@rhel9: CCE-86699-6
    cce@rhel10: CCE-89209-1
    cce@sle12: CCE-92233-6
    cce@sle15: CCE-91355-8
    cce@slmicro5: CCE-94060-1
    cce@slmicro6: CCE-95021-2

references:
    cis@sle12: 1.8.1.5
    cis@sle15: 1.8.1.5

ocil_clause: '{{{ ocil_clause_file_group_owner(file="/etc/issue", group="root") }}}'

ocil: |-
    {{{ ocil_file_group_owner(file="/etc/issue", group="root") }}}

{{%- if product in ['sle15', 'slmicro5', 'slmicro6'] %}}
template:
    name: file_groupowner
    vars:
        filepath: /etc/issue.d/
        gid_or_name: '0'
        file_regex: ^.*$
        recursive: 'true'
{{%- else %}}
template:
    name: file_groupowner
    vars:
        filepath: /etc/issue
        gid_or_name: '0'
{{% endif %}}
