documentation_complete: true


title: 'Verify permissions on System Login Banner'

description: |-
    {{{ describe_file_permissions(file="/etc/issue", perms="0644") }}}

    <p><strong>中文说明：</strong></p>
    <p>确保 <tt>/etc/issue</tt> 文件的权限为 <tt>0644</tt> 或更严格。</p>

rationale: |-
    Display of a standardized and approved use notification before granting
    access to the operating system ensures privacy and security notification
    verbiage used is consistent with applicable federal laws, Executive Orders,
    directives, policies, regulations, standards, and guidance.<br />
    Proper permissions will ensure that only root user can modify the banner.

    <p><strong>中文理由：</strong></p>
    <p>在授予操作系统访问权限前显示标准化且经批准的使用通知，可确保所用的隐私和安全通知措辞符合适用的联邦法律、行政命令、指令、政策、法规、标准和指南。<br />正确的文件权限可确保只有 root 用户可以修改该横幅。</p>

severity: medium

identifiers:
    cce@rhel8: CCE-83348-3
    cce@rhel9: CCE-83551-2
    cce@rhel10: CCE-86812-5
    cce@sle12: CCE-92232-8
    cce@sle15: CCE-91354-1
    cce@sle16: CCE-96154-0
    cce@slmicro5: CCE-94054-4
    cce@slmicro6: CCE-94870-3

references:
    cis@sle12: 1.8.1.5
    cis@sle15: 1.8.1.5

ocil_clause: '{{{ ocil_clause_file_permissions(file="/etc/issue", perms="-rw-r--r--") }}}'

ocil: |-
    {{{ ocil_file_permissions(file="/etc/issue", perms="-rw-r--r--") }}}

template:
    name: file_permissions
    vars:
{{%- if product.startswith('slmicro') %}}
        filepath: /run/issue
{{%- else %}}
        filepath: /etc/issue
{{%- endif %}}
        filemode: '0644'
