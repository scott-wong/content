documentation_complete: true


title: 'Disable Ctrl-Alt-Del Burst Action'

description: |-
    By default, <tt>SystemD</tt> will reboot the system if the <tt>Ctrl-Alt-Del</tt>
    key sequence is pressed Ctrl-Alt-Delete more than 7 times in 2 seconds.
    <br /><br />
    To configure the system to ignore the <tt>CtrlAltDelBurstAction</tt>
    {{% if product != "rhcos4" %}}
    setting, add or modify the following to <tt>/etc/systemd/system.conf</tt>:
    <pre>CtrlAltDelBurstAction=none</pre>
    {{% else %}}
    setting, create a <tt>MachineConfig</tt> similar to the following:
    <pre>
    apiVersion: machineconfiguration.openshift.io/v1
    kind: MachineConfig
    metadata:
      labels:
        machineconfiguration.openshift.io/role: master
      name: 75-master-disable-ctrlaltdel-burstaction
    spec:
      config:
        ignition:
          version: 3.1.0
        storage:
          files:
          - contents:
              source: data:,CtrlAltDelBurstAction%3Dnone
            mode: 0644
            path: /etc/systemd/system.conf.d/disable_ctrlaltdelete_burstaction.conf
            overwrite: true
    EOF
    </pre>
    <p>
    This will add the relevant configuration to <tt>/etc/systemd/system.conf.d/</tt>,
    thus configuring Systemd appropriately.
    </p>
    {{{ machineconfig_description_footer() | indent(4) }}}
    {{% endif %}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，如果在 2 秒内按下 <tt>Ctrl-Alt-Del</tt> 键序列 Ctrl-Alt-Delete 超过 7 次，<tt>SystemD</tt> 将重启系统。
    <br /><br />
    要将系统配置为忽略 <tt>CtrlAltDelBurstAction</tt>
    {{% if product != "rhcos4" %}}
    设置，请在 <tt>/etc/systemd/system.conf</tt> 中添加或修改以下内容：</p>
    <pre>CtrlAltDelBurstAction=none</pre>
    {{% else %}}
    设置，请创建类似以下内容的 <tt>MachineConfig</tt>：
    <pre>
    apiVersion: machineconfiguration.openshift.io/v1
    kind: MachineConfig
    metadata:
      labels:
        machineconfiguration.openshift.io/role: master
      name: 75-master-disable-ctrlaltdel-burstaction
    spec:
      config:
        ignition:
          version: 3.1.0
        storage:
          files:
          - contents:
              source: data:,CtrlAltDelBurstAction%3Dnone
            mode: 0644
            path: /etc/systemd/system.conf.d/disable_ctrlaltdelete_burstaction.conf
            overwrite: true
    EOF
    </pre>
    <p>
    这会将相关配置添加到 <tt>/etc/systemd/system.conf.d/</tt>，从而正确配置 Systemd。
    </p>
    <p>
    请注意，必须为每个 <tt>MachineConfigPool</tt> 执行此操作。
    </p>
    <p>
    有关如何使用 Machine Config Operator 配置节点的更多信息，请参阅<a href="https://docs.openshift.com/container-platform/4.6/post_installation_configuration/machine-configuration-tasks.html">相关文档</a>。
    </p>
    {{% endif %}}

rationale: |-
    A locally logged-in user who presses Ctrl-Alt-Del, when at the console,
    can reboot the system. If accidentally pressed, as could happen in
    the case of mixed OS environment, this can create the risk of short-term
    loss of availability of systems due to unintentional reboot.

    <p><strong>中文理由：</strong></p>
    <p>本地登录用户在控制台按下 Ctrl-Alt-Del 时可重启系统。如果误按，例如在混合操作系统环境中可能发生，这可能导致系统意外重启，带来短期可用性损失风险。</p>

