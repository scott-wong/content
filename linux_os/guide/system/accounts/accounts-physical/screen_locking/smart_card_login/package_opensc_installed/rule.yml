documentation_complete: true


title: 'Install the {{{ package }}} Package For Multifactor Authentication'

description: |-
    {{{ describe_package_install(package=package) }}}

    <p><strong>中文说明：</strong></p>
    请使用适当的软件包管理工具安装 <tt>{{{ package }}}</tt> 软件包。

rationale: |-
    Using an authentication device, such as a CAC or token that is separate from
    the information system, ensures that even if the information system is
    compromised, that compromise will not affect credentials stored on the
    authentication device.
    <br /><br />
    Multifactor solutions that require devices separate from
    information systems gaining access include, for example, hardware tokens
    providing time-based or challenge-response authenticators and smart cards
    or similar secure authentication devices issued by an organization or identity provider.

    <p><strong>中文理由：</strong></p>
    会话锁是用户停止工作并离开信息系统附近的即时物理环境，但因暂时离开而不想注销时采取的临时措施。<br /><br />会话锁在能够确定会话活动的时点实施。<br /><br />无论在何处确定和实施会话锁，一旦调用，会话锁必须保持有效，直到用户重新进行身份验证。除重新身份验证外，任何其他活动都不得解锁系统。

severity: medium

identifiers:
    cce@rhel8: CCE-80846-9
    cce@rhel9: CCE-83595-9
    cce@rhel10: CCE-86898-4

references:
    nist: CM-6(a)
    srg: SRG-OS-000375-GPOS-00160,SRG-OS-000376-GPOS-00161
    stigid@ol8: OL08-00-010410

