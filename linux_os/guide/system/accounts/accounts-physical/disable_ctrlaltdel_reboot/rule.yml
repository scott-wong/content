documentation_complete: true


title: 'Disable Ctrl-Alt-Del Reboot Activation'

description: |-
    By default, <tt>SystemD</tt> will reboot the system if the <tt>Ctrl-Alt-Del</tt>
    key sequence is pressed.
    <br /><br />
    To configure the system to ignore the <tt>Ctrl-Alt-Del</tt> key sequence from the
    {{% if product != "rhcos4" %}}
    command line instead of rebooting the system, do either of the following:
    <pre>ln -sf /dev/null /etc/systemd/system/ctrl-alt-del.target</pre>
    or
    <pre>systemctl mask ctrl-alt-del.target</pre>
    <br /><br />
    Do not simply delete the <tt>/usr/lib/systemd/system/ctrl-alt-del.service</tt> file,
    as this file may be restored during future system updates.
    {{% else %}}
    command line instead of rebooting the system, create a <tt>MachineConfig</tt>
    similar to the following:
    <pre>
    apiVersion: machineconfiguration.openshift.io/v1
    kind: MachineConfig
    metadata:
      labels:
        machineconfiguration.openshift.io/role: master
      name: 75-master-disable-ctrlaltdel-reboot
    spec:
      config:
        ignition:
          version: 3.1.0
        systemd:
          units:
          - name: ctrl-alt-del.target
            mask: true
    EOF
    </pre>
    <p>
    This will mask the <tt>ctrl-alt-del.target</tt> systemd target for all the
    nodes labeled with the "master" role.
    </p>
    {{{ machineconfig_description_footer() | indent(4) }}}
    {{% endif %}}

    <p><strong>中文说明：</strong></p>
    <p>默认情况下，按下 <tt>Ctrl-Alt-Del</tt> 键序列时，<tt>SystemD</tt> 将重启系统。</p>
    <p>在非 RHCOS 的系统中，应将系统配置为忽略来自命令行的 <tt>Ctrl-Alt-Del</tt> 键序列，可执行 <tt>ln -sf /dev/null /etc/systemd/system/ctrl-alt-del.target</tt> 或 <tt>systemctl mask ctrl-alt-del.target</tt>。不要直接删除 <tt>/usr/lib/systemd/system/ctrl-alt-del.service</tt>，因为该文件可能在将来的系统更新中恢复。</p>
    <p>在 RHCOS 中，应创建 <tt>machineconfiguration.openshift.io/v1</tt>、<tt>kind: MachineConfig</tt> 的配置，使用名称 <tt>75-master-disable-ctrlaltdel-reboot</tt> 和 <tt>machineconfiguration.openshift.io/role: master</tt> 标签，并在 <tt>spec.config.ignition.version: 3.1.0</tt> 下的 <tt>systemd.units</tt> 中将单元 <tt>ctrl-alt-del.target</tt> 设置为 <tt>mask: true</tt>。此配置会为所有具有 <tt>master</tt> 角色的节点屏蔽该 systemd target；必须针对每个 <tt>MachineConfigPool</tt> 执行相应配置。有关使用 Machine Config Operator 配置节点的更多信息，请参阅 <a href="https://docs.openshift.com/container-platform/4.6/post_installation_configuration/machine-configuration-tasks.html">OpenShift 官方文档</a>。</p>

rationale: |-
    A locally logged-in user who presses Ctrl-Alt-Del, when at the console,
    can reboot the system. If accidentally pressed, as could happen in
    the case of mixed OS environment, this can create the risk of short-term
    loss of availability of systems due to unintentional reboot.

    <p><strong>中文理由：</strong></p>
    <p>本地登录用户在控制台按下 Ctrl-Alt-Del 时可重启系统。如果误按，例如在混合操作系统环境中可能发生，这可能导致系统意外重启，带来短期可用性损失风险。</p>

