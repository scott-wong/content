documentation_complete: true

title: 'Install authselect Package'

description: |-
    {{{ describe_package_install(package="authselect") }}}

    <p><strong>中文说明：</strong></p>
    <p>应安装 <tt>authselect</tt> 软件包。</p>

rationale: |-
    The <tt>authselect</tt> package provides a tool to select system authentication and
    identity sources from a list of supported profiles instead of letting the administrator
    manually build the PAM stack. Authselect is a successor to authconfig and helps avoid
    potential breakage of configuration by shipping several tested profiles that are well
    tested and supported. Ensuring the latest version of authselect is installed helps
    maintain system security by providing the latest security fixes and features.

    <p><strong>中文理由：</strong></p>
    <p><tt>authselect</tt> 软件包提供一种工具，可从受支持的配置档列表中选择系统身份验证和身份来源，而不必让管理员手动构建 PAM 堆栈。Authselect 是 authconfig 的后继产品，通过提供多个经过充分测试并受支持的配置档，帮助避免配置损坏。确保安装最新版本的 authselect 可通过提供最新安全修复和功能来维护系统安全。</p>

severity: medium

identifiers:
    cce@rhel8: CCE-89186-1

{{{ complete_ocil_entry_package_installed("authselect") }}}

template:
    name: package_installed
    vars:
        pkgname: authselect
