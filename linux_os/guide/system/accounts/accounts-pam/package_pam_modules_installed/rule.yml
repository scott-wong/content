documentation_complete: true

title: "Install pam-modules Package"

description: |-
    {{{ describe_package_install(package="libpam-modules") }}}

    <p><strong>中文说明：</strong></p>
    应安装 <tt>libpam-modules</tt> 软件包。

rationale: |-
    libpam-modules contains PAM modules that are needed
    by other rules when configuring PAM options.

    <p><strong>中文理由：</strong></p>
    libpam-modules 包含配置 PAM 选项时其他规则所需的 PAM 模块。

severity: medium

platform: package[pam]

template:
    name: package_installed
    vars:
        pkgname: libpam-modules
        evr@ubuntu2204: 0:1.4.0-11
        evr@ubuntu2404: 0:1.5.3-5
        evr@debian12: 0:1.5.2-6
