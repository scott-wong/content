documentation_complete: true

title: 'Prevent Login to Accounts With Empty Password'

description: |-
    If an account is configured for password authentication
    but does not have an assigned password, it may be possible to log
    into the account without authentication. Remove any instances of the
    <tt>nullok</tt> in
    <tt>/etc/pam.d/common-{password,auth,account,session,session-noninteractive}</tt>
    to prevent logins with empty passwords.

    <p><strong>中文说明：</strong></p>
    <p>如果账户配置为使用密码身份验证但未分配密码，则可能无需身份验证即可登录该账户。请从 <tt>/etc/pam.d/common-{password,auth,account,session,session-noninteractive}</tt> 中移除所有 <tt>nullok</tt> 实例，以防止使用空密码登录。</p>

rationale: |-
    If an account has an empty password, anyone could log in and
    run commands with the privileges of that account. Accounts with
    empty passwords should never be used in operational environments.

    <p><strong>中文理由：</strong></p>
    <p>如果账户密码为空，任何人都可以登录并以该账户的权限运行命令。运行环境中绝不应使用空密码账户。</p>

severity: high

platform: system_with_kernel and package[pam]
