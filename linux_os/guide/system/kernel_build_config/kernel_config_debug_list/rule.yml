documentation_complete: true

title: 'Enable checks on linked list manipulation'

description: |-
    Enable this to turn on extended checks in the linked-list walking routines.

    {{{ describe_kernel_build_config("CONFIG_DEBUG_LIST", "y") | indent(4) }}}

    <p><strong>中文说明：</strong></p>
    启用此项可开启链表遍历例程的扩展检查。
    用于构建内核的配置位于 <tt>/boot/config-*</tt>。要检查 <tt>CONFIG_DEBUG_LIST</tt> 的配置值，请运行：
    <tt>grep CONFIG_DEBUG_LIST /boot/config-*</tt>
    对于每个已安装内核，应返回一行包含值“y”的配置。

rationale: |-
    This add sanity checks to manipulation of linked lists structures in the kernel and may
    prevent exploits such as CVE-2017-1661, where a race condition and simultaneous operations
    caused a list to corrupt.

    <p><strong>中文理由：</strong></p>
    这会为内核中链表结构的操作添加健全性检查，并可能防止 CVE-2017-1661 等漏洞，该漏洞中竞态条件和并发操作导致链表损坏。

warnings:
    {{{ warning_kernel_build_config() | indent(4) }}}

severity: low

identifiers:
    cce@rhel8: CCE-86986-7
    cce@rhel9: CCE-86987-5
    cce@rhel10: CCE-86739-0
    cce@sle16: CCE-96574-9

ocil_clause: 'the kernel was not built with the required value'

ocil: |-
    {{{ ocil_kernel_build_config("CONFIG_DEBUG_LIST", "y") | indent(4) }}}

template:
    name: kernel_build_config
    vars:
        config: CONFIG_DEBUG_LIST
        value: 'y'

