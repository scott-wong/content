documentation_complete: true


title: 'Randomize slab freelist'

description: |-
    Randomizes the freelist order used on creating new pages.
    This configuration is available from kernel 5.9, but may be available if backported by distros.

    {{{ describe_kernel_build_config("CONFIG_SLAB_FREELIST_RANDOM", "y") | indent(4) }}}

    <p><strong>中文说明：</strong></p>
    <p>随机化创建新页面时使用的 freelist 顺序。此配置从 Linux 5.9 起可用，但发行版若进行回移植也可能提供。

    用于构建内核的配置位于 <tt>/boot/config-*</tt>。要检查 <tt>CONFIG_SLAB_FREELIST_RANDOM</tt> 的配置值，请运行 <tt>grep CONFIG_SLAB_FREELIST_RANDOM /boot/config-*</tt>。对于每个已安装的内核，应返回值为 <tt>y</tt> 的行。</p>

rationale: |-
    This security feature reduces the predictability of the kernel slab allocator against heap overflows.

    <p><strong>中文理由：</strong></p>
    <p>此安全功能降低内核 slab 分配器对抗堆溢出时的可预测性。</p>

warnings:
    {{{ warning_kernel_build_config() | indent(4) }}}

severity: medium

identifiers:
    cce@rhel8: CCE-87725-8
    cce@rhel9: CCE-87726-6
    cce@rhel10: CCE-87141-8

ocil_clause: 'the kernel was not built with the required value'

ocil: |-
    {{{ ocil_kernel_build_config("CONFIG_SLAB_FREELIST_RANDOM", "y") | indent(4) }}}

template:
    name: kernel_build_config
    vars:
        config: CONFIG_SLAB_FREELIST_RANDOM
        value: 'y'

