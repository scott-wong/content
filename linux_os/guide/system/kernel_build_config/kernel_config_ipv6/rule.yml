documentation_complete: true

title: 'Disable the IPv6 protocol'

description: |-
    Disable support for IP version 6 (IPv6).

    {{{ describe_kernel_build_config("CONFIG_IPV6", "n") | indent(4) }}}

    <p><strong>中文说明：</strong></p>
    禁用对 IP 版本 6（IPv6）的支持。
    用于构建内核的配置位于 <tt>/boot/config-*</tt>。要检查 <tt>CONFIG_IPV6</tt> 的配置值，请运行：
    <tt>grep CONFIG_IPV6 /boot/config-*</tt>
    值为 'n' 的配置不会在文件中显式设置，因此应返回注释行或没有行。

rationale: |-
    Any unnecessary network stacks, including IPv6, should be disabled to reduce
    the vulnerability to exploitation.

    <p><strong>中文理由：</strong></p>
    应禁用包括 IPv6 在内的任何不必要网络栈，以降低被利用的可能性。

warnings:
    {{{ warning_kernel_build_config() | indent(4) }}}

severity: medium

identifiers:
    cce@rhel8: CCE-87225-9
    cce@rhel9: CCE-87226-7


ocil_clause: 'the kernel was not built with the required value'

ocil: |-
    {{{ ocil_kernel_build_config("CONFIG_IPV6", "n") | indent(4) }}}

template:
    name: kernel_build_config
    vars:
        config: CONFIG_IPV6
        value: 'n'

