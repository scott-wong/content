documentation_complete: true

title: 'Disable /dev/kmem virtual device support'

description: |-
    Disable support for the /dev/kmem device.

    {{{ describe_kernel_build_config("CONFIG_DEVKMEM", "n") | indent(4) }}}

    <p><strong>中文说明：</strong></p>
    <p>禁用对 /dev/kmem 设备的支持。
    用于构建内核的配置位于 <tt>/boot/config-*</tt>。要检查 <tt>CONFIG_DEVKMEM</tt> 的配置值，请运行：
    <tt>grep CONFIG_DEVKMEM /boot/config-*</tt>
    值为 'n' 的配置不会在文件中显式设置，因此应返回注释行或没有行。</p>

rationale: |-
    The /dev/kmem device is rarely used, but can be used for certain kind of kernel debugging
    operations.

    <p><strong>中文理由：</strong></p>
    <p>/dev/kmem 设备很少使用，但可用于某些类型的内核调试操作。</p>

warnings:
    {{{ warning_kernel_build_config() | indent(4) }}}

severity: low

identifiers:
    cce@rhel8: CCE-86947-9
    cce@rhel9: CCE-86948-7
    cce@rhel10: CCE-87428-9
    cce@sle16: CCE-96408-0

ocil_clause: 'the kernel was not built with the required value'

ocil: |-
    {{{ ocil_kernel_build_config("CONFIG_DEVKMEM", "n") | indent(4) }}}

template:
    name: kernel_build_config
    vars:
        config: CONFIG_DEVKMEM
        value: 'n'

