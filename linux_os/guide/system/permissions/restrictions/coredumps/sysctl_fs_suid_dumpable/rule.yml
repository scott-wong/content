documentation_complete: true

title: 'Disable Core Dumps for SUID programs'

description: |-
    {{{ describe_sysctl_option_value(sysctl="fs.suid_dumpable", value="0") }}}

    <p><strong>中文说明：</strong></p>
    <p>应将内核参数 <tt>fs.suid_dumpable</tt> 设置为 <tt>0</tt>。要在运行时应用，请运行 <tt>sysctl -w fs.suid_dumpable=0</tt>；要持久化，请将 <tt>fs.suid_dumpable = 0</tt> 添加到 <tt>/etc/sysctl.d</tt> 中的文件。</p>

rationale: |-
    The core dump of a setuid program is more likely to contain
    sensitive data, as the program itself runs with greater privileges than the
    user who initiated execution of the program.  Disabling the ability for any
    setuid program to write a core file decreases the risk of unauthorized access
    of such data.

    <p><strong>中文理由：</strong></p>
    <p>setuid 程序的核心转储更可能包含敏感数据，因为程序本身以高于启动执行的用户的权限运行。禁止任何 setuid 程序写入核心转储文件可降低此类数据被未经授权访问的风险。</p>

severity: medium

