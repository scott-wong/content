documentation_complete: true


title: 'Limit sampling frequency of the Perf system'

description: |-
    {{{ describe_sysctl_option_value(sysctl="kernel.perf_event_max_sample_rate", value="1") }}}

    <p><strong>中文说明：</strong></p>
    <p>应将内核参数 <tt>kernel.perf_event_max_sample_rate</tt> 设置为 <tt>1</tt>。要在运行时应用，请运行 <tt>sudo sysctl -w kernel.perf_event_max_sample_rate=1</tt>；要持久化，请将 <tt>kernel.perf_event_max_sample_rate = 1</tt> 添加到 <tt>/etc/sysctl.d</tt> 中的文件。</p>

rationale: |-
    The <tt>kernel.perf_event_max_sample_rate</tt> parameter configures maximum
    frequency of collecting of samples for the Perf system. It is expressed in
    samples per second. Restricting usage of <tt>Perf</tt> system decreases risk
    of potential availability problems.

    <p><strong>中文理由：</strong></p>
    <p><tt>kernel.perf_event_max_sample_rate</tt> 参数配置 Perf 系统采集样本的最大频率，以每秒样本数表示。限制 <tt>Perf</tt> 系统的使用可降低潜在可用性问题风险。</p>

severity: medium

identifiers:
    cce@rhel8: CCE-83368-1
    cce@rhel9: CCE-83962-1
