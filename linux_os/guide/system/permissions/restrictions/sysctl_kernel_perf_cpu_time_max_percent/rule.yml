documentation_complete: true


title: 'Limit CPU consumption of the Perf system'

description: |-
    {{{ describe_sysctl_option_value(sysctl="kernel.perf_cpu_time_max_percent", value="1") }}}

    <p><strong>中文说明：</strong></p>
    应将内核参数 <tt>kernel.perf_cpu_time_max_percent</tt> 设置为 <tt>1</tt>。要在运行时应用，请运行 <tt>sysctl -w kernel.perf_cpu_time_max_percent=1</tt>；要持久化，请将 <tt>kernel.perf_cpu_time_max_percent = 1</tt> 添加到 <tt>/etc/sysctl.d</tt> 中的文件。

rationale: |-
    The <tt>kernel.perf_cpu_time_max_percent</tt> configures a threshold of
    maximum percentile of CPU that can be used by Perf system. Restricting usage
    of <tt>Perf</tt> system decreases risk of potential availability problems.

    <p><strong>中文理由：</strong></p>
    <tt>kernel.perf_cpu_time_max_percent</tt> 配置 Perf 系统可使用的 CPU 最大百分比阈值。限制 <tt>Perf</tt> 系统的使用可降低潜在可用性问题风险。

severity: medium

identifiers:
    cce@rhel8: CCE-83373-1
    cce@rhel9: CCE-83969-6
    cce@rhel10: CCE-87824-9
    cce@sle12: CCE-91567-8
    cce@sle15: CCE-91257-6
    cce@sle16: CCE-95810-8

{{{ complete_ocil_entry_sysctl_option_value(sysctl="kernel.perf_cpu_time_max_percent", value="1") }}}

platform: system_with_kernel

