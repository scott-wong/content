documentation_complete: true

title: 'Verify User Who Owns /var/log/syslog File'

{{%  if product in ['ubuntu2404'] %}}
description: |-
    {{{ describe_file_owner(file="/var/log/syslog", owner="syslog|root") }}}

    <p><strong>中文说明：</strong></p>
    <p><tt>/var/log/syslog</tt> 的文件所有者必须为 <tt>syslog</tt> 或 <tt>root</tt>。</p>
{{%- elif 'debian' in product %}}
description: '{{{ describe_file_owner(file="/var/log/syslog", owner="root") }}}'
{{%- else %}}
description: '{{{ describe_file_owner(file="/var/log/syslog", owner="syslog") }}}'
{{%- endif %}}

rationale: |-
    The <tt>/var/log/syslog</tt> file contains logs of error messages in
    the system and should only be accessed by authorized personnel.

    <p><strong>中文理由：</strong></p>
    <p><tt>/var/log/syslog</tt> 文件包含系统错误消息日志，只应由经过授权的人员访问。</p>

severity: medium

references:
    srg: SRG-OS-000206-GPOS-00084

{{%- if product in ['ubuntu2404'] %}}
ocil_clause: '{{{ ocil_clause_file_owner(file="/var/log/syslog", owner="syslog|root") }}}'

ocil: |-
    {{{ ocil_file_owner(file="/var/log/syslog", owner="syslog|root") }}}

template:
    name: file_owner
    vars:
        filepath: /var/log/syslog
        uid_or_name: 'syslog|root'
{{%- elif 'debian' in product %}}
ocil_clause: '{{{ ocil_clause_file_owner(file="/var/log/syslog", owner="root") }}}'

ocil: |-
    {{{ ocil_file_owner(file="/var/log/syslog", owner="root") }}}

template:
    name: file_owner
    vars:
        filepath: /var/log/syslog
        uid_or_name: 'root'
{{%- else %}}
ocil_clause: '{{{ ocil_clause_file_owner(file="/var/log/syslog", owner="syslog") }}}'

ocil: |-
    {{{ ocil_file_owner(file="/var/log/syslog", owner="syslog") }}}

fixtext: |-
    {{{ describe_file_owner(file="/var/log/syslog", owner="syslog") }}}

srg_requirement: '{{{ srg_requirement_file_owner("/var/log/syslog", owner="syslog") }}}'

platform: package[rsyslog]

template:
    name: file_owner
    vars:
        filepath: /var/log/syslog
        uid_or_name: syslog
{{%- endif %}}

