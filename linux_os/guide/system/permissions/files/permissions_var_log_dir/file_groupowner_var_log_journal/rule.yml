documentation_complete: true

title: 'Verify Group Who Owns /var/log/*.journal(~) File'

description: |-
    {{{ describe_file_group_owner(file="/var/log/*.journal(~)", group="systemd-journal|root") }}}

    <p><strong>中文说明：</strong></p>
    <tt>/var/log/*.journal(~)</tt> 的文件所属组必须为 <tt>systemd-journal</tt> 或 <tt>root</tt>。

rationale: |-
    The <tt>/var/log/*.journal(~)</tt> files are system logs managed by the "systemd" service.

    <p><strong>中文理由：</strong></p>
    <tt>/var/log/*.journal(~)</tt> 文件是由 "systemd" 服务管理的系统日志。

severity: medium

ocil_clause: '{{{ ocil_clause_file_group_owner(file="/var/log/*.journal(~)", group="systemd-journal|root") }}}'

ocil: |-
    {{{ ocil_file_group_owner(file="/var/log/*.journal(~)", group="systemd-journal|root") }}}

template:
    name: file_groupowner
    vars:
        filepath: /var/log/
        file_regex: .*\.journal[~]?
        recursive: true
        gid_or_name: 'systemd-journal|root'
