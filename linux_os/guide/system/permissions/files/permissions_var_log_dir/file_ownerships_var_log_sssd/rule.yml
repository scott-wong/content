documentation_complete: true

title: 'Verify Ownership of Files in /var/log/sssd'

description: |-
    {{{ describe_file_owner(file="/var/log/sssd/*", owner="sssd|root") }}}

    <p><strong>中文说明：</strong></p>
    <tt>/var/log/sssd/*</tt> 的文件所有者必须为 <tt>sssd</tt> 或 <tt>root</tt>。

rationale: |-
    The <tt>/var/log/sssd</tt> directory contains debug logs for the System
    Security Services Daemon (SSSD) and should only be accessed by authorized personnel.

    <p><strong>中文理由：</strong></p>
    <tt>/var/log/sssd</tt> 目录包含 System Security Services Daemon（SSSD）的调试日志，只应由经过授权的人员访问。

severity: medium

ocil_clause: '{{{ ocil_clause_file_owner(file="/var/log/sssd/*", owner="sssd|root") }}}'

ocil: |-
    {{{ ocil_file_owner(file="/var/log/sssd/*", owner="sssd|root") }}}

template:
    name: file_owner
    vars:
        filepath: /var/log/sssd/
        file_regex: .*
        recursive: true
        uid_or_name: 'sssd|root'
