documentation_complete: true

title: 'Verify User Who Owns /var/log/localmessages File'

description: |-
    {{{ describe_file_owner(file="/var/log/localmessages", owner="syslog|root") }}}

    <p><strong>中文说明：</strong></p>
    <p><tt>/var/log/localmessages</tt> 的文件所有者必须为 <tt>syslog</tt> 或 <tt>root</tt>。</p>

rationale: |-
    The <tt>/var/log/localmessages</tt> file contains log messages from certain boot scripts,
    including the DHCP client, and should only be accessed by authorized personnel.

    <p><strong>中文理由：</strong></p>
    <p><tt>/var/log/localmessages</tt> 文件包含某些启动脚本（包括 DHCP 客户端）的日志消息，只应由经过授权的人员访问。</p>

severity: medium

ocil_clause: '{{{ ocil_clause_file_owner(file="/var/log/localmessages", owner="syslog|root") }}}'

ocil: |-
    {{{ ocil_file_owner(file="/var/log/localmessages", owner="syslog|root") }}}

template:
    name: file_owner
    vars:
        filepath: /var/log/
        file_regex: .*localmessages.*
        uid_or_name: 'syslog|root'

