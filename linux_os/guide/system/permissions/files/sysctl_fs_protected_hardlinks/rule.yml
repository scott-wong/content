documentation_complete: true

title: 'Enable Kernel Parameter to Enforce DAC on Hardlinks'

description: |-
    {{{ describe_sysctl_option_value(sysctl="fs.protected_hardlinks", value="1") }}}

    <p><strong>中文说明：</strong></p>
    要设置内核参数 <tt>fs.protected_hardlinks</tt> 的运行时状态，请运行以下命令：<tt>sudo sysctl -w fs.protected_hardlinks=1</tt>

    为确保该设置持久生效，请将以下行添加到 <tt>/etc/sysctl.d</tt> 目录中的文件：<tt>fs.protected_hardlinks = 1</tt>

rationale: |-
    By enabling this kernel parameter, users can no longer create soft or hard links to
    files which they do not own. Disallowing such hardlinks mitigate vulnerabilities
    based on insecure file system accessed by privileged programs, avoiding an
    exploitation vector exploiting unsafe use of <tt>open()</tt> or <tt>creat()</tt>.

    <p><strong>中文理由：</strong></p>
    启用此内核参数后，用户不能再创建指向其不拥有文件的软链接或硬链接。禁止此类硬链接可缓解特权程序访问不安全文件系统所导致的漏洞，避免利用 <tt>open()</tt> 或 <tt>creat()</tt> 不安全使用方式的攻击途径。

