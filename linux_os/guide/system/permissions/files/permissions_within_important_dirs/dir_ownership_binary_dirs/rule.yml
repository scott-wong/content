documentation_complete: true

title: 'Verify that System Executable Have Root Ownership'

description: |-
    <pre>/bin
    /sbin
    /usr/bin
    /usr/sbin
    /usr/local/bin
    /usr/local/sbin</pre>
    All these directories should be owned by the <tt>root</tt> user.
    If any directory <i>DIR</i> in these directories is found
    to be owned by a user other than root, correct its ownership with the
    following command:
    <pre>$ sudo chown root <i>DIR</i></pre>

    <p><strong>中文说明：</strong></p>
    <pre>/bin
    /sbin
    /usr/bin
    /usr/sbin
    /usr/local/bin
    /usr/local/sbin</pre>
    所有这些目录都应由 <tt>root</tt> 用户拥有。如果发现这些目录中的任何目录 <i>DIR</i> 由 root 以外的用户拥有，请使用以下命令更正其所有权：
    <pre>$ sudo chown root <i>DIR</i></pre>

rationale: |-
    System binaries are executed by privileged users as well as system services,
    and restrictive permissions are necessary to ensure that their
    execution of these programs cannot be co-opted.

    <p><strong>中文理由：</strong></p>
    <p>系统二进制文件由特权用户和系统服务执行，必须设置严格权限，以确保这些程序的执行不能被劫持或滥用。</p>

severity: medium

references:
    srg: SRG-OS-000258-GPOS-00099

ocil_clause: 'any system executables directories are found to not be owned by root'

ocil: |-
    System executables are stored in the following directories by default:
    <pre>/bin
    /sbin
    /usr/bin
    /usr/local/bin
    /usr/local/sbin
    /usr/sbin</pre>
    For each of these directories, run the following command to find files
    not owned by root:
    <pre>$ sudo find -L <i>DIR/</i> ! -user root -type d -exec chown root {} \;</pre>

template:
    name: file_owner
    vars:
        filepath:
            - /bin/
            - /sbin/
            - /usr/bin/
            - /usr/sbin/
            - /usr/local/bin/
            - /usr/local/sbin/
        recursive: 'true'
        uid_or_name: '0'
