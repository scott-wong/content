documentation_complete: true

title: 'Enable Kernel Parameter to Enforce DAC on FIFOs'

description: |-
    {{{ describe_sysctl_option_value(sysctl="fs.protected_fifos", value="2") }}}

    <p><strong>中文说明：</strong></p>
    <p>要设置内核参数 <tt>fs.protected_fifos</tt> 的运行时状态，请运行以下命令：<tt>sudo sysctl -w fs.protected_fifos=2</tt>

    为确保该设置持久生效，请将以下行添加到 <tt>/etc/sysctl.d</tt> 目录中的文件：<tt>fs.protected_fifos = 2</tt></p>

rationale: |-
    This parameter is available since Linux Kernel 4.19 and allows to prohibit opening
    FIFOs that are not owned by the user in world and group writeable sticky directories.
    It avoids unintentional writes to an attacker-controlled FIFO where a program expects
    to create the regular file.

    <p><strong>中文理由：</strong></p>
    <p>此参数自 Linux 内核 4.19 起可用，可禁止在世界和组可写的粘性目录中打开不属于用户的 FIFO。它可避免程序期望创建常规文件时意外写入攻击者控制的 FIFO。</p>

severity: medium

identifiers:
    cce@rhel9: CCE-85884-5
    cce@rhel10: CCE-87125-1
    cce@sle16: CCE-96680-4

references:
    nist: CM-6(a),AC-6(1)

