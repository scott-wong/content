documentation_complete: true

title: 'Ensure overlayfs kernel module is not available'

description: |-
    {{{ describe_module_disable(module="overlay") }}}
    overlayfs is a Linux filesystem that layers multiple filesystems to create a single
    unified view which allows a user to "merge" several mount points into a unified
    filesystem.

    <p><strong>中文说明：</strong></p>
    <p>要将系统配置为防止加载 <tt>overlay</tt> 内核模块，请将以下行添加到 <tt>/etc/modprobe.d/overlay.conf</tt> 文件：<tt>install overlay /bin/false</tt>。此条目会在安装 <tt>overlay</tt> 模块时返回非零值，并通过错误消息向用户说明该条目的含义。如果希望省略非零返回值和错误消息，可改为添加 <tt>install overlay /bin/true</tt>（OVAL 允许 <tt>/bin/true</tt> 和 <tt>/bin/false</tt>，扫描时均会接受）。在适用产品上，还可将 <tt>blacklist overlay</tt> 添加到同一文件，以配置系统防止使用该模块。

    overlayfs 是一种 Linux 文件系统，可分层组合多个文件系统以创建单一统一视图，使用户能够将多个挂载点“合并”为一个统一文件系统。</p>

rationale: |-
    The overlayfs has known CVE's. Disabling the overlayfs reduces the local attack
    surface by removing support for unnecessary filesystem types and mitigates potential
    risks associated with unauthorized execution of setuid files, enhancing the overall
    system security.

    <p><strong>中文理由：</strong></p>
    <p>overlayfs 存在已知 CVE。禁用 overlayfs 可移除对不必要文件系统类型的支持，从而减少本地攻击面，并缓解与未经授权执行 setuid 文件相关的潜在风险，提升整体系统安全性。</p>

severity: low

identifiers:
    cce@rhel8: CCE-90461-5
    cce@rhel10: CCE-87507-0
    cce@sle15: CCE-92579-2

platform: system_with_kernel

template:
    name: kernel_module_disabled
    vars:
        kernmodule: overlay
