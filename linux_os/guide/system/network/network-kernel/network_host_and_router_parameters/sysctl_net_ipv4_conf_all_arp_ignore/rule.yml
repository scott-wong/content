documentation_complete: true

title: 'Configure Response Mode of ARP Requests for All IPv4 Interfaces'

description: |-
    {{{ describe_sysctl_option_value(sysctl="net.ipv4.conf.all.arp_ignore", value=xccdf_value("sysctl_net_ipv4_conf_all_arp_ignore_value")) }}}

    <p><strong>中文说明：</strong></p>
    要设置内核参数 <tt>net.ipv4.conf.all.arp_ignore</tt> 的运行时状态，请运行以下命令：<tt>sudo sysctl -w net.ipv4.conf.all.arp_ignore={{{ xccdf_value("sysctl_net_ipv4_conf_all_arp_ignore_value") }}}</tt>

    为确保该设置持久生效，请将以下行添加到 <tt>/etc/sysctl.d</tt> 目录中的文件：<tt>net.ipv4.conf.all.arp_ignore = {{{ xccdf_value("sysctl_net_ipv4_conf_all_arp_ignore_value") }}}</tt>

rationale: |-
    Avoids ARP Flux on system that have more than one interface on the same subnet.

    <p><strong>中文理由：</strong></p>
    避免在同一子网具有多个接口的系统上出现 ARP Flux。

warnings:
    - functionality: |-
       The ARP response mode may impact behaviour of workloads and firewalls on the system.

severity: medium

identifiers:
    cce@rhel8: CCE-88889-1
    cce@rhel9: CCE-89889-0
    cce@rhel10: CCE-87433-9
    cce@sle15: CCE-92610-5
    cce@sle16: CCE-96367-8

{{{ complete_ocil_entry_sysctl_option_value(sysctl="net.ipv4.conf.all.arp_ignore", value=xccdf_value("sysctl_net_ipv4_conf_all_arp_ignore")) }}}

