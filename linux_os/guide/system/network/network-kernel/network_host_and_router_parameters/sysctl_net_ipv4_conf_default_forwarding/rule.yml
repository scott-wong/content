documentation_complete: true

title: Disable Kernel Parameter for IPv4 Forwarding By Default

description: |-
    {{{ describe_sysctl_option_value(sysctl="net.ipv4.conf.default.forwarding", value="0") }}}

    <p><strong>中文说明：</strong></p>
    应将内核参数 <tt>net.ipv4.conf.default.forwarding</tt> 设置为 <tt>0</tt>。要在运行时应用，请运行 <tt>sysctl -w net.ipv4.conf.default.forwarding=0</tt>；要持久化，请将 <tt>net.ipv4.conf.default.forwarding = 0</tt> 添加到 <tt>/etc/sysctl.d</tt> 中的文件。

rationale: |-
    IP forwarding permits the kernel to forward packets from one network
    interface to another. The ability to forward packets between two networks is
    only appropriate for systems acting as routers.

    <p><strong>中文理由：</strong></p>
    IP 转发允许内核将数据包从一个网络接口转发到另一个网络接口。只有充当路由器的系统才适合在两个网络之间转发数据包。

severity: medium

identifiers:
    cce@rhel8: CCE-86652-5
    cce@rhel10: CCE-88797-6

ocil_clause: 'IP forwarding value is "1" and the system is not router'

ocil: |-
    {{{ ocil_sysctl_option_value(sysctl="net.ipv4.conf.default.forwarding", value="0") }}}
    The ability to forward packets is only appropriate for routers.

fixtext: |-
    Configure {{{ full_name }}} to not allow packet forwarding unless the system is a router with the following commands:
    {{{ fixtext_sysctl(sysctl="net.ipv4.conf.default.forwarding", value="0") | indent(4) }}}

srg_requirement: '{{{ full_name }}} must not perform packet forwarding unless the system is a router.'

platform: system_with_kernel


warnings:
    - general: |-
        There might be cases when certain applications can systematically override this option.
        One such case is {{{ weblink("https://libvirt.org/", "Libvirt") }}}; a toolkit for managing of virtualization platforms.
        By default, Libvirt requires IP forwarding to be enabled to facilitate
        network communication between the virtualization host and guest
        machines. It enables IP forwarding after every reboot.

template:
    name: sysctl
    vars:
        sysctlvar: net.ipv4.conf.default.forwarding
        datatype: int
