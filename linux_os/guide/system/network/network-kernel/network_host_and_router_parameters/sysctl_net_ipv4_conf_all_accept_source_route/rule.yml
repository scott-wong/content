documentation_complete: true


title: 'Disable Kernel Parameter for Accepting Source-Routed Packets on all IPv4 Interfaces'

description: |-
    {{{ describe_sysctl_option_value(sysctl="net.ipv4.conf.all.accept_source_route", value="0") }}}

    <p><strong>中文说明：</strong></p>
    <p>要设置内核参数 <tt>net.ipv4.conf.all.accept_source_route</tt> 的运行时状态，请运行以下命令：<tt>sudo sysctl -w net.ipv4.conf.all.accept_source_route=0</tt>

    为确保该设置持久生效，请将以下行添加到 <tt>/etc/sysctl.d</tt> 目录中的文件：<tt>net.ipv4.conf.all.accept_source_route = 0</tt></p>

rationale: |-
    Source-routed packets allow the source of the packet to suggest routers
    forward the packet along a different path than configured on the router,
    which can be used to bypass network security measures. This requirement
    applies only to the forwarding of source-routerd traffic, such as when IPv4
    forwarding is enabled and the system is functioning as a router.
    <br /><br />
    Accepting source-routed packets in the IPv4 protocol has few legitimate
    uses. It should be disabled unless it is absolutely required.

    <p><strong>中文理由：</strong></p>
    <p>源路由数据包允许数据包源建议路由器沿不同于路由器配置的路径转发该数据包，这可用于绕过网络安全措施。此要求仅适用于源路由流量的转发，例如启用 IPv4 转发且系统充当路由器时。<br /><br />在 IPv4 协议中接受源路由数据包几乎没有合法用途。除非绝对必要，否则应禁用此功能。</p>

