documentation_complete: true

title: 'Remove ufw Package'

description: |-
    {{{ describe_package_remove(package="ufw") }}}

    <p><strong>中文说明：</strong></p>
    <p>应删除 <tt>ufw</tt> 软件包。</p>

rationale: |-
    Running <tt>iptables.persistent</tt> with <tt>ufw</tt> enabled may lead
