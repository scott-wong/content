documentation_complete: true

title: 'Install ufw Package'

description: |-
    {{{ describe_package_install(package="ufw") }}}

    <p><strong>中文说明：</strong></p>
    <p>应安装 <tt>ufw</tt> 软件包。</p>

rationale: |-
    <tt>ufw</tt> controls the Linux kernel network packet filtering
    code. <tt>ufw</tt> allows system operators to set up firewalls and IP
    masquerading, etc.

    <p><strong>中文理由：</strong></p>
    <p><tt>ufw</tt> 控制 Linux 内核网络数据包过滤代码。<tt>ufw</tt> 允许系统运维人员设置防火墙和 IP 伪装等。</p>

severity: medium

references:
    srg: SRG-OS-000297-GPOS-00115

{{{ complete_ocil_entry_package_installed("ufw") }}}

{{%- if 'ubuntu' in product %}}
template:
    name: package_installed_guard_var
    vars:
        pkgname: ufw
        variable: var_network_filtering_service
        value: ufw
        operation: pattern match
{{%- else %}}
template:
    name: package_installed
    vars:
        pkgname: ufw
{{%- endif %}}
