documentation_complete: true


title: 'Configure Denying Router Solicitations on All IPv6 Interfaces By Default'

description: |-
    {{{ describe_sysctl_option_value(sysctl="net.ipv6.conf.default.router_solicitations", value="0") }}}

    <p><strong>中文说明：</strong></p>
    要设置内核参数 <tt>net.ipv6.conf.default.router_solicitations</tt> 的运行时状态，请运行以下命令：<tt>sudo sysctl -w net.ipv6.conf.default.router_solicitations=0</tt>

    为确保该设置持久生效，请将以下行添加到 <tt>/etc/sysctl.d</tt> 目录中的文件：<tt>net.ipv6.conf.default.router_solicitations = 0</tt>

rationale: |-
    To prevent discovery of the system by other systems, router solicitation requests should be denied.

    <p><strong>中文理由：</strong></p>
    为防止其他系统发现本系统，应拒绝路由器请求。

severity: unknown

