documentation_complete: true


title: Configure Accepting Prefix Information in Router Advertisements on All IPv6 Interfaces

description: |-
    {{{ describe_sysctl_option_value(sysctl="net.ipv6.conf.all.accept_ra_pinfo", value="0") }}}

    <p><strong>中文说明：</strong></p>
    要设置内核参数 <tt>net.ipv6.conf.all.accept_ra_pinfo</tt> 的运行时状态，请运行以下命令：<tt>sudo sysctl -w net.ipv6.conf.all.accept_ra_pinfo=0</tt>

    为确保该设置持久生效，请将以下行添加到 <tt>/etc/sysctl.d</tt> 目录中的文件：<tt>net.ipv6.conf.all.accept_ra_pinfo = 0</tt>

rationale: |-
    An illicit router advertisement message could result in a man-in-the-middle attack.

    <p><strong>中文理由：</strong></p>
    非法的路由器通告消息可能导致中间人攻击。

severity: unknown

