documentation_complete: true


title: Configure Accepting Router Preference in Router Advertisements on All IPv6 Interfaces By Default

description: |-
    {{{ describe_sysctl_option_value(sysctl="net.ipv6.conf.default.accept_ra_rtr_pref", value="0") }}}

    <p><strong>中文说明：</strong></p>
    要设置内核参数 <tt>net.ipv6.conf.default.accept_ra_rtr_pref</tt> 的运行时状态，请运行以下命令：<tt>sudo sysctl -w net.ipv6.conf.default.accept_ra_rtr_pref=0</tt>

    为确保该设置持久生效，请将以下行添加到 <tt>/etc/sysctl.d</tt> 目录中的文件：<tt>net.ipv6.conf.default.accept_ra_rtr_pref = 0</tt>

rationale: |-
    An illicit router advertisement message could result in a man-in-the-middle attack.

    <p><strong>中文理由：</strong></p>
    非法的路由器通告消息可能导致中间人攻击。

severity: unknown

identifiers:
    cce@rhel8: CCE-84291-4
    cce@rhel9: CCE-84121-3
    cce@rhel10: CCE-90749-3
    cce@sle12: CCE-91525-6
