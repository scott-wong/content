documentation_complete: true


title: Configure Maximum Number of Autoconfigured Addresses on All IPv6 Interfaces By Default

description: |-
    {{{ describe_sysctl_option_value(sysctl="net.ipv6.conf.default.max_addresses", value="1") }}}

    <p><strong>中文说明：</strong></p>
    <p>要设置内核参数 <tt>net.ipv6.conf.default.max_addresses</tt> 的运行时状态，请运行以下命令：<tt>sudo sysctl -w net.ipv6.conf.default.max_addresses=1</tt>

    为确保该设置持久生效，请将以下行添加到 <tt>/etc/sysctl.d</tt> 目录中的文件：<tt>net.ipv6.conf.default.max_addresses = 1</tt></p>

rationale: >-
    The number of global unicast IPv6 addresses for each interface should be
    limited exactly to the number of statically configured addresses.

    <p><strong>中文理由：</strong></p>
    <p>每个接口的全局单播 IPv6 地址数量应严格限制为静态配置地址的数量。</p>

severity: unknown

identifiers:
    cce@rhel8: CCE-84257-5
    cce@rhel9: CCE-84117-1
    cce@rhel10: CCE-89273-7
    cce@sle12: CCE-91527-2
    cce@sle15: CCE-91212-1
