documentation_complete: true


title: 'Configure Denying Router Solicitations on All IPv6 Interfaces'

description: |-
    {{{ describe_sysctl_option_value(sysctl="net.ipv6.conf.all.router_solicitations", value="0") }}}

    <p><strong>中文说明：</strong></p>
    <p>要设置内核参数 <tt>net.ipv6.conf.all.router_solicitations</tt> 的运行时状态，请运行以下命令：<tt>sudo sysctl -w net.ipv6.conf.all.router_solicitations=0</tt>

    为确保该设置持久生效，请将以下行添加到 <tt>/etc/sysctl.d</tt> 目录中的文件：<tt>net.ipv6.conf.all.router_solicitations = 0</tt></p>

rationale: |-
    To prevent discovery of the system by other systems, router solicitation requests should be denied.

    <p><strong>中文理由：</strong></p>
    <p>为防止其他系统发现本系统，应拒绝路由器请求。</p>

severity: unknown

identifiers:
    cce@rhel8: CCE-84109-8
    cce@rhel9: CCE-84128-8
    cce@rhel10: CCE-89461-8
    cce@sle12: CCE-91522-3
    cce@sle15: CCE-91207-1
    cce@sle16: CCE-96065-8

