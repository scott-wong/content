documentation_complete: true


title: 'Disable Kernel Parameter for IPv6 Forwarding by default'

description: |-
    {{{ describe_sysctl_option_value(sysctl="net.ipv6.conf.default.forwarding", value="0") }}}

    <p><strong>中文说明：</strong></p>
    <p>要设置内核参数 <tt>net.ipv6.conf.default.forwarding</tt> 的运行时状态，请运行以下命令：<tt>sudo sysctl -w net.ipv6.conf.default.forwarding=0</tt>

    为确保该设置持久生效，请将以下行添加到 <tt>/etc/sysctl.d</tt> 目录中的文件：<tt>net.ipv6.conf.default.forwarding = 0</tt></p>

rationale: |-
    IP forwarding permits the kernel to forward packets from one network
    interface to another. The ability to forward packets between two networks is
    only appropriate for systems acting as routers.

    <p><strong>中文理由：</strong></p>
    <p>IP 转发允许内核将数据包从一个网络接口转发到另一个接口。在两个网络之间转发数据包的能力仅适用于充当路由器的系统。</p>

severity: medium

identifiers:
    cce@rhel8: CCE-88884-2
    cce@rhel10: CCE-87075-8
    cce@sle12: CCE-83248-5
    cce@sle15: CCE-85725-0
    cce@slmicro5: CCE-93641-9
    cce@slmicro6: CCE-95085-7

references:
    nist: CM-6(b),CM-6.1(iv)
    srg: SRG-OS-000480-GPOS-00227
    stigid@sle12: SLES-12-030365

ocil_clause: 'IPv6 Forwarding is not disabled'

ocil: |-
    {{{ ocil_sysctl_option_value(sysctl="net.ipv6.conf.default.forwarding", value="0") }}}
    The ability to forward packets is only appropriate for routers.

platform: system_with_kernel

template:
    name: sysctl
    vars:
        sysctlvar: net.ipv6.conf.default.forwarding
        datatype: int
