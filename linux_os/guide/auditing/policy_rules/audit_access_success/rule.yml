documentation_complete: true


title: 'Configure auditing of successful file accesses'

{{% set file_contents_audit_access_success =
"## Successful file access (any other opens) This has to go last.
## These next two are likely to result in a whole lot of events
-a always,exit -F arch=b32 -S open,openat,openat2,open_by_handle_at -F success=1 -F auid>=" ~ uid_min ~ " -F auid!=unset -F key=successful-access
-a always,exit -F arch=b64 -S open,openat,openat2,open_by_handle_at -F success=1 -F auid>=" ~ uid_min ~ " -F auid!=unset -F key=successful-access" %}}

description: |-
    Ensure that successful attempts to access a file are audited.

    The following rules configure audit as described above:
    <pre>{{{ file_contents_audit_access_success|indent }}}    </pre>

    Load new Audit rules into kernel by running:
    <pre>augenrules --load</pre>

    Note: This rule uses a special set of Audit rules to comply with OSPP 4.2.1. You may reuse this rule in different profiles. If you decide to do so, it is recommended that you inspect contents of the file closely and make sure that they are aligned with your needs.

    <p><strong>中文说明：</strong></p>
    确保对文件访问成功的尝试进行审计。

    以下规则按上述说明配置审计：
    <pre>{{{ file_contents_audit_access_success|indent }}}</pre>

    通过运行以下命令将新的 Audit 规则加载到内核：
    <pre>augenrules --load</pre>

    注意：此规则使用一组特殊的 Audit 规则，以符合 OSPP 4.2.1。可以在不同配置档中复用此规则。如果决定这样做，建议仔细检查文件内容，确保其符合需求。

rationale: |-
    Auditing of successful attempts to access a file helps in investigation of activities performed on the system.

    <p><strong>中文理由：</strong></p>
    审计成功访问文件的尝试有助于调查系统上执行的活动。

severity: medium

# on RHEL9 there are rules which cover particular hardware architectures
# so do not apply this rule but apply the specific one instead
{{% if product in ["rhel9", "rhel10"] %}}
platforms:
    - not aarch64_arch and not ppc64le_arch
{{% endif %}}

identifiers:
    cce@rhel8: CCE-82834-3
    cce@rhel9: CCE-83653-6
    cce@rhel10: CCE-89107-7

references:
    nist: AU-2(a)
    ospp: FAU_GEN.1.1.c
    srg: SRG-OS-000458-GPOS-00203,SRG-OS-000474-GPOS-00219,SRG-OS-000475-GPOS-00220,SRG-OS-000463-GPOS-00207,SRG-OS-000465-GPOS-00209,SRG-OS-000461-GPOS-00205

ocil_clause: 'the file does not exist or the content differs'

ocil: |-
    To verify that the <tt>Audit</tt> is correctly configured according to recommended rules, check the content of the file with the following command:
    <pre>cat /etc/audit/rules.d/30-ospp-v42-3-access-success.rules</pre>
    The output has to be exactly as follows:
    <pre>{{{ file_contents_audit_access_success|indent }}}    </pre>

template:
    name: audit_file_contents
    vars:
        filepath: /etc/audit/rules.d/30-ospp-v42-3-access-success.rules
        contents: |-
            {{{ file_contents_audit_access_success|indent(12) }}}
