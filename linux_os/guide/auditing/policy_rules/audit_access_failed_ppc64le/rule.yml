documentation_complete: true


title: 'Configure auditing of unsuccessful file accesses (ppc64le)'

{{% set file_contents_audit_access_failed =
"## Unsuccessful file access (any other opens) This has to go last.
-a always,exit -F arch=b64 -S open,openat,openat2,open_by_handle_at -F exit=-EACCES -F auid>=" ~ uid_min ~ " -F auid!=unset -F key=unsuccessful-access
-a always,exit -F arch=b64 -S open,openat,openat2,open_by_handle_at -F exit=-EPERM -F auid>=" ~ uid_min ~ " -F auid!=unset -F key=unsuccessful-access" %}}

description: |-
    Ensure that unsuccessful attempts to access a file are audited.

    The following rules configure audit as described above:
    <pre>{{{ file_contents_audit_access_failed|indent }}}    </pre>

    Load new Audit rules into kernel by running:
    <pre>augenrules --load</pre>

    Note: This rule uses a special set of Audit rules to comply with OSPP 4.2.1. You may reuse this rule in different profiles. If you decide to do so, it is recommended that you inspect contents of the file closely and make sure that they are aligned with your needs.

    <p><strong>中文说明：</strong></p>
    <p>确保对文件访问失败的尝试进行审计。

    以下规则按上述说明配置审计：</p>
    <pre>{{{ file_contents_audit_access_failed|indent }}}</pre>

    通过运行以下命令将新的 Audit 规则加载到内核：
    <pre>augenrules --load</pre>

    注意：此规则使用一组特殊的 Audit 规则，以符合 OSPP 4.2.1。可以在不同配置档中复用此规则。如果决定这样做，建议仔细检查文件内容，确保其符合需求。

rationale: |-
    Unsuccessful attempts to access a file might be signs of malicious activity happening within the system. Auditing of such activities helps in their monitoring and investigation.

    <p><strong>中文理由：</strong></p>
    <p>未成功访问文件的尝试可能表明系统中发生恶意活动。审计此类活动有助于对其进行监控和调查。</p>

severity: medium

platforms:
    - ppc64le_arch

identifiers:
    cce@rhel9: CCE-86001-5
    cce@rhel10: CCE-88260-5

references:
    nist: AU-2(a)
    ospp: FAU_GEN.1.1.c
    srg: SRG-OS-000458-GPOS-00203,SRG-OS-000474-GPOS-00219,SRG-OS-000475-GPOS-00220,SRG-OS-000463-GPOS-00207,SRG-OS-000465-GPOS-00209,SRG-OS-000461-GPOS-00205

ocil_clause: 'the file does not exist or the content differs'

ocil: |-
    To verify that the <tt>Audit</tt> is correctly configured according to recommended rules, check the content of the file with the following command:
    <pre>cat /etc/audit/rules.d/30-ospp-v42-3-access-failed.rules</pre>
    The output has to be exactly as follows:
    <pre>{{{ file_contents_audit_access_failed|indent }}}    </pre>

template:
    name: audit_file_contents
    vars:
        filepath: /etc/audit/rules.d/30-ospp-v42-3-access-failed.rules
        contents: |-
            {{{ file_contents_audit_access_failed|indent(12) }}}
