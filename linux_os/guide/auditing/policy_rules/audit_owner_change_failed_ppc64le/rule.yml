documentation_complete: true


title: 'Configure auditing of unsuccessful ownership changes (ppc64le)'

{{% set file_contents_audit_owner_change_failed =
"## Unsuccessful ownership change
-a always,exit -F arch=b64 -S lchown,fchown,chown,fchownat -F exit=-EACCES -F auid>=" ~ uid_min ~ " -F auid!=unset -F key=unsuccessful-owner-change
-a always,exit -F arch=b64 -S lchown,fchown,chown,fchownat -F exit=-EPERM -F auid>=" ~ uid_min ~ " -F auid!=unset -F key=unsuccessful-owner-change" %}}

description: |-
    Ensure that unsuccessful attempts to change an ownership of files or directories are audited.

    The following rules configure audit as described above:
    <pre>{{{ file_contents_audit_owner_change_failed|indent }}}    </pre>

    Load new Audit rules into kernel by running:
    <pre>augenrules --load</pre>

    Note: This rule uses a special set of Audit rules to comply with OSPP 4.2.1. You may reuse this rule in different profiles. If you decide to do so, it is recommended that you inspect contents of the file closely and make sure that they are aligned with your needs.

    <p><strong>中文说明：</strong></p>
    确保审计更改文件或目录所有权的失败尝试。

    以下规则按上述说明配置审计：
    <pre>{{{ file_contents_audit_owner_change_failed|indent }}}</pre>

    运行以下命令将新审计规则加载到内核：
    <pre>augenrules --load</pre>

    注意：此规则使用一组特殊审计规则来符合 OSPP 4.2.1。你可以在不同配置档中复用此规则。如果决定复用此规则，建议仔细检查文件内容，并确保其与你的需求一致。

rationale: |-
    Unsuccessful attempts to change an ownership of files or directories might be signs of a malicious activity. Having such events audited helps in monitoring and investigation of such activities.

    <p><strong>中文理由：</strong></p>
    更改文件或目录所有权失败可能表明存在恶意活动。审计此类事件有助于监控和调查这些活动。

severity: medium

platforms:
    - ppc64le_arch

identifiers:
    cce@rhel9: CCE-85988-4
    cce@rhel10: CCE-86853-9

references:
    nist: AU-2(a)
    ospp: FAU_GEN.1.1.c
    srg: SRG-OS-000462-GPOS-00206,SRG-OS-000463-GPOS-00207,SRG-OS-000465-GPOS-00209,SRG-OS-000474-GPOS-00219,SRG-OS-000475-GPOS-00220,SRG-OS-000466-GPOS-00210,SRG-OS-000064-GPOS-00033

ocil_clause: 'the file does not exist or the content differs'

ocil: |-
    To verify that the <tt>Audit</tt> is correctly configured according to recommended rules, check the content of the file with the following command:
    <pre>cat /etc/audit/rules.d/30-ospp-v42-6-owner-change-failed.rules</pre>
    The output has to be exactly as follows:
    <pre>{{{ file_contents_audit_owner_change_failed|indent }}}    </pre>

template:
    name: audit_file_contents
    vars:
        filepath: /etc/audit/rules.d/30-ospp-v42-6-owner-change-failed.rules
        contents: |-
            {{{ file_contents_audit_owner_change_failed|indent(12) }}}
