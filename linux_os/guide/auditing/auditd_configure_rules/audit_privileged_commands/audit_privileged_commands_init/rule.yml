{{%- if 'sle' not in product %}}
  {{%- set path="/usr/sbin" %}}
{{%- else %}}
  {{%- set path="/sbin" %}}
{{%- endif %}}

documentation_complete: true

title: 'Ensure auditd Collects Information on the Use of Privileged Commands - init'

description: |-
    {{{ describe_arpc(path + "/init") }}}

    <p><strong>中文说明：</strong></p>
    <p>审计系统至少应收集所有用户和 root 对特权命令 <tt>{{{ path }}}/init</tt> 的执行情况。应根据 <tt>auditd</tt> 的配置，将包含该命令路径和 <tt>key=privileged</tt> 的审计规则添加到 <tt>/etc/audit/rules.d</tt> 下后缀为 <tt>.rules</tt> 的文件，或添加到 <tt>/etc/audit/audit.rules</tt>。</p>
    <p>该规则必须以 <tt>-F path=&lt;命令路径&gt;</tt> 匹配目标命令，并在适用产品上包含 <tt>-F perm=x</tt>；还必须包含当前产品配置的 <tt>-F auid&gt;=...</tt>、<tt>-F auid!=unset</tt> 和 <tt>-F key=privileged</tt>。在 Fedora 或 RHEL 10 上，应按 32 位系统设置 <tt>ARCH=b32</tt>，或在 64 位系统上分别定义 b32 和 b64 两条规则。</p>

rationale: |-
    Misuse of the init command may cause availability issues for the system.

    <p><strong>中文理由：</strong></p>
    <p>滥用 init 命令可能导致系统可用性问题。</p>

severity: medium

identifiers:
    cce@rhel9: CCE-85956-1
    cce@rhel10: CCE-88214-2

references:
    nist: AU-12(c)
    srg: SRG-OS-000477-GPOS-00222

{{{ ocil_fix_srg_privileged_command("init","{{{ path }}}/") }}}

template:
    name: audit_rules_privileged_commands
    vars:
        path: /usr/sbin/init
        path@sle12: /sbin/init
        path@sle15: /sbin/init
