documentation_complete: true

title: 'Ensure auditd Collects Information on the Use of Privileged Commands - fusermount'

description: |-
    {{{ describe_arpc("/usr/bin/fusermount") }}}

    <p><strong>中文说明：</strong></p>
    <p>审计系统至少应收集所有用户和 root 对特权命令 <tt>/usr/bin/fusermount</tt> 的执行情况。如果 <tt>auditd</tt> 使用 <tt>augenrules</tt>（默认），请将记录该命令路径并使用 <tt>key=privileged</tt> 的规则添加到 <tt>/etc/audit/rules.d</tt> 下后缀为 <tt>.rules</tt> 的文件；如果使用 <tt>auditctl</tt>，请将规则添加到 <tt>/etc/audit/audit.rules</tt>。</p>
    <p>该规则必须以 <tt>-F path=&lt;命令路径&gt;</tt> 匹配目标命令，并在适用产品上包含 <tt>-F perm=x</tt>；还必须包含当前产品配置的 <tt>-F auid&gt;=...</tt>、<tt>-F auid!=unset</tt> 和 <tt>-F key=privileged</tt>。在 Fedora 或 RHEL 10 上，应按 32 位系统设置 <tt>ARCH=b32</tt>，或在 64 位系统上分别定义 b32 和 b64 两条规则。</p>

rationale: |-
    Misuse of privileged functions, either intentionally or unintentionally by
    authorized users, or by unauthorized external entities that have compromised system accounts,
    is a serious and ongoing concern and can have significant adverse impacts on organizations.
    Auditing the use of privileged functions is one way to detect such misuse and identify
    the risk from insider and advanced persistent threats.
    <br /><br />
    Privileged programs are subject to escalation-of-privilege attacks,
    which attempt to subvert their normal role of providing some necessary but
    limited capability. As such, motivation exists to monitor these programs for
    unusual activity.

    <p><strong>中文理由：</strong></p>
    <p>无论是授权用户有意或无意滥用特权功能，还是已入侵系统账户的未授权外部实体滥用特权功能，都是严重且持续存在的风险，可能对组织造成重大不利影响。审计特权功能的使用是检测此类滥用并识别内部人员及高级持续性威胁风险的一种方法。<br /><br />特权程序容易受到权限提升攻击，此类攻击试图颠覆其提供某些必要但有限能力的正常职责。因此，有必要监控这些程序的异常活动。</p>

severity: medium

identifiers:
    cce@rhcos4: CCE-86210-2

references:
    srg: SRG-APP-000029-CTR-000085

{{{ ocil_fix_srg_privileged_command("fusermount") }}}

