documentation_complete: true


title: 'Ensure auditd Collects Information on the Use of Privileged Commands - chfn'

description: |-
    {{{ describe_arpc("/usr/bin/chfn") }}}

    <p><strong>中文说明：</strong></p>
    <p>审计系统至少应收集所有用户和 root 对特权命令 <tt>/usr/bin/chfn</tt> 的执行情况。如果 <tt>auditd</tt> 使用 <tt>augenrules</tt>（默认），请将记录该命令路径并使用 <tt>key=privileged</tt> 的规则添加到 <tt>/etc/audit/rules.d</tt> 下后缀为 <tt>.rules</tt> 的文件；如果使用 <tt>auditctl</tt>，请将规则添加到 <tt>/etc/audit/audit.rules</tt>。</p>
    <p>该规则必须以 <tt>-F path=&lt;命令路径&gt;</tt> 匹配目标命令，并在适用产品上包含 <tt>-F perm=x</tt>；还必须包含当前产品配置的 <tt>-F auid&gt;=...</tt>、<tt>-F auid!=unset</tt> 和 <tt>-F key=privileged</tt>。在 Fedora 或 RHEL 10 上，应按 32 位系统设置 <tt>ARCH=b32</tt>，或在 64 位系统上分别定义 b32 和 b64 两条规则。</p>

rationale: |-
    Without generating audit records that are specific to the security and
    mission needs of the organization, it would be difficult to establish,
    correlate, and investigate the events relating to an incident or identify
    those responsible for one.

    Audit records can be generated from various components within the
    information system (e.g., module or policy filter).

    <p><strong>中文理由：</strong></p>
    <p>如果未生成符合组织安全和任务需求的审计记录，将难以确定、关联和调查与事件相关的情况，或识别事件责任人。审计记录可由信息系统内的各种组件生成（例如模块或策略过滤器）。</p>

severity: medium

identifiers:
    cce@sle12: CCE-83187-5
    cce@sle15: CCE-85589-0
    cce@slmicro5: CCE-93610-4
    cce@slmicro6: CCE-94614-5

references:
    nist: AU-3,AU-12(a),AU-12(c),MA-4(1)(a)
    stigid@sle12: SLES-12-020280

ocil_clause: '{{{ ocil_clause_audit() }}}'

ocil: |-
    To verify that auditing of privileged command use is configured, run the
    following command:
    <pre>$ sudo grep chfn /etc/audit/audit.rules /etc/audit/rules.d/*</pre>
    It should return a relevant line in the audit rules.

template:
    name: audit_rules_privileged_commands
    vars:
        path: /usr/bin/chfn
