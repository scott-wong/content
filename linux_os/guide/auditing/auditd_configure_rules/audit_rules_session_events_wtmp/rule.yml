documentation_complete: true


title: 'Record Attempts to Alter Process and Session Initiation Information wtmp'

description: |-
    The audit system already collects process information for all
    users and root.
    {{{ describe_audit_rules_watch("/var/log/wtmp", "session") }}}

    <p><strong>中文说明：</strong></p>
    <p>审计系统已为所有用户和 root 收集进程信息。
    如果 <tt>auditd</tt> 守护进程配置为在启动时使用 <tt>augenrules</tt> 程序读取审计规则（默认设置），请将监视 <tt>/var/log/wtmp</tt> 且审计键为 <tt>session</tt> 的规则添加到 <tt>/etc/audit/rules.d</tt> 目录中后缀为 <tt>.rules</tt> 的文件。如果 <tt>auditd</tt> 守护进程配置为在启动时使用 <tt>auditctl</tt> 工具读取审计规则，请将相应规则添加到 <tt>/etc/audit/audit.rules</tt> 文件。</p>
    <p>该审计规则必须记录对目标路径的写入和属性变更事件；传统规则语法使用 <tt>-p wa</tt>，现代规则语法使用 <tt>-F perm=wa</tt>，并使用对应的审计键。</p>

rationale: |-
    Manual editing of these files may indicate nefarious activity, such
    as an attacker attempting to remove evidence of an intrusion.

    <p><strong>中文理由：</strong></p>
    <p>手动编辑这些文件可能表明恶意活动，例如攻击者试图删除入侵证据。</p>

severity: medium

identifiers:
    cce@rhel8: CCE-86204-5
    cce@rhel9: CCE-86203-7
    cce@rhel10: CCE-86206-0
    cce@sle15: CCE-85757-3
    cce@sle16: CCE-95764-7
    cce@slmicro5: CCE-93724-3
    cce@slmicro6: CCE-94733-3

references:
    hipaa: 164.308(a)(1)(ii)(D),164.308(a)(3)(ii)(A),164.308(a)(5)(ii)(C),164.312(a)(2)(i),164.312(b),164.312(d),164.312(e)
    nist: AU-12(c),AU-12.1(iv)
    srg: SRG-OS-000472-GPOS-00217

ocil_clause: 'Audit rule is not present'

ocil: |-
    {{{ ocil_audit_rules_watch("/var/log/wtmp", "session") }}}

template:
    name: audit_rules_watch
    vars:
        path: /var/log/wtmp
        key: session

