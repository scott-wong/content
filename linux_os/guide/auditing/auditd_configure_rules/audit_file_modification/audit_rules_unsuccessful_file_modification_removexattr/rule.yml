documentation_complete: true


title: 'Record Unsuccessful Permission Changes to Files - removexattr'

description: |-
    The audit system should collect unsuccessful file permission change
    attempts for all users and root.
    If the <tt>auditd</tt> daemon is configured
    to use the <tt>augenrules</tt> program to read audit rules during daemon
    startup (the default), add the following lines to a file with suffix
    <tt>.rules</tt> in the directory <tt>/etc/audit/rules.d</tt>.
    If the <tt>auditd</tt> daemon is configured to use the <tt>auditctl</tt>
    utility to read audit rules during daemon startup, add the following lines to
    <tt>/etc/audit/audit.rules</tt> file.
    <pre>-a always,exit -F arch=b32 -S removexattr -F exit=-EACCES -F auid>={{{ auid }}} -F auid!=unset -F key=unsuccesful-perm-change
    -a always,exit -F arch=b32 -S removexattr -F exit=-EPERM -F auid>={{{ auid }}} -F auid!=unset -F key=unsuccesful-perm-change</pre>
    If the system is 64 bit then also add the following lines:
    <pre>-a always,exit -F arch=b64 -S removexattr -F exit=-EACCES -F auid>={{{ auid }}} -F auid!=unset -F key=unsuccesful-perm-change
    -a always,exit -F arch=b64 -S removexattr -F exit=-EPERM -F auid>={{{ auid }}} -F auid!=unset -F key=unsuccesful-perm-change</pre>

    <p><strong>中文说明：</strong></p>
    <p>审计系统应收集所有用户和 root 的未成功文件权限更改尝试。如果 <tt>auditd</tt> 守护进程配置为在守护进程启动时使用 <tt>augenrules</tt> 程序读取审计规则（默认配置），请将以下行添加到 <tt>/etc/audit/rules.d</tt> 目录中后缀为 <tt>.rules</tt> 的文件。如果 <tt>auditd</tt> 守护进程配置为在守护进程启动时使用 <tt>auditctl</tt> 实用程序读取审计规则，请将以下行添加到 <tt>/etc/audit/audit.rules</tt> 文件。</p>
    <pre>-a always,exit -F arch=b32 -S removexattr -F exit=-EACCES -F auid>={{{ auid }}} -F auid!=unset -F key=unsuccesful-perm-change
    -a always,exit -F arch=b32 -S removexattr -F exit=-EPERM -F auid>={{{ auid }}} -F auid!=unset -F key=unsuccesful-perm-change</pre>
    如果系统为 64 位，则还应添加以下行：
    <pre>-a always,exit -F arch=b64 -S removexattr -F exit=-EACCES -F auid>={{{ auid }}} -F auid!=unset -F key=unsuccesful-perm-change
    -a always,exit -F arch=b64 -S removexattr -F exit=-EPERM -F auid>={{{ auid }}} -F auid!=unset -F key=unsuccesful-perm-change</pre>


rationale: |-
    Unsuccessful attempts to change permissions of files could be an indicator of malicious activity on a system. Auditing
    these events could serve as evidence of potential system compromise.

    <p><strong>中文理由：</strong></p>
    <p>未成功更改文件权限的尝试可能表明系统存在恶意活动。审计这些事件可作为系统可能遭到入侵的证据。</p>

severity: medium

identifiers:
    cce@rhcos4: CCE-82647-9
    cce@rhel8: CCE-80982-2

references:
    nist: AU-2(d),AU-12(c),CM-6(a)

{{{ complete_ocil_entry_audit_unsuccessful_syscall(syscall="removexattr") }}}

warnings:
    - general: |-
        Note that these rules can be configured in a
        number of ways while still achieving the desired effect. Here the audit rule checks a
        system call independently of other system calls. Grouping system calls related
        to the same event is more efficient. See the following example:
        <pre>-a always,exit -F arch=b32 -S chmod,fchmod,fchmodat,setxattr,lsetxattr,fsetxattr -F exit=-EACCES -F auid>={{{ auid }}} -F auid!=unset -F key=unsuccesful-perm-change</pre>

