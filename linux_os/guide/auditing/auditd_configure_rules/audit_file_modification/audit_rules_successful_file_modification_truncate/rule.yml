documentation_complete: true


title: 'Record Successful Access Attempts to Files - truncate'

description: |-
    At a minimum, the audit system should collect unauthorized file
    accesses for all users and root. If the <tt>auditd</tt> daemon is configured
    to use the <tt>augenrules</tt> program to read audit rules during daemon
    startup (the default), add the following lines to a file with suffix
    <tt>.rules</tt> in the directory <tt>/etc/audit/rules.d</tt>:

    <pre>-a always,exit -F arch=b32 -S truncate -F success=1 -F auid&gt;={{{ auid }}} -F auid!=unset -F key=successful-access</pre>

    If the system is 64 bit then also add the following lines:
    <pre>-a always,exit -F arch=b64 -S truncate -F success=1 -F auid&gt;={{{ auid }}} -F auid!=unset -F key=successful-access</pre>

    If the <tt>auditd</tt> daemon is configured to use the <tt>auditctl</tt>
    utility to read audit rules during daemon startup, add the following lines to
    <tt>/etc/audit/audit.rules</tt> file:
    <pre>-a always,exit -F arch=b32 -S truncate -F success=1 -F auid&gt;={{{ auid }}} -F auid!=unset -F key=successful-access</pre>

    If the system is 64 bit then also add the following lines:
    <pre>-a always,exit -F arch=b64 -S truncate -F success=1 -F auid&gt;={{{ auid }}} -F auid!=unset -F key=successful-access</pre>

    <p><strong>中文说明：</strong></p>
    审计系统至少应为所有用户和 root 收集未授权的文件访问。如果 <tt>auditd</tt> 守护进程配置为在启动时使用 <tt>augenrules</tt> 程序读取审计规则（默认设置），请将以下行添加到 <tt>/etc/audit/rules.d</tt> 目录中后缀为 <tt>.rules</tt> 的文件：

    <pre>-a always,exit -F arch=b32 -S truncate -F success=1 -F auid&gt;={{{ auid }}} -F auid!=unset -F key=successful-access</pre>

    如果系统为 64 位，则还应添加以下行：
    <pre>-a always,exit -F arch=b64 -S truncate -F success=1 -F auid&gt;={{{ auid }}} -F auid!=unset -F key=successful-access</pre>

    如果 <tt>auditd</tt> 守护进程配置为在启动时使用 <tt>auditctl</tt> 工具读取审计规则，请将以下行添加到 <tt>/etc/audit/audit.rules</tt> 文件：
    <pre>-a always,exit -F arch=b32 -S truncate -F success=1 -F auid&gt;={{{ auid }}} -F auid!=unset -F key=successful-access</pre>

    如果系统为 64 位，则还应添加以下行：
    <pre>-a always,exit -F arch=b64 -S truncate -F success=1 -F auid&gt;={{{ auid }}} -F auid!=unset -F key=successful-access</pre>

rationale: |-
    File access attempts could be an indicator of malicious activity on a system. Auditing
    these events could serve as evidence of potential system compromise.

    <p><strong>中文理由：</strong></p>
    文件访问尝试可能是系统上恶意活动的迹象。审计这些事件可作为系统可能遭到入侵的证据。

severity: medium

identifiers:
    cce@rhel8: CCE-82002-7

{{{ complete_ocil_entry_audit_successful_syscall(syscall="truncate") }}}

warnings:
    - general: |-
        Note that these rules can be configured in a
        number of ways while still achieving the desired effect. Here the system calls
        have been placed independent of other system calls. Grouping these system
        calls with others as identifying earlier in this guide is more efficient.

