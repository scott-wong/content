documentation_complete: true


title: 'Record Successful Ownership Changes to Files - fchown'

description: |-
    At a minimum, the audit system should collect file ownership changes
    for all users and root. If the <tt>auditd</tt> daemon is configured
    to use the <tt>augenrules</tt> program to read audit rules during daemon
    startup (the default), add the following lines to a file with suffix
    <tt>.rules</tt> in the directory <tt>/etc/audit/rules.d</tt>:

    <pre>-a always,exit -F arch=b32 -S fchown -F success=1 -F auid&gt;={{{ auid }}} -F auid!=unset -F key=successful-perm-change</pre>

    If the system is 64 bit then also add the following lines:
    <pre>-a always,exit -F arch=b64 -S fchown -F success=1 -F auid&gt;={{{ auid }}} -F auid!=unset -F key=successful-perm-change</pre>

    If the <tt>auditd</tt> daemon is configured to use the <tt>auditctl</tt>
    utility to read audit rules during daemon startup, add the following lines to
    <tt>/etc/audit/audit.rules</tt> file:
    <pre>-a always,exit -F arch=b32 -S fchown -F success=1 -F auid&gt;={{{ auid }}} -F auid!=unset -F key=successful-perm-change</pre>

    If the system is 64 bit then also add the following lines:
    <pre>-a always,exit -F arch=b64 -S fchown -F success=1 -F auid&gt;={{{ auid }}} -F auid!=unset -F key=successful-perm-change</pre>

    <p><strong>中文说明：</strong></p>
    最低限度，审计系统应收集所有用户和 root 的文件所有权更改。如果 <tt>auditd</tt> 守护进程配置为在守护进程启动时使用 <tt>augenrules</tt> 程序读取审计规则（默认情况），请将以下行添加到 <tt>/etc/audit/rules.d</tt> 目录中后缀为 <tt>.rules</tt> 的文件：

    <pre>-a always,exit -F arch=b32 -S fchown -F success=1 -F auid&gt;={{{ auid }}} -F auid!=unset -F key=successful-perm-change</pre>

    如果系统为 64 位，则还应添加以下行：
    <pre>-a always,exit -F arch=b64 -S fchown -F success=1 -F auid&gt;={{{ auid }}} -F auid!=unset -F key=successful-perm-change</pre>

    如果 <tt>auditd</tt> 守护进程配置为在守护进程启动时使用 <tt>auditctl</tt> 工具读取审计规则，请将以下行添加到 <tt>/etc/audit/audit.rules</tt> 文件：
    <pre>-a always,exit -F arch=b32 -S fchown -F success=1 -F auid&gt;={{{ auid }}} -F auid!=unset -F key=successful-perm-change</pre>

    如果系统为 64 位，则还应添加以下行：
    <pre>-a always,exit -F arch=b64 -S fchown -F success=1 -F auid&gt;={{{ auid }}} -F auid!=unset -F key=successful-perm-change</pre>

rationale: |-
    File ownership attempts could be an indicator of malicious activity on a system. Auditing
    these events could serve as evidence of potential system compromise.

    <p><strong>中文理由：</strong></p>
    文件所有权变更尝试可能是系统上恶意活动的迹象。审计这些事件可作为潜在系统失陷的证据。

severity: medium

identifiers:
    cce@rhel8: CCE-82128-0

{{{ complete_ocil_entry_audit_successful_syscall(syscall="fchown") }}}

warnings:
    - general: |-
        Note that these rules can be configured in a
        number of ways while still achieving the desired effect. Here the system calls
        have been placed independent of other system calls. Grouping these system
        calls with others as identifying earlier in this guide is more efficient.

