documentation_complete: true


title: 'Ensure auditd Collects System Administrator Actions - /etc/sudoers.d/'

description: |-
    At a minimum, the audit system should collect administrator actions
    for all users and root.
    {{{ describe_audit_rules_watch("/etc/sudoers.d/", "actions") }}}

    <p><strong>中文说明：</strong></p>
    <p>审计系统至少应为所有用户和 root 收集管理员操作。
    如果 <tt>auditd</tt> 守护进程配置为在启动时使用 <tt>augenrules</tt> 程序读取审计规则（默认设置），请将监视 <tt>/etc/sudoers.d/</tt> 且审计键为 <tt>actions</tt> 的规则添加到 <tt>/etc/audit/rules.d</tt> 目录中后缀为 <tt>.rules</tt> 的文件。如果 <tt>auditd</tt> 守护进程配置为在启动时使用 <tt>auditctl</tt> 工具读取审计规则，请将相应规则添加到 <tt>/etc/audit/audit.rules</tt> 文件。</p>
    <p>该审计规则必须记录对目标路径的写入和属性变更事件；传统规则语法使用 <tt>-p wa</tt>，现代规则语法使用 <tt>-F perm=wa</tt>，并使用对应的审计键。</p>

rationale: |-
    The actions taken by system administrators should be audited to keep a record
    of what was executed on the system, as well as, for accountability purposes.
    Editing the sudoers file may be sign of an attacker trying to
    establish persistent methods to a system, auditing the editing of the sudoers
    files mitigates this risk.

    <p><strong>中文理由：</strong></p>
    <p>应审计系统管理员执行的操作，以记录系统上执行的内容并满足问责要求。编辑 sudoers 文件可能是攻击者试图建立持久访问方法的迹象，审计对 sudoers 文件的编辑可降低此风险。</p>

severity: medium

