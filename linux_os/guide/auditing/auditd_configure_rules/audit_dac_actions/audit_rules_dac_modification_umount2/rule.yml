documentation_complete: true

title: 'Record Events that Modify the System''s Discretionary Access Controls - umount2'

description: |-
    At a minimum, the audit system should collect file system umount2
    changes. If the <tt>auditd</tt> daemon is configured
    to use the <tt>augenrules</tt> program to read audit rules during daemon
    startup (the default), add the following line to a file with suffix
    <tt>.rules</tt> in the directory <tt>/etc/audit/rules.d</tt>:
    <pre>-a always,exit -F arch=b32 -S umount2 -F auid&gt;={{{ auid }}} -F auid!=unset -F key=perm_mod</pre>
    If the system is 64 bit then also add the following line:
    <pre>-a always,exit -F arch=b64 -S umount2 -F auid&gt;={{{ auid }}} -F auid!=unset -F key=perm_mod</pre>
    If the <tt>auditd</tt> daemon is configured to use the <tt>auditctl</tt>
    utility to read audit rules during daemon startup, add the following line to
    <tt>/etc/audit/audit.rules</tt> file:
    <pre>-a always,exit -F arch=b32 -S umount2 -F auid&gt;={{{ auid }}} -F auid!=unset -F key=perm_mod</pre>
    If the system is 64 bit then also add the following line:
    <pre>-a always,exit -F arch=b64 -S umount2 -F auid&gt;={{{ auid }}} -F auid!=unset -F key=perm_mod</pre>

    <p><strong>中文说明：</strong></p>
    最低限度，审计系统应收集文件系统 umount2 更改。如果 <tt>auditd</tt> 守护进程配置为在守护进程启动时使用 <tt>augenrules</tt> 程序读取审计规则（默认情况），请将以下行添加到 <tt>/etc/audit/rules.d</tt> 目录中后缀为 <tt>.rules</tt> 的文件：
    <pre>-a always,exit -F arch=b32 -S umount2 -F auid&gt;={{{ auid }}} -F auid!=unset -F key=perm_mod</pre>
    如果系统为 64 位，则还应添加以下行：
    <pre>-a always,exit -F arch=b64 -S umount2 -F auid&gt;={{{ auid }}} -F auid!=unset -F key=perm_mod</pre>
    如果 <tt>auditd</tt> 守护进程配置为在守护进程启动时使用 <tt>auditctl</tt> 工具读取审计规则，请将以下行添加到 <tt>/etc/audit/audit.rules</tt> 文件：
    <pre>-a always,exit -F arch=b32 -S umount2 -F auid&gt;={{{ auid }}} -F auid!=unset -F key=perm_mod</pre>
    如果系统为 64 位，则还应添加以下行：
    <pre>-a always,exit -F arch=b64 -S umount2 -F auid&gt;={{{ auid }}} -F auid!=unset -F key=perm_mod</pre>

rationale: |-
    The changing of file permissions could indicate that a user is attempting to
    gain access to information that would otherwise be disallowed. Auditing DAC modifications
    can facilitate the identification of patterns of abuse among both authorized and
    unauthorized users.

    <p><strong>中文理由：</strong></p>
    文件权限的更改可能表明用户正试图获取原本不允许访问的信息。审计 DAC（自主访问控制）修改有助于识别授权用户和未授权用户的滥用模式。

