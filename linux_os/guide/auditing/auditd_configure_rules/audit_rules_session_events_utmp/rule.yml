documentation_complete: true


title: 'Record Attempts to Alter Process and Session Initiation Information utmp'

description: |-
    The audit system already collects process information for all
    users and root.
    {{{ describe_audit_rules_watch("/var/run/utmp", "session") }}}

    <p><strong>中文说明：</strong></p>
    审计系统已为所有用户和 root 收集进程信息。
    如果 <tt>auditd</tt> 守护进程配置为在启动时使用 <tt>augenrules</tt> 程序读取审计规则（默认设置），请将监视 <tt>/var/run/utmp</tt> 且审计键为 <tt>session</tt> 的规则添加到 <tt>/etc/audit/rules.d</tt> 目录中后缀为 <tt>.rules</tt> 的文件。如果 <tt>auditd</tt> 守护进程配置为在启动时使用 <tt>auditctl</tt> 工具读取审计规则，请将相应规则添加到 <tt>/etc/audit/audit.rules</tt> 文件。

rationale: |-
    Manual editing of these files may indicate nefarious activity, such
    as an attacker attempting to remove evidence of an intrusion.

    <p><strong>中文理由：</strong></p>
    手动编辑这些文件可能表明恶意活动，例如攻击者试图删除入侵证据。

severity: medium

identifiers:
    cce@rhel8: CCE-86199-7
    cce@rhel9: CCE-86202-9
    cce@rhel10: CCE-86193-0
    cce@sle15: CCE-85714-4
    cce@sle16: CCE-96144-1
    cce@slmicro5: CCE-93723-5
    cce@slmicro6: CCE-94732-5

references:
    hipaa: 164.308(a)(1)(ii)(D),164.308(a)(3)(ii)(A),164.308(a)(5)(ii)(C),164.312(a)(2)(i),164.312(b),164.312(d),164.312(e)
    nist: AU-12(c),AU-12.1(iv)
    srg: SRG-OS-000472-GPOS-00217

ocil_clause: 'Audit rule is not present'

ocil: |-
    {{{ ocil_audit_rules_watch("/var/run/utmp", "session") }}}

template:
    name: audit_rules_watch
    vars:
        path: /var/run/utmp
        key: session
