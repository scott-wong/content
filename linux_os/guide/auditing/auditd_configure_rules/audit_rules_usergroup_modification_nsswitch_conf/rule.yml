documentation_complete: true

title: 'Record Events that Modify User/Group Information - /etc/nsswitch.conf'

description: |-
    {{{ describe_audit_rules_watch("/etc/nsswitch.conf", "audit_rules_usergroup_modification") }}}

    <p><strong>中文说明：</strong></p>
    <p>如果 <tt>auditd</tt> 守护进程配置为在启动时使用 <tt>augenrules</tt> 程序读取审计规则（默认设置），请将监视 <tt>/etc/nsswitch.conf</tt> 且审计键为 <tt>audit_rules_usergroup_modification</tt> 的规则添加到 <tt>/etc/audit/rules.d</tt> 目录中后缀为 <tt>.rules</tt> 的文件。如果 <tt>auditd</tt> 守护进程配置为在启动时使用 <tt>auditctl</tt> 工具读取审计规则，请将相应规则添加到 <tt>/etc/audit/audit.rules</tt> 文件。</p>
    <p>该审计规则必须记录对目标路径的写入和属性变更事件；传统规则语法使用 <tt>-p wa</tt>，现代规则语法使用 <tt>-F perm=wa</tt>，并使用对应的审计键。</p>

rationale: |-
    The nsswitch file defines how the system uses various databases and name
    resolution mechanisms. Any unexpected changes to nsswitch configuration
    should be investigated.

    <p><strong>中文理由：</strong></p>
    <p>nsswitch 文件定义系统如何使用各种数据库和名称解析机制。应调查对 nsswitch 配置的任何意外更改。</p>

severity: medium

identifiers:
    cce@rhel8: CCE-87835-5
    cce@rhel9: CCE-86213-6
    cce@rhel10: CCE-90524-0

ocil: |-
    {{{ ocil_audit_rules_watch("/etc/group", "audit_rules_usergroup_modification") }}}

fixtext: '{{{ fixtext_audit_file_watch_rule("/etc/nsswitch.conf", "audit_rules_usergroup_modification", "/etc/audit/rules.d/audit.rules") }}}'

template:
    name: audit_rules_watch
    vars:
        path: /etc/nsswitch.conf
        key: audit_rules_usergroup_modification
