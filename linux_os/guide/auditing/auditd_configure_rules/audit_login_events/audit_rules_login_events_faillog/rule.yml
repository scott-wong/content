documentation_complete: true


title: 'Record Attempts to Alter Logon and Logout Events - faillog'

description: |-
    The audit system already collects login information for all users
    and root.
    {{{ describe_audit_rules_watch("/var/log/faillog", "logins") }}}

    <p><strong>中文说明：</strong></p>
    <p>审计系统已经收集所有用户和 root 的登录信息。应使用键 <tt>logins</tt> 监控 <tt>/var/log/faillog</tt> 的写入和属性更改。如果 <tt>auditd</tt> 使用 <tt>augenrules</tt>（默认），请将相应规则添加到 <tt>/etc/audit/rules.d</tt> 下后缀为 <tt>.rules</tt> 的文件；如果使用 <tt>auditctl</tt>，请将规则添加到 <tt>/etc/audit/audit.rules</tt>。</p>

rationale: |-
    Manual editing of these files may indicate nefarious activity, such
    as an attacker attempting to remove evidence of an intrusion.

    <p><strong>中文理由：</strong></p>
    <p>手动编辑这些文件可能表明存在恶意活动，例如攻击者试图删除入侵证据。</p>

severity: medium

identifiers:
    cce@rhcos4: CCE-90416-9
    cce@sle12: CCE-83192-5
    cce@sle15: CCE-92576-8
    cce@slmicro5: CCE-93841-5

references:
    cis@sle12: 4.1.7
    cis@sle15: 4.1.7
    nist@sle12: AU-3,AU-12(a),AU-12(c),MA-4(1)(a)
    srg: SRG-OS-000037-GPOS-00015
    stigid@sle12: SLES-12-020760

ocil_clause: 'there is no output'

ocil: |-
    {{{ ocil_audit_rules_watch("/var/log/faillog", "logins") }}}

template:
    name: audit_rules_watch
    vars:
        path: /var/log/faillog
        key: logins
