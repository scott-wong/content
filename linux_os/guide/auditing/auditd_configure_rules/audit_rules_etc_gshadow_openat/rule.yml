documentation_complete: true


title: 'Record Events that Modify User/Group Information via openat syscall - /etc/gshadow'

description: |-
    The audit system should collect write events to /etc/gshadow file for all users and root.
    If the <tt>auditd</tt> daemon is configured
    to use the <tt>augenrules</tt> program to read audit rules during daemon
    startup (the default), add the following lines to a file with suffix
    <tt>.rules</tt> in the directory <tt>/etc/audit/rules.d</tt>:
    <pre>-a always,exit -F arch=b32 -S openat -F a2&amp;03 -F path=/etc/gshadow -F auid>={{{ auid }}} -F auid!=unset -F key=user-modify</pre>
    If the <tt>auditd</tt> daemon is configured to use the <tt>auditctl</tt>
    utility to read audit rules during daemon startup, add the following lines to
    <tt>/etc/audit/audit.rules</tt> file:
    <pre>-a always,exit -F arch=b32 -S openat -F a2&amp;03 -F path=/etc/gshadow -F auid>={{{ auid }}} -F auid!=unset -F key=user-modify</pre>
    If the system is 64 bit then also add the following line:
    <pre>-a always,exit -F arch=b64 -S openat -F a2&amp;03 -F path=/etc/gshadow -F auid>={{{ auid }}} -F auid!=unset -F key=user-modify</pre>

    <p><strong>中文说明：</strong></p>
    <p>审计系统应收集所有用户和 root 对 <tt>/etc/gshadow</tt> 文件的写入事件。
    如果 <tt>auditd</tt> 守护进程配置为在守护进程启动时使用 <tt>augenrules</tt> 程序读取审计规则（默认情况），请将以下行添加到 <tt>/etc/audit/rules.d</tt> 目录中后缀为 <tt>.rules</tt> 的文件：</p>
    <pre>-a always,exit -F arch=b32 -S openat -F a2&amp;03 -F path=/etc/gshadow -F auid>={{{ auid }}} -F auid!=unset -F key=user-modify</pre>
    如果 <tt>auditd</tt> 守护进程配置为在守护进程启动时使用 <tt>auditctl</tt> 工具读取审计规则，请将以下行添加到 <tt>/etc/audit/audit.rules</tt> 文件：
    <pre>-a always,exit -F arch=b32 -S openat -F a2&amp;03 -F path=/etc/gshadow -F auid>={{{ auid }}} -F auid!=unset -F key=user-modify</pre>
    如果系统为 64 位，则还应添加以下行：
    <pre>-a always,exit -F arch=b64 -S openat -F a2&amp;03 -F path=/etc/gshadow -F auid>={{{ auid }}} -F auid!=unset -F key=user-modify</pre>

rationale: |-
    Creation of users through direct edition of /etc/gshadow could be an indicator of malicious activity on a system.
    Auditing these events could serve as evidence of potential system compromise.

    <p><strong>中文理由：</strong></p>
    <p>通过直接编辑 <tt>/etc/gshadow</tt> 创建用户可能是系统上恶意活动的迹象。审计这些事件可作为潜在系统失陷的证据。</p>

severity: medium

identifiers:
    cce@rhcos4: CCE-82704-8
    cce@rhel8: CCE-80961-6
    cce@rhel10: CCE-87535-1

references:
    nerc-cip: CIP-004-6 R2.2.2,CIP-004-6 R2.2.3,CIP-007-3 R.1.3,CIP-007-3 R5,CIP-007-3 R5.1.1,CIP-007-3 R5.1.3,CIP-007-3 R5.2.1,CIP-007-3 R5.2.3
    nist: AC-2(4),AU-2(d),AU-12(c),AC-6(9),CM-6(a)

{{{ complete_ocil_entry_audit_syscall(syscall="openat") }}}

warnings:
    - general: |-
        Note that these rules can be configured in a
        number of ways while still achieving the desired effect. Here the system calls
        have been placed independent of other system calls. Grouping system calls related
        to the same event is more efficient. See the following example:
        <pre>-a always,exit -F arch=b32 -S openat,open_by_handle_at -F a2&amp;03 -F path=/etc/gshadow -F auid>={{{ auid }}} -F auid!=unset -F key=user-modify</pre>

template:
    name: audit_rules_path_syscall
    vars:
        path: /etc/gshadow
        pos: a2
        syscall: openat
