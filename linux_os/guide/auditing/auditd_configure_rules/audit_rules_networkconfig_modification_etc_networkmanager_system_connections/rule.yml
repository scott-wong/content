documentation_complete: true

title: 'Record Events that Modify the System''s Network Environment - /etc/NetworkManager/system-connections/'

description: |-
    {{{ describe_audit_rules_watch("/etc/NetworkManager/system-connections/", "system-locale") }}}

    <p><strong>中文说明：</strong></p>
    <p>如果 <tt>auditd</tt> 守护进程配置为在守护进程启动时使用 <tt>augenrules</tt> 程序读取审计规则（默认情况），请根据构建配置中的 <tt>audit_watches_style</tt> 将以下任一种形式的规则添加到 <tt>/etc/audit/rules.d</tt> 目录中后缀为 <tt>.rules</tt> 的文件：

    现代形式：
    <tt>-a always,exit -F arch=b32 -F dir=/etc/NetworkManager/system-connections/ -F perm=wa -F key=system-locale</tt>
    <tt>-a always,exit -F arch=b64 -F dir=/etc/NetworkManager/system-connections/ -F perm=wa -F key=system-locale</tt>

    传统形式：
    <tt>-w /etc/NetworkManager/system-connections/ -p wa -k system-locale</tt>

    如果 <tt>auditd</tt> 守护进程配置为在守护进程启动时使用 <tt>auditctl</tt> 工具读取审计规则，请将同样的规则添加到 <tt>/etc/audit/audit.rules</tt> 文件。</p>
    <p>该审计规则必须记录对目标路径的写入和属性变更事件；传统规则语法使用 <tt>-p wa</tt>，现代规则语法使用 <tt>-F perm=wa</tt>，并使用对应的审计键。</p>

rationale: |-
    The network environment should not be modified by anything other
    than administrator action. Any change to network parameters should be
    audited.

    <p><strong>中文理由：</strong></p>
    <p>网络环境不应由管理员操作以外的任何内容修改。网络参数的任何更改都应被审计。</p>

severity: medium

identifiers:
    cce@rhel10: CCE-89923-7

ocil_clause: 'the system is not configured to audit changes of the network configuration'

ocil: |-
    To determine if the system is configured to audit changes to its network configuration,
    run the following command:
    <pre>auditctl -l | grep -E '/etc/NetworkManager/system-connections/'</pre>
    If the system is configured to watch for network configuration changes, a line should
    be returned and <tt>perm=wa</tt> should be indicated.

template:
    name: audit_rules_watch
    vars:
        path: /etc/NetworkManager/system-connections/
        key: system-locale
