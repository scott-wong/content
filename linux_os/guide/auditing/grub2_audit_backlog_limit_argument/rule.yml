documentation_complete: true


title: 'Extend Audit Backlog Limit for the Audit Daemon'

description: |-
    To improve the kernel capacity to queue all log events, even those which occurred
    prior to the audit daemon, add the argument <tt>audit_backlog_limit={{{ xccdf_value("var_audit_backlog_limit") }}}</tt> to the default
    GRUB 2 command line for the Linux operating system.
    {{{ describe_grub2_argument("audit_backlog_limit=" ~ xccdf_value("var_audit_backlog_limit")) | indent(4) }}}

    <p><strong>中文说明：</strong></p>
    为提高内核排队所有日志事件（包括在审计守护进程之前发生的事件）的能力，请将参数 <tt>audit_backlog_limit={{{ xccdf_value("var_audit_backlog_limit") }}}</tt> 添加到 Linux 操作系统的默认 GRUB 2 命令行。可通过编辑 <tt>/etc/default/grub</tt> 中的 <tt>GRUB_CMDLINE_LINUX</tt> 行或使用引导加载程序配置工具添加该参数，然后更新已安装内核的引导配置。

rationale: |-
    audit_backlog_limit sets the queue length for audit events awaiting transfer
    to the audit daemon. Until the audit daemon is up and running, all log messages
    are stored in this queue.  If the queue is overrun during boot process, the action
    defined by audit failure flag is taken.

    <p><strong>中文理由：</strong></p>
    audit_backlog_limit 设置等待传输到审计守护进程的审计事件的队列长度。在审计守护进程启动并运行之前，所有日志消息都存储在此队列中。如果队列在引导过程中溢出，将采取由审计失败标志定义的操作。

