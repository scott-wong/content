documentation_complete: true

title: 'Configure auditd max_log_file_action Upon Reaching Maximum Log Size'

description: |-
    The default action to take when the logs reach their maximum size
    is to rotate the log files, discarding the oldest one. To configure the action taken
    by <tt>auditd</tt>, add or correct the line in <tt>/etc/audit/auditd.conf</tt>:
    <pre>max_log_file_action = <i>ACTION</i></pre>
    Possible values for <i>ACTION</i> are described in the <tt>auditd.conf</tt> man
    page. These include:
    <ul>
    <li><tt>ignore</tt></li>
    <li><tt>syslog</tt></li>
    <li><tt>suspend</tt></li>
    <li><tt>rotate</tt></li>
    <li><tt>keep_logs</tt></li>
    </ul>
    Set the <tt><i>ACTION</i></tt> to <tt>{{{ xccdf_value("var_auditd_max_log_file_action") }}}</tt>.
    The setting is case-insensitive.

    <p><strong>中文说明：</strong></p>
    <p>日志达到最大大小时默认采取的操作是轮转日志文件并丢弃最旧的日志。要配置 <tt>auditd</tt> 采取的操作，请在 <tt>/etc/audit/auditd.conf</tt> 中添加或更正以下行：</p>
    <pre>max_log_file_action = <i>ACTION</i></pre>
    <i>ACTION</i> 的可能值在 <tt>auditd.conf</tt> 手册页中说明，包括：
    <ul>
    <li><tt>ignore</tt></li>
    <li><tt>syslog</tt></li>
    <li><tt>suspend</tt></li>
    <li><tt>rotate</tt></li>
    <li><tt>keep_logs</tt></li>
    </ul>
    将 <tt><i>ACTION</i></tt> 设为 <tt>{{{ xccdf_value("var_auditd_max_log_file_action") }}}</tt>。此设置不区分大小写。

rationale: |-
    Automatically rotating logs (by setting this to <tt>rotate</tt>)
    minimizes the chances of the system unexpectedly running out of disk space by
    being overwhelmed with log data. However, for systems that must never discard
    log data, or which use external processes to transfer it and reclaim space,
    <tt>keep_logs</tt> can be employed.

    <p><strong>中文理由：</strong></p>
    <p>自动轮转日志（将其设置为 <tt>rotate</tt>）可最大限度降低系统因日志数据过多而意外耗尽磁盘空间的可能性。但是，对于绝不能丢弃日志数据或使用外部进程传输日志并回收空间的系统，可以使用 <tt>keep_logs</tt>。</p>

