documentation_complete: true


title: Ensure that the bindAddress is set to a relevant secure port

{{% set default_jqfilter = '.data."config.yaml" | fromjson' %}}
{{% set default_api_path = '/api/v1/namespaces/openshift-kube-apiserver/configmaps/config' %}}
{{% set hypershift_path = '/api/v1/namespaces/{{.hypershift_namespace_prefix}}-{{.hypershift_cluster}}/configmaps/kas-config' %}}
{{% set hypershift_jqfilter = '.data."config.json" | fromjson' %}}
{{% set custom_api_path = '{{if ne .hypershift_cluster "None"}}' ~ hypershift_path ~ '{{else}}' ~  default_api_path ~ '{{end}}' %}}
{{% set custom_jqfilter = '{{if ne .hypershift_cluster "None"}}' ~ hypershift_jqfilter ~ '{{else}}' ~  default_jqfilter ~ '{{end}}' %}}
{{% set dump_path = default_api_path ~ ',' ~ default_jqfilter ~ ',' ~ custom_jqfilter %}}

description: |-
  The bindAddress is set by default to <tt>0.0.0.0:6443</tt> on IPv4 clusters
  or <tt>[::]:6443</tt> on IPv6 and dual-stack clusters, and listening with
  TLS enabled.

  <p><strong>中文说明：</strong></p>
  在 IPv4 集群中，bindAddress 默认设置为 <tt>0.0.0.0:6443</tt>；在 IPv6 和双栈集群中，默认设置为 <tt>[::]:6443</tt>，并在启用 TLS 的情况下进行监听。

rationale: |-
  The OpenShift API server is served over HTTPS with authentication and authorization;
  the secure API endpoint is bound to <tt>0.0.0.0:6443</tt> (IPv4) or
  <tt>[::]:6443</tt> (IPv6/dual-stack) by default. In OpenShift, the only
  supported way to access the API server pod is through the load balancer and then through
  the internal service. The value is set by the bindAddress argument under the servingInfo
  parameter.

  <p><strong>中文理由：</strong></p>
  OpenShift API Server 通过启用身份验证和授权的 HTTPS 提供服务；安全的 API 端点默认绑定到 <tt>0.0.0.0:6443</tt>（IPv4）或 <tt>[::]:6443</tt>（IPv6/双栈）。在 OpenShift 中，访问 API Server Pod 的唯一受支持方式是通过负载均衡器，再经由内部服务访问。该值由 servingInfo 参数下的 bindAddress 参数设置。

identifiers:
  cce@ocp4: CCE-83646-0

severity: low

references:
    nerc-cip: CIP-003-8 R6,CIP-004-6 R3,CIP-007-3 R6.1
    nist: CM-6,CM-6(1)
    pcidss: Req-2.2,Req-2.2.3,Req-2.3
    srg: SRG-APP-000516-CTR-001325

platform: not ocp4-on-hypershift-hosted

ocil_clause: '<tt>bindAddress</tt> allows unsecure connections'

ocil: |-
    Run the following command:
    <pre>oc get configmap config -n openshift-kube-apiserver -ojson | jq -r '.data["config.yaml"]' | jq -r '.servingInfo["bindAddress"]'</pre>
    The output should return <pre>0.0.0.0:6443</pre> on IPv4 single-stack clusters
    or <pre>[::]:6443</pre> on IPv6 and dual-stack clusters.

warnings:
- general: |-
    {{{ openshift_filtered_cluster_setting({custom_api_path: dump_path}) | indent(4) }}}

template:
  name: yamlfile_value
  vars:
    ocp_data: "true"
    entity_check: "all"
    filepath: {{{ openshift_filtered_path(default_api_path, default_jqfilter) }}}
    yamlpath: '.servingInfo["bindAddress"]'
    xccdf_variable: var_apiserver_bind_address
    regex_data: "true"
