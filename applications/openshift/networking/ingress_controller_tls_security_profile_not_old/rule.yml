documentation_complete: true


title: "Ensure IngressController is not configured to use Old tlsSecurityProfile"

description: |-
    The configuration <tt>tlsSecurityProfile</tt> specifies TLS configurations
    to be used while establishing connections with the externally exposed
    servers. Though secure transport mode is used for establishing connections,
    the protocols used may not always be strong enough to avoid interception and
    manipulation of the data in transport. TLS Security profile Old should be
    avoided, as it supports vulnerable protocols, ciphers, and algorithms which
    could lead to security breaches.

    To update tlsSecurityProfile from Old to Intermediate use the following command:
    {{% raw %}}<pre>oc patch -n openshift-ingress-operator ingresscontrollers.operator.openshift.io default --type 'json' --patch '[{"op": "add", "path": "/spec/tlsSecurityProfile/intermediate", "value": {}}, {"op": "replace", "path": "/spec/tlsSecurityProfile/type", "value": "Intermediate"}, {"op": "remove", "path": "/spec/tlsSecurityProfile/old"}]'</pre>{{% endraw %}}

    For more information, follow
    OpenShift documentation:
    {{{ weblink(link="https://docs.openshift.com/container-platform/latest/security/tls-security-profiles.html",
                text="the relevant documentation") }}}.

    <p><strong>中文说明：</strong></p>
    <p>配置 <tt>tlsSecurityProfile</tt> 指定与外部公开服务器建立连接时使用的 TLS 配置。尽管连接采用安全传输模式，但所用协议未必始终足够强，无法避免数据在传输过程中被截获和篡改。应避免使用 TLS Security Profile Old，因为它支持存在漏洞的协议、密码套件和算法，可能导致安全泄露。

    使用以下命令将 tlsSecurityProfile 从 Old 更新为 Intermediate：</p>
    <pre>oc patch -n openshift-ingress-operator ingresscontrollers.operator.openshift.io default --type 'json' --patch '[{"op": "add", "path": "/spec/tlsSecurityProfile/intermediate", "value": {}}, {"op": "replace", "path": "/spec/tlsSecurityProfile/type", "value": "Intermediate"}, {"op": "remove", "path": "/spec/tlsSecurityProfile/old"}]'</pre>

    有关更多信息，请参阅<a href="https://docs.openshift.com/container-platform/latest/security/tls-security-profiles.html">相关文档</a>。

rationale: |-
    The authenticity and integrity of the container platform and communication
    between nodes and components must be secure. If an insecure protocol,
    cipher, or algorithms is used, during transmission of data, the data can be
    intercepted and manipulated. To thwart the manipulation of the data during
    transmission secure protocol, cipher and algorithms must be used.

    <p><strong>中文理由：</strong></p>
    <p>容器平台以及节点和组件之间通信的真实性和完整性必须得到安全保障。如果在数据传输期间使用不安全的协议、密码套件或算法，数据可能被截获和篡改。为防止数据在传输过程中被篡改，必须使用安全的协议、密码套件和算法。</p>

severity: medium

identifiers:
    cce@ocp4: CCE-86237-5

references:
    nist: SC-8,SC-8(1)
    srg: SRG-APP-000014-CTR-000040

ocil_clause: 'insecure tlsSecurityProfile is configured for accessing external services through an ingress resource'

ocil: |-
    To check for the configured tlsSecurityProfile use below command:
    <tt>$ oc get -n openshift-ingress-operator ingresscontrollers.operator.openshift.io default -o jsonpath='{.spec.tlsSecurityProfile.type}{"\n"}'</tt>
    The output shows the tlsSecurityProfile configured for IngressController, and
    TLS security profile configured should not be "old".

warnings:
    - general: |-
        {{{ openshift_cluster_setting("/apis/operator.openshift.io/v1/namespaces/openshift-ingress-operator/ingresscontrollers/default") | indent(8) }}}

template:
    name: yamlfile_value
    vars: 
        ocp_data: "true"
        filepath: "/apis/operator.openshift.io/v1/namespaces/openshift-ingress-operator/ingresscontrollers/default"
        yamlpath: ".spec.tlsSecurityProfile.type"
        check_existence: "any_exist"
        values: 
            - value: "Old"
              type: "string"
              operation: "not equal"
