documentation_complete: true


title: 'Verify Group Who Owns The etcd Member Pod Specification File'

description: |-
    {{{ describe_file_group_owner(file="/etc/kubernetes/manifests/etcd-pod.yaml", group="root") }}}

    <p><strong>中文说明：</strong></p>
    确保 <tt>/etc/kubernetes/manifests/etcd-pod.yaml</tt> 的文件所属组为 <tt>root</tt>。

rationale: |-
    The etcd pod specification file controls various parameters that
    set the behavior of the etcd service in the master node. etcd is a
    highly-available key-value store which Kubernetes uses for persistent
    storage of all of its REST API object. You should restrict its file
    permissions to maintain the integrity of the file. The file should be
    writable by only the administrators on the system.

    <p><strong>中文理由：</strong></p>
    etcd Pod 规范文件控制用于设置主节点上 etcd 服务行为的各种参数。etcd 是 Kubernetes 用于持久存储其所有 REST API 对象的高可用键值存储。应限制该文件的权限，以维护其完整性。只有系统管理员应能够写入该文件。

severity: medium

identifiers:
    cce@ocp4: CCE-83664-3

references:
    nerc-cip: CIP-003-8 R6,CIP-004-6 R3,CIP-007-3 R6.1
    nist: CM-6,CM-6(1)
    srg: SRG-APP-000516-CTR-001325

ocil_clause: '{{{ ocil_clause_file_group_owner(file="/etc/kubernetes/manifests/etcd-pod.yaml", group="root") }}}'

ocil: |-
    {{{ ocil_file_group_owner(file="/etc/kubernetes/manifests/etcd-pod.yaml", group="root") }}}

platform: ocp4-master-node

warnings:
    - dependency: |-
        This rule is only applicable for nodes that run the Etcd service.
        The aforementioned service is only running on the nodes labeled
        "master" by default.

template:
    name: file_groupowner
    vars:
        filepath: ^/etc/kubernetes/manifests/etcd-pod.yaml$
        gid_or_name: '0'
        filepath_is_regex: "true"
