documentation_complete: true


title: 'Verify User Who Owns The Kubernetes Scheduler Pod Specification File'

description: |-
    {{{ describe_file_owner(file="/etc/kubernetes/static-pod-resources/kube-scheduler-pod-*/kube-scheduler-pod.yaml", owner="root") }}}

    <p><strong>中文说明：</strong></p>
    要将 <tt>/etc/kubernetes/static-pod-resources/kube-scheduler-pod-*/kube-scheduler-pod.yaml</tt> 的所有者正确设置为 <tt>root</tt>，请运行 <tt>sudo chown root /etc/kubernetes/static-pod-resources/kube-scheduler-pod-*/kube-scheduler-pod.yaml</tt>。

rationale: |-
    The Kubernetes specification file contains information about the configuration of the
    Kubernetes scheduler that is configured on the system. Protection of this file is
    critical for OpenShift security.

    <p><strong>中文理由：</strong></p>
    Kubernetes 规范文件包含有关系统中配置的 Kubernetes 调度器的配置信息。保护该文件对 OpenShift 安全至关重要。

severity: medium

identifiers:
    cce@ocp4: CCE-83393-9

references:
    nerc-cip: CIP-003-8 R6,CIP-004-6 R3,CIP-007-3 R6.1
    nist: CM-6,CM-6(1)
    srg: SRG-APP-000516-CTR-001325

ocil_clause: '{{{ ocil_clause_file_owner(file="/etc/kubernetes/static-pod-resources/kube-scheduler-pod-*/kube-scheduler-pod.yaml", owner="root") }}}'

ocil: |-
    {{{ ocil_file_owner(file="/etc/kubernetes/static-pod-resources/kube-scheduler-pod-*/kube-scheduler-pod.yaml", owner="root") }}}

platform: ocp4-master-node

warnings:
    - dependency: |-
        This rule is only applicable for nodes that run the Kubernetes Scheduler service.
        The aforementioned service is only running on the nodes labeled
        "master" by default.

template:
    name: file_owner
    vars:
        filepath: ^/etc/kubernetes/static-pod-resources/kube-scheduler-pod-.*/kube-scheduler-pod.yaml$
        uid_or_name: '0'
        filepath_is_regex: "true"
