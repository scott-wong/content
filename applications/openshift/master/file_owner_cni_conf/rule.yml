documentation_complete: true


platform: ocp4-node

title: 'Verify User Who Owns The OpenShift Container Network Interface Files'

description: |-
    {{{ describe_file_owner(file="/etc/cni/net.d/*", owner="root") }}}
    This also covers CNI configuration files under <tt>/etc/kubernetes/cni/net.d/</tt>,
    which is the CRI-O network configuration directory (<tt>network_dir</tt>) used by
    OpenShift; on newer releases <tt>/etc/cni/net.d/</tt> may be absent and the active
    configuration lives only under <tt>/etc/kubernetes/cni/net.d/</tt>.

    <p><strong>中文说明：</strong></p>
    <p>要将 <tt>/etc/cni/net.d/*</tt> 的所有者正确设置为 <tt>root</tt>，请运行 <tt>sudo chown root /etc/cni/net.d/*</tt>。
    这还涵盖 <tt>/etc/kubernetes/cni/net.d/</tt> 下的 CNI 配置文件，该目录是 OpenShift 使用的 CRI-O 网络配置目录（<tt>network_dir</tt>）；在较新版本中，<tt>/etc/cni/net.d/</tt> 可能不存在，活动配置仅位于 <tt>/etc/kubernetes/cni/net.d/</tt> 下。</p>

rationale: |-
    CNI (Container Network Interface) files consist of a specification and libraries for
    writing plugins to configure network interfaces in Linux containers, along with a number
    of supported plugins. Allowing writeable access to the files could allow an attacker to modify
    the networking configuration potentially adding a rogue network connection.

    <p><strong>中文理由：</strong></p>
    <p>CNI（Container Network Interface）文件由规范和用于编写插件以配置 Linux 容器网络接口的库及若干受支持的插件组成。允许对这些文件进行可写访问可能使攻击者修改网络配置，并可能添加恶意的网络连接。</p>

severity: medium

identifiers:
    cce@ocp4: CCE-83460-6

references:
    nerc-cip: CIP-003-8 R6,CIP-004-6 R3,CIP-007-3 R6.1
    nist: CM-6,CM-6(1)
    srg: SRG-APP-000516-CTR-001325

ocil_clause: '{{{ ocil_clause_file_owner(file="/etc/cni/net.d/*", owner="root") }}}'

ocil: |-
    {{{ ocil_file_owner(file="/etc/cni/net.d/*", owner="root") }}}

template:
    name: file_owner
    vars:
        filepath: ^/etc/(kubernetes/)?cni/net.d/.*\.(conf|conflist|json)$
        uid_or_name: '0'
        filepath_is_regex: "true"
