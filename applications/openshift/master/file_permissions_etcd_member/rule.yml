documentation_complete: true


title: 'Verify Permissions on the Etcd Member Pod Specification File'

description: |-
    {{{ describe_file_permissions(file="/etc/kubernetes/manifests/etcd-pod.yaml", perms="0600") }}}

    <p><strong>中文说明：</strong></p>
    要正确设置 <tt>/etc/kubernetes/manifests/etcd-pod.yaml</tt> 的权限，请运行 <tt>sudo chmod 0600 /etc/kubernetes/manifests/etcd-pod.yaml</tt>。

rationale: |-
    The etcd pod specification file controls various parameters that
    set the behavior of the etcd service in the master node. etcd is a
    highly-available key-value store which Kubernetes uses for persistent
    storage of all of its REST API object. You should restrict its file
    permissions to maintain the integrity of the file. The file should be
    writable by only the administrators on the system.

    <p><strong>中文理由：</strong></p>
    etcd pod 规范文件控制用于设置主节点上 etcd 服务行为的各种参数。etcd 是 Kubernetes 用于持久存储其所有 REST API 对象的高可用键值存储。应限制该文件的权限以保持文件完整性。该文件应仅允许系统管理员写入。

severity: medium

identifiers:
    cce@ocp4: CCE-83973-8

references:
    nerc-cip: CIP-003-8 R6,CIP-004-6 R3,CIP-007-3 R6.1
    nist: CM-6,CM-6(1)
    srg: SRG-APP-000516-CTR-001325

ocil_clause: '{{{ ocil_clause_file_permissions(file="/etc/kubernetes/manifests/etcd-pod.yaml", perms="-rw-------") }}}'

ocil: |-
    {{{ ocil_file_permissions(file="/etc/kubernetes/manifests/etcd-pod.yaml", perms="-rw-------") }}}

platform: ocp4-master-node

warnings:
    - dependency: |-
        This rule is only applicable for nodes that run the Etcd service.
        The aforementioned service is only running on the nodes labeled
        "master" by default.

template:
    name: file_permissions
    vars:
        filepath: ^/etc/kubernetes/manifests/etcd-pod.yaml$
        filemode: '0600'
        filepath_is_regex: "true"
