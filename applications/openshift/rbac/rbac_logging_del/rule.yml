documentation_complete: true


title: 'Ensure that the ClusterLogging and ClusterLoggingForwarder resources are protected from unauthorized deletion'

description: |-
    The ClusterLogging and ClusterLoggingForwarder Custom Resources provide 
    a way to configure the logging forwarding subsystem and delete access to it
    should be restricted to as-needed basis.

    {{{ fix_openshift_logging_rbac("delete") | indent(4) }}}}

    <p><strong>中文说明：</strong></p>
    ClusterLogging 和 ClusterLoggingForwarder Custom Resource 提供配置日志转发子系统的方法，对其 <tt>delete</tt> 访问权限应仅按需授予。

    通过执行以下一项或多项命令，从任何未授权用户或组中移除 <tt>delete</tt> 权限：

    * 从用户移除角色
    > <tt>oc adm policy remove-role-from-user ROLE USER -n openshift-logging</tt>

    * 从组移除角色
    > <tt>oc adm policy remove-role-from-group ROLE GROUP -n openshift-logging</tt>

    * 从用户移除集群角色
    > <tt>oc adm policy remove-cluster-role-from-user CLUSTER_ROLE USER -n openshift-logging</tt>

    * 从组移除集群角色
    > <tt>oc adm policy remove-cluster-role-from-group CLUSTER_ROLE GROUP -n openshift-logging</tt>

    其中 ROLE/CLUSTER_ROLE 是授予用户在 <tt>openshift-logging</tt> 命名空间中资源 <tt>delete</tt> 权限的角色。

rationale: |-
    Protecting audit data also includes identifying and protecting the tools used to view and
    manipulate log data. Therefore, protecting audit tools is necessary to prevent unauthorized
    operation on audit data.

    <p><strong>中文理由：</strong></p>
    保护审计数据还包括识别并保护用于查看和操作日志数据的工具。因此，必须保护审计工具，以防止对审计数据进行未授权操作。

severity: medium

